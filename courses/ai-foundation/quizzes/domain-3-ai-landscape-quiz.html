<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0"/>
<title>UKAIC AI Foundation, Domain 3 Quiz, The AI Landscape & Generative AI</title>
<style>
:root{--navy:#002b5c;--ink:#0d1b2a;--ok:#2e7d32;--bad:#c62828;--line:#c9d4e4;--bg:#ffffff;--tint:#eef3fa;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);
font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.6;}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;
padding:12px 20px;z-index:999;font-weight:bold;text-decoration:none;}
.skip-link:focus{left:0;}
header[role="banner"]{background:var(--navy);color:#fff;padding:14px 24px;}
header[role="banner"] h1{margin:0;font-size:1.15rem;font-weight:bold;letter-spacing:.2px;}
header[role="banner"] .sub{font-size:.85rem;opacity:.9;margin-top:3px;}
main[role="main"]{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
margin-bottom:8px;font-size:1rem;font-weight:bold;}
.progress-outer{height:14px;background:var(--tint);border:1px solid var(--line);
border-radius:8px;overflow:hidden;margin-bottom:26px;}
.progress-inner{height:100%;width:0;background:var(--navy);
transition:width .3s ease;}
@media (prefers-reduced-motion: reduce){.progress-inner{transition:none;}}
.qtext{font-size:1.3rem;font-weight:bold;margin:0 0 20px;line-height:1.45;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
background:var(--tint);border:2px solid var(--line);border-radius:10px;
padding:15px 17px;margin-bottom:12px;font-size:1.05rem;color:var(--ink);
font-family:inherit;cursor:pointer;line-height:1.5;}
.opt:hover:not(:disabled){background:#dde7f5;border-color:#9db3d0;}
.opt:disabled{cursor:default;}
.opt:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
.opt.correct{background:#dff3e1;border-color:var(--ok);}
.opt.wrong{background:#fbe3e3;border-color:var(--bad);}
.opt-letter{font-weight:bold;color:#4a6a8a;flex-shrink:0;width:24px;}
.opt.correct .opt-letter{color:var(--ok);}
.opt.wrong .opt-letter{color:var(--bad);}
.op-text{flex:1;}
.tag{font-weight:bold;font-size:.85rem;margin-left:8px;white-space:nowrap;}
.tag.correct{color:var(--ok);}
.tag.wrong{color:var(--bad);}
.analysis{margin-top:16px;padding:16px 18px;border-left:6px solid var(--navy);
background:var(--tint);border-radius:0 8px 8px 0;}
.analysis h3{margin:0 0 10px;font-size:1rem;text-transform:uppercase;
letter-spacing:.5px;}
.analysis p{margin:0 0 9px;font-size:.97rem;}
.analysis p:last-child{margin-bottom:0;}
.analysis .why{font-weight:bold;}
.analysis .good{color:var(--ok);}
.analysis .bad{color:var(--bad);}
.navrow{margin-top:26px;}
button.primary{background:var(--navy);color:#fff;border:none;border-radius:8px;
padding:15px 30px;font-size:1.05rem;font-weight:bold;cursor:pointer;
font-family:inherit;}
button.primary:hover{background:#00408a;}
button.primary:focus-visible{outline:3px solid #002b5c;outline-offset:3px;}
button.primary:disabled{background:#9db3d0;cursor:not-allowed;}
button.submit{background:var(--ok);}
button.submit:hover{background:#1f5b23;}
.verdict{font-size:1.15rem;font-weight:bold;margin:0 0 18px;padding:14px 18px;
border-radius:8px;}
.verdict.ok{background:#dff3e1;color:#1f5b23;border:2px solid var(--ok);}
.verdict.no{background:#fbe3e3;color:#8c1c1c;border:2px solid var(--bad);}
#results{display:none;text-align:center;}
.gauge{width:230px;height:230px;border-radius:50%;margin:0 auto 26px;
display:flex;align-items:center;justify-content:center;flex-direction:column;}
.gauge .pct{font-size:3.2rem;font-weight:bold;line-height:1;}
.gauge .lbl{font-size:.95rem;margin-top:6px;letter-spacing:1px;}
.grid{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px 0;}
.cell{border:2px solid var(--line);border-radius:10px;padding:16px 26px;min-width:130px;}
.cell .n{font-size:2rem;font-weight:bold;display:block;}
.cell .t{font-size:.9rem;text-transform:uppercase;letter-spacing:.5px;}
.cell.good{border-color:var(--ok);} .cell.good .n{color:var(--ok);}
.cell.bad{border-color:var(--bad);} .cell.bad .n{color:var(--bad);}
.note{font-size:.95rem;color:#3d5878;max-width:640px;margin:0 auto 22px;}
/* Assessment integrity: selection and copy are disabled on question content. */
#qholder,#results,.analysis,.opt{-webkit-user-select:none;-moz-user-select:none;
  -ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
#quiz,#results{-webkit-user-drag:none;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:13px 24px;border-radius:8px;
  font-size:.95rem;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:9999;display:none;}
.toast.show{display:block;}
@media (prefers-reduced-motion: no-preference){.toast{transition:opacity .2s ease;}}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<header role="banner">
  <h1>UKAIC AI Foundation, Domain 3 Quiz, The AI Landscape & Generative AI</h1>
  <div class="sub">14 questions · Pass standard 70%</div>
  <a href="/courses/" style="display:inline-block;margin-top:6px;color:#fff;font-weight:bold;text-decoration:underline;">&#8592; Courses</a>
</header>
<main role="main" id="main">
  <div id="quiz">
    <div class="bar">
      <span id="counter" role="status" aria-live="polite">Question 1 of 14</span>
      <span id="running" aria-live="polite">Score: 0 / 0</span>
    </div>
    <div class="progress-outer" role="progressbar" aria-labelledby="counter"
         aria-valuemin="0" aria-valuemax="14" aria-valuenow="0" id="pbar">
      <div class="progress-inner" id="pinner"></div>
    </div>
    <div id="qholder"></div>
    <div class="navrow">
      <button class="primary" id="next" type="button">Next question &rarr;</button>
      <button class="primary submit" id="submit" type="button"
              style="display:none">Submit assessment</button>
    </div>
  </div>
  <div id="results" role="region" aria-label="Assessment results">
    <div class="gauge" id="gauge"><span class="pct" id="pct">0%</span>
      <span class="lbl" id="verdictlbl">, </span></div>
    <div class="grid">
      <div class="cell good"><span class="n" id="ncorrect">0</span>
        <span class="t">Correct</span></div>
      <div class="cell bad"><span class="n" id="nwrong">0</span>
        <span class="t">Incorrect</span></div>
      <div class="cell"><span class="n" id="ntotal">0</span>
        <span class="t">Total</span></div>
    </div>
    <p class="note" id="dignote"></p>
    <ul id="missed" style="text-align:left;max-width:760px;margin:0 auto 24px;
      padding-left:22px;font-size:.98rem;"></ul>
    <button class="primary" id="restart" type="button">Restart assessment</button>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script data-cfasync="false">
var Q = [{"q":"What does 'generative' mean in the context of AI?","opts":["The system generates training data to improve itself automatically.","The system generates revenue by automating work previously done by staff. This is a plausible-sounding but incorrect description.","The system generates explanations of decisions it has already made.","The system produces new content rather than classifying or labelling existing content."],"ans":3,"exp":"Correct. Generative means producing new content. The contrast is with discriminative tasks that assign a label or category to input that already exists.","why":["Incorrect. Self-training is not what generative refers to. The term describes producing content for a user, not improving the model.","Incorrect. This is a commercial framing, not a technical one. 'Generative' describes the model's behaviour, not its business effect.","Incorrect. Producing explanations is one possible output, not the definition. Explanation is a use case within generation.","Correct. Generative means producing new content. The contrast is with discriminative tasks that assign a label or category to input that already exists."]},{"q":"Which task is classifying rather than generating?","opts":["Assigning an incoming support ticket to one of six predefined categories.","Writing a first draft of a customer apology letter.","Composing a summary of a long report in plain language. This is a common misconception rather than the accurate position.","Producing a set of alternative product slogans."],"ans":0,"exp":"Correct. Sorting tickets into fixed categories is classification: the output is a label chosen from a known set, not new content.","why":["Correct. Sorting tickets into fixed categories is classification: the output is a label chosen from a known set, not new content.","Incorrect. Drafting a letter produces new text and is a generative task.","Incorrect. Summarising produces new condensed content and is generative.","Incorrect. Producing slogan options creates new content and is generative."]},{"q":"Which list correctly names major generative AI output types?","opts":["Text, encryption, compression and indexing.","Text, image, audio, video and code.","Text, spreadsheets, databases and networks.","Text, searching, sorting and filtering."],"ans":1,"exp":"Correct. These are the major output types at Foundation level. Code is included as a distinct type because it is both generated and executable, which raises its own risks.","why":["Incorrect. Encryption, compression and indexing are operations on data. They are not generative outputs.","Correct. These are the major output types at Foundation level. Code is included as a distinct type because it is both generated and executable, which raises its own risks.","Incorrect. Spreadsheets, databases and networks are not output types. They are file formats or systems.","Incorrect. These are data operations. They neither create content nor constitute output types."]},{"q":"Why does generated code carry risks beyond those of generated text?","opts":["Code is generated by a different class of model with no safeguards.","Code is always longer than text, so it fills the context window faster. This is a plausible-sounding but incorrect description.","Code can be executed, so a plausible error may run rather than merely read.","Code cannot be reviewed by a person without programming training."],"ans":2,"exp":"Correct. Text that is wrong is read and rejected; code that is wrong may execute. Plausible-looking code can contain security flaws or subtle logic errors that only surface at runtime.","why":["Incorrect. Safeguards vary by provider and configuration, not by output type. There is no separate class of model for code.","Incorrect. Length is not the issue. The distinguishing risk is executability, not volume.","Correct. Text that is wrong is read and rejected; code that is wrong may execute. Plausible-looking code can contain security flaws or subtle logic errors that only surface at runtime.","Incorrect. Code can be reviewed, and the people best placed to review it are the developers who will run it. That review is the control."]},{"q":"At awareness level, what is a foundation model?","opts":["A model that cannot be adapted and is used exactly as supplied.","The first model a company ever trains, on which later work is based. This is a common misconception rather than the accurate position.","A model that establishes the minimum standard for safety compliance.","A large, general-purpose model that can be adapted to many different tasks."],"ans":3,"exp":"Correct. Foundation models are trained broadly and then adapted to specific tasks through prompting, fine-tuning or retrieval. Their value is generality of starting point.","why":["Incorrect. Adaptability is the defining feature. A model that cannot be adapted would not be a foundation model.","Incorrect. 'Foundation' refers to breadth of capability, not to chronological first-ness for an organisation.","Incorrect. Safety standards are set by regulators and policy, not by a class of model.","Correct. Foundation models are trained broadly and then adapted to specific tasks through prompting, fine-tuning or retrieval. Their value is generality of starting point."]},{"q":"At awareness level, what does multimodal mean?","opts":["The system handles more than one type of input or output.","The system runs on more than one server at the same time.","The system supports more than one language for text.","The system can be used by more than one person at once."],"ans":0,"exp":"Correct. Multimodal means multiple modes, for example, accepting an image and text as input, or producing both speech and text as output.","why":["Correct. Multimodal means multiple modes, for example, accepting an image and text as input, or producing both speech and text as output.","Incorrect. Distribution across servers is an infrastructure matter and has nothing to do with modality.","Incorrect. Multiple languages are still one modality: text. Multimodality concerns types of data, not languages.","Incorrect. Multi-user access is a service characteristic, not a modality."]},{"q":"What problem does retrieval-augmented generation (RAG) primarily address?","opts":["The speed problem: generating answers more quickly than a base model.","The grounding problem: generating answers that are anchored in relevant sources.","The cost problem: reducing the computing power required for each answer. This is a plausible-sounding but incorrect description.","The privacy problem: stopping personal data from reaching the model."],"ans":1,"exp":"Correct. RAG retrieves relevant sources and generates an answer grounded in them, so the response is anchored to supplied content rather than to parameters alone.","why":["Incorrect. Retrieval adds a step, so it is typically slower than a single pass through the model.","Correct. RAG retrieves relevant sources and generates an answer grounded in them, so the response is anchored to supplied content rather than to parameters alone.","Incorrect. RAG adds operations, so it generally increases rather than reduces cost per answer.","Incorrect. Data governance is a separate concern. RAG changes where answers come from, not what the service does with inputs."]},{"q":"How does RAG affect the risk of error?","opts":["It increases the risk, because retrieved documents confuse the model.","It removes the risk entirely, because answers are taken from real documents. This is a common misconception rather than the accurate position.","It reduces the risk rather than removing it, because sources can be wrong or irrelevant.","It has no effect on the risk, because the model still generates the wording."],"ans":2,"exp":"Correct. This is the exam-critical nuance. Grounding improves freshness and provenance, but a bad or outdated source is faithfully propagated and the retrieved material may be off-topic.","why":["Incorrect. Well-implemented retrieval improves accuracy. The risk rises only when sources are poor, stale or conflicting.","Incorrect. 'Grounded' does not mean 'correct'. RAG systems are only as good as the knowledge base behind them.","Correct. This is the exam-critical nuance. Grounding improves freshness and provenance, but a bad or outdated source is faithfully propagated and the retrieved material may be off-topic.","Incorrect. RAG has a substantial effect. It changes what evidence the answer rests on, even though errors remain possible."]},{"q":"A RAG assistant answers from an outdated internal policy document. What does this illustrate?","opts":["The context window was exceeded, so the policy content was discarded.","Retrieval failed because the model refused to read the document provided. This confuses a related concept with the one being tested.","The model hallucinated because it had no document to work from at all.","Grounding propagates the quality of the source, so stale sources produce stale answers."],"ans":3,"exp":"Correct. RAG is only as good as its knowledge base. An outdated document is retrieved and faithfully reflected, so the answer is grounded and wrong.","why":["Incorrect. Window capacity is not implicated. The answer was produced from a retrieved source, just an out-of-date one.","Incorrect. Retrieval succeeded, that is the problem. The system found and used the wrong version.","Incorrect. Hallucination means generation without grounding. Here the answer was grounded, but in poor material, which is a different failure.","Correct. RAG is only as good as its knowledge base. An outdated document is retrieved and faithfully reflected, so the answer is grounded and wrong."]},{"q":"At awareness level, how is an AI agent distinct from a single-turn assistant?","opts":["An agent pursues a goal over multiple steps and can use tools along the way.","An agent is a model with more parameters and therefore greater accuracy. This is a plausible-sounding but incorrect description.","An agent is an assistant that has been given a longer context window.","An agent is an assistant that has been approved for enterprise use."],"ans":0,"exp":"Correct. The distinguishing features are multi-step operation, goal pursuit, and tool use. An agent chains actions rather than returning one response.","why":["Correct. The distinguishing features are multi-step operation, goal pursuit, and tool use. An agent chains actions rather than returning one response.","Incorrect. Parameter count is an architectural detail and does not define agency. A large model can still be a single-turn assistant.","Incorrect. Context length is a capacity limit, not a capability. Longer windows do not create agency.","Incorrect. Approval is a governance status. It says nothing about whether the system acts autonomously."]},{"q":"Why do agents that take actions require greater human oversight?","opts":["They are legally classified as autonomous decision-makers under UK law. This is a common misconception rather than the accurate position.","They can change systems and data, so an error can cause effects beyond a bad answer.","They consume far more electricity than single-turn assistants do.","They cannot be monitored once they begin executing a task."],"ans":1,"exp":"Correct. A wrong answer wastes time; a wrong action can send money, delete records or notify a customer. Capability to act is what raises the oversight requirement.","why":["Incorrect. Legal classification is not the driver. Accountability remains with the human or organisation deploying the agent.","Correct. A wrong answer wastes time; a wrong action can send money, delete records or notify a customer. Capability to act is what raises the oversight requirement.","Incorrect. Resource consumption is an infrastructure concern, not the reason oversight increases. The reason is consequence.","Incorrect. Agents can and should be logged and monitored. The need is for oversight gates and audit trails, not resignation to blindness."]},{"q":"At awareness level, how should the model, the application, and the service be distinguished?","opts":["The three terms are interchangeable and describe the same component.","The model is the interface, the application is the engine, and the service is the licence. This confuses a related concept with the one being tested.","The model is the engine, the application is the interface, and the service is the managed offering.","The model is the licence, the application is the engine, and the service is the interface."],"ans":2,"exp":"Correct. The engine generates, the interface is what the user operates, and the service is how it is delivered and supported. Distinguishing them clarifies what is being procured and assessed.","why":["Incorrect. They are distinct layers. Treating them as one obscures which party is responsible for what.","Incorrect. This reverses the model and the application. The engine is the model, not the interface.","Correct. The engine generates, the interface is what the user operates, and the service is how it is delivered and supported. Distinguishing them clarifies what is being procured and assessed.","Incorrect. A licence is a commercial instrument. The model is a technical artefact."]},{"q":"What is a key trade-off of open-weight, self-hosted AI compared with hosted options?","opts":["Stronger safety features in exchange for less control over configuration. This is a plausible-sounding but incorrect description.","Better accuracy in exchange for a higher subscription cost per user.","Faster responses in exchange for a permanent internet dependency.","More control and data residency, in exchange for setup and maintenance effort."],"ans":3,"exp":"Correct. Self-hosting buys control over where data lives and how the system is configured, and it costs you the infrastructure, expertise and ongoing upkeep.","why":["Incorrect. Safety features are a property of the model and its configuration, and self-hosting generally increases rather than reduces control.","Incorrect. Accuracy depends on the model and task, not on hosting model. A hosted service is not inherently more accurate.","Incorrect. Self-hosting typically removes internet dependency rather than creating it.","Correct. Self-hosting buys control over where data lives and how the system is configured, and it costs you the infrastructure, expertise and ongoing upkeep."]},{"q":"When selecting an AI tool, which combination of factors should drive the decision?","opts":["Capability, cost, data sensitivity and organisational approval.","Brand recognition, marketing claims, user count and release date.","Parameter count, training cost, model size and vendor revenue.","Interface design, mobile support, colour scheme and font choices."],"ans":0,"exp":"Correct. These four factors are the syllabus's selection criteria, and data sensitivity plus organisational approval are the ones most often skipped in practice.","why":["Correct. These four factors are the syllabus's selection criteria, and data sensitivity plus organisational approval are the ones most often skipped in practice.","Incorrect. These are commercial signals, not capability assessments. Popularity does not establish fitness for a task.","Incorrect. These are technical and commercial internals, outside Foundation scope, and they do not establish suitability for a use case.","Incorrect. Presentation choices matter for adoption but say nothing about capability, risk or approval."]}];
var PASS = 70;
var L = ["A","B","C","D"];
var cur = 0, answered = [], correct = [], submitted = false;

// Randomise question order on every attempt so the sequence cannot be memorised
// from a screenshot. Uses the same RNG discipline as the accessible quiz standard.
(function shuffleQuestions(){
  var seed = Date.now() % 2147483647;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = Q.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = Q[i]; Q[i] = Q[j]; Q[j] = t;
  }
})();

// --- Copy / cut / paste attenuation -------------------------------------------------
// Assessment integrity: discourage copying questions out and pasting answers in.
// This is a deterrent, NOT a security control, a determined user can defeat it via
// devtools. It stops casual text harvesting and pasted-in answers during a sitting.
(function blockClipboard(){
  function stop(e){
    e.preventDefault();
    showToast('Copying, cutting and pasting are disabled during this assessment.');
    return false;
  }
  ['copy','cut','paste','contextmenu'].forEach(function(evt){
    document.addEventListener(evt, stop, true);
  });
  // Disable text selection inside the question and analysis areas only, so that
  // the skip link and buttons remain fully keyboard accessible.
  var style = document.createElement('style');
  style.textContent = '#qholder, #results { -webkit-user-select:none; -moz-user-select:none;'
                    + ' -ms-user-select:none; user-select:none; }';
  document.head.appendChild(style);
})();

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

var qlen = Q.length;
for (var i = 0; i < qlen; i++){ answered.push(false); correct.push(false); }

function el(id){ return document.getElementById(id); }

function render(){
  var q = Q[cur];
  var h = '<h2 class="qtext" id="qt">' + q.q + '</h2>';
  h += '<div role="radiogroup" aria-labelledby="qt">';
  for (var j = 0; j < q.opts.length; j++){
    h += '<button class="opt" type="button" role="radio" aria-checked="false" '
       + 'data-q="' + cur + '" data-o="' + j + '" id="o' + cur + '_' + j + '">'
       + '<span class="opt-letter">' + L[j] + '.</span>'
       + '<span class="op-text">' + q.opts[j] + '</span>'
       + '<span class="tag" id="t' + cur + '_' + j + '"></span></button>';
  }
  h += '</div><div id="ex' + cur + '"></div>';
  el('qholder').innerHTML = h;
  var btns = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', onPick);
  }
  var last = (cur === qlen - 1);
  el('next').style.display = last ? 'none' : '';
  el('submit').style.display = last ? '' : 'none';
  el('next').disabled = !answered[cur];
  el('submit').disabled = !answered[cur];
  updateBar();
}

function onPick(e){
  var b = e.currentTarget;
  var qi = parseInt(b.getAttribute('data-q'), 10);
  var oi = parseInt(b.getAttribute('data-o'), 10);
  if (answered[qi]) return;
  answered[qi] = true;
  var q = Q[qi];
  var isRight = (oi === q.ans);
  correct[qi] = isRight;
  var all = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < all.length; k++){
    var kq = parseInt(all[k].getAttribute('data-q'), 10);
    var ko = parseInt(all[k].getAttribute('data-o'), 10);
    if (kq !== qi) continue;
    all[k].disabled = true;
    all[k].setAttribute('aria-checked', ko === oi ? 'true' : 'false');
    var tg = el('t' + kq + '_' + ko);
    if (ko === q.ans){
      all[k].classList.add('correct');
      if (tg) tg.textContent = ko === oi ? '✓ Correct' : '✓ This was correct';
      if (tg) tg.className = 'tag correct';
    } else if (ko === oi){
      all[k].classList.add('wrong');
      if (tg) tg.textContent = '✗ Your answer';
      if (tg) tg.className = 'tag wrong';
    }
  }
  renderAnalysis(qi);
  var done = 0;
  for (var m = 0; m < qlen; m++){ if (answered[m]) done++; }
  el('running').textContent = 'Score: ' + tally() + ' / ' + done;
  el('next').disabled = false;
  el('submit').disabled = false;
  updateBar();
}

function renderAnalysis(qi){
  var q = Q[qi];
  var h = '<div class="analysis"><h3>Why each option is right or wrong</h3>';
  h += '<p class="why good">Correct answer: ' + L[q.ans] + '. '
     + q.opts[q.ans] + '</p><p>' + q.exp + '</p>';
  for (var j = 0; j < q.opts.length; j++){
    h += '<p><span class="why">' + L[j] + '.</span> ' + q.why[j] + '</p>';
  }
  h += '</div>';
  el('ex' + qi).innerHTML = h;
}

function tally(){
  var n = 0;
  for (var i = 0; i < qlen; i++){ if (correct[i]) n++; }
  return n;
}

function updateBar(){
  el('counter').textContent = 'Question ' + (cur + 1) + ' of ' + qlen;
  var pct = Math.round(((cur + 1) / qlen) * 100);
  el('pinner').style.width = pct + '%';
  var pb = el('pbar');
  if (pb){ pb.setAttribute('aria-valuenow', String(cur + 1)); }
}

el('next').addEventListener('click', function(){
  if (cur < qlen - 1){ cur++; render(); }
});
el('submit').addEventListener('click', function(){ showResults(false); });

function mark(){
  var c = tally();
  var p = Math.round((c / qlen) * 100);
  el('pct').textContent = p + '%';
  el('ncorrect').textContent = c;
  el('nwrong').textContent = qlen - c;
  el('ntotal').textContent = qlen;
  var g = el('gauge');
  var pass = (p >= PASS);
  g.style.background = pass ? '#dff3e1' : '#fbe3e3';
  g.style.border = '8px solid ' + (pass ? '#2e7d32' : '#c62828');
  el('verdictlbl').textContent = pass ? 'PASS' : 'NOT YET';
  el('verdictlbl').style.color = pass ? '#2e7d32' : '#c62828';
  el('pct').style.color = pass ? '#2e7d32' : '#c62828';
  el('dignote').textContent = pass
    ? 'You have met the pass standard for this section. Revisit any missed items below, then move on.'
    : 'Below the pass standard of ' + PASS + '%. Review each missed item below and retake when ready.';
  var ul = el('missed');
  ul.innerHTML = '';
  var missed = 0;
  for (var i = 0; i < qlen; i++){
    if (!correct[i]){
      missed++;
      var li = document.createElement('li');
      li.style.marginBottom = '8px';
      li.textContent = Q[i].q + ', correct: ' + L[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans];
      ul.appendChild(li);
    }
  }
  if (missed === 0){
    var li2 = document.createElement('li');
    li2.textContent = 'No missed items.';
    ul.appendChild(li2);
  }
}

function showResults(force){
  if (submitted && !force) return;
  submitted = true;
  mark();
  el('quiz').style.display = 'none';
  el('results').style.display = 'block';
  window.scrollTo(0, 0);
}

el('restart').addEventListener('click', function(){
  var p = window.prompt('Enter supervisor passcode to reset this assessment:');
  if (p !== '1234'){
    if (p !== null){ window.alert('Incorrect passcode. Assessment not reset.'); }
    return;
  }
  location.reload();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && !answered[cur] === false && cur < qlen - 1){
    e.preventDefault(); cur++; render();
  }
});

// ---- Assessment integrity guard ----
// Deterrent only: browser menus can bypass keyboard blocks and the HTML source
// always contains the questions. Pair with invigilation for real integrity.
(function integrityGuard(){
  var tc = null;
  function toast(msg){
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (tc) clearTimeout(tc);
    tc = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function block(e, msg){
    e.preventDefault();
    e.stopPropagation();
    toast(msg || 'Copying is disabled on this assessment.');
    return false;
  }
  document.addEventListener('contextmenu', function(e){ block(e); });
  document.addEventListener('copy', function(e){ block(e); });
  document.addEventListener('cut', function(e){ block(e); });
  document.addEventListener('dragstart', function(e){ block(e, 'Dragging is disabled.'); });
  document.addEventListener('selectstart', function(e){
    var n = e.target;
    while (n && n !== document.body){
      if (n.id === 'qholder' || n.id === 'results' ||
          (n.classList && (n.classList.contains('opt') || n.classList.contains('analysis')))){
        block(e, 'Selecting question text is disabled.');
        return;
      }
      n = n.parentNode;
    }
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'a' || k === 'u' || k === 's' || k === 'p')){
      block(e); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){
      block(e, 'Developer tools are disabled.'); return;
    }
    if (e.key === 'F12'){ block(e, 'Developer tools are disabled.'); }
  }, true);
})();

render();
</script>
<script data-cfasync="false">

  function setup(){
    if(!native()){return;}
    var App = window.Capacitor.Plugins && window.Capacitor.Plugins.App; if(!App){return;}
    var t=null,b=0;
    function toast(m){ if(!t){t=document.createElement('div'); t.className='app-toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.classList.add('show'); clearTimeout(t._z); t._z=setTimeout(function(){t.classList.remove('show');},2200); }
    App.addListener('backButton', function(info){ var cb=info&&info.canGoBack;
      if(cb){ if(window.history.length>1){window.history.back();} else {window.location.href=window.location.origin+'/';} return; }
      var n=Date.now(); if(n-b<2200){App.exitApp(); return;} b=n; toast('Press back again to exit');
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',setup);}else{setup();}
})();
</script>
