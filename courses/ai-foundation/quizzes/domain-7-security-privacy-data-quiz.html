<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0"/>
<title>UKAIC AI Foundation, Domain 7 Quiz, AI Security, Privacy & Data</title>
<style>
:root{--navy:#002b5c;--ink:#0d1b2a;--ok:#2e7d32;--bad:#c62828;--line:#c9d4e4;--bg:#ffffff;--tint:#eef3fa;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);
font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.6;}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;
padding:12px 20px;z-index:999;font-weight:bold;text-decoration:none;}
.skip-link:focus{left:0;}
header[role="banner"]{background:var(--navy);color:#fff;padding:14px 24px;}
header[role="banner"] h1{margin:0;font-size:1.15rem;font-weight:bold;letter-spacing:.2px;}
header[role="banner"] .sub{font-size:.85rem;opacity:.9;margin-top:3px;}
main[role="main"]{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
margin-bottom:8px;font-size:1rem;font-weight:bold;}
.progress-outer{height:14px;background:var(--tint);border:1px solid var(--line);
border-radius:8px;overflow:hidden;margin-bottom:26px;}
.progress-inner{height:100%;width:0;background:var(--navy);
transition:width .3s ease;}
@media (prefers-reduced-motion: reduce){.progress-inner{transition:none;}}
.qtext{font-size:1.3rem;font-weight:bold;margin:0 0 20px;line-height:1.45;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
background:var(--tint);border:2px solid var(--line);border-radius:10px;
padding:15px 17px;margin-bottom:12px;font-size:1.05rem;color:var(--ink);
font-family:inherit;cursor:pointer;line-height:1.5;}
.opt:hover:not(:disabled){background:#dde7f5;border-color:#9db3d0;}
.opt:disabled{cursor:default;}
.opt:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
.opt.correct{background:#dff3e1;border-color:var(--ok);}
.opt.wrong{background:#fbe3e3;border-color:var(--bad);}
.opt-letter{font-weight:bold;color:#4a6a8a;flex-shrink:0;width:24px;}
.opt.correct .opt-letter{color:var(--ok);}
.opt.wrong .opt-letter{color:var(--bad);}
.op-text{flex:1;}
.tag{font-weight:bold;font-size:.85rem;margin-left:8px;white-space:nowrap;}
.tag.correct{color:var(--ok);}
.tag.wrong{color:var(--bad);}
.analysis{margin-top:16px;padding:16px 18px;border-left:6px solid var(--navy);
background:var(--tint);border-radius:0 8px 8px 0;}
.analysis h3{margin:0 0 10px;font-size:1rem;text-transform:uppercase;
letter-spacing:.5px;}
.analysis p{margin:0 0 9px;font-size:.97rem;}
.analysis p:last-child{margin-bottom:0;}
.analysis .why{font-weight:bold;}
.analysis .good{color:var(--ok);}
.analysis .bad{color:var(--bad);}
.navrow{margin-top:26px;}
button.primary{background:var(--navy);color:#fff;border:none;border-radius:8px;
padding:15px 30px;font-size:1.05rem;font-weight:bold;cursor:pointer;
font-family:inherit;}
button.primary:hover{background:#00408a;}
button.primary:focus-visible{outline:3px solid #002b5c;outline-offset:3px;}
button.primary:disabled{background:#9db3d0;cursor:not-allowed;}
button.submit{background:var(--ok);}
button.submit:hover{background:#1f5b23;}
.verdict{font-size:1.15rem;font-weight:bold;margin:0 0 18px;padding:14px 18px;
border-radius:8px;}
.verdict.ok{background:#dff3e1;color:#1f5b23;border:2px solid var(--ok);}
.verdict.no{background:#fbe3e3;color:#8c1c1c;border:2px solid var(--bad);}
#results{display:none;text-align:center;}
.gauge{width:230px;height:230px;border-radius:50%;margin:0 auto 26px;
display:flex;align-items:center;justify-content:center;flex-direction:column;}
.gauge .pct{font-size:3.2rem;font-weight:bold;line-height:1;}
.gauge .lbl{font-size:.95rem;margin-top:6px;letter-spacing:1px;}
.grid{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px 0;}
.cell{border:2px solid var(--line);border-radius:10px;padding:16px 26px;min-width:130px;}
.cell .n{font-size:2rem;font-weight:bold;display:block;}
.cell .t{font-size:.9rem;text-transform:uppercase;letter-spacing:.5px;}
.cell.good{border-color:var(--ok);} .cell.good .n{color:var(--ok);}
.cell.bad{border-color:var(--bad);} .cell.bad .n{color:var(--bad);}
.note{font-size:.95rem;color:#3d5878;max-width:640px;margin:0 auto 22px;}
/* Assessment integrity: selection and copy are disabled on question content. */
#qholder,#results,.analysis,.opt{-webkit-user-select:none;-moz-user-select:none;
  -ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
#quiz,#results{-webkit-user-drag:none;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:13px 24px;border-radius:8px;
  font-size:.95rem;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:9999;display:none;}
.toast.show{display:block;}
@media (prefers-reduced-motion: no-preference){.toast{transition:opacity .2s ease;}}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<header role="banner">
  <h1>UKAIC AI Foundation, Domain 7 Quiz, AI Security, Privacy & Data</h1>
  <div class="sub">12 questions · Pass standard 70%</div>
  <a href="/courses/" style="display:inline-block;margin-top:6px;color:#fff;font-weight:bold;text-decoration:underline;">&#8592; Courses</a>
</header>
<main role="main" id="main">
  <div id="quiz">
    <div class="bar">
      <span id="counter" role="status" aria-live="polite">Question 1 of 12</span>
      <span id="running" aria-live="polite">Score: 0 / 0</span>
    </div>
    <div class="progress-outer" role="progressbar" aria-labelledby="counter"
         aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="pbar">
      <div class="progress-inner" id="pinner"></div>
    </div>
    <div id="qholder"></div>
    <div class="navrow">
      <button class="primary" id="next" type="button">Next question &rarr;</button>
      <button class="primary submit" id="submit" type="button"
              style="display:none">Submit assessment</button>
    </div>
  </div>
  <div id="results" role="region" aria-label="Assessment results">
    <div class="gauge" id="gauge"><span class="pct" id="pct">0%</span>
      <span class="lbl" id="verdictlbl">, </span></div>
    <div class="grid">
      <div class="cell good"><span class="n" id="ncorrect">0</span>
        <span class="t">Correct</span></div>
      <div class="cell bad"><span class="n" id="nwrong">0</span>
        <span class="t">Incorrect</span></div>
      <div class="cell"><span class="n" id="ntotal">0</span>
        <span class="t">Total</span></div>
    </div>
    <p class="note" id="dignote"></p>
    <ul id="missed" style="text-align:left;max-width:760px;margin:0 auto 24px;
      padding-left:22px;font-size:.98rem;"></ul>
    <button class="primary" id="restart" type="button">Restart assessment</button>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script data-cfasync="false">
var Q = [{"q":"Which types of data must not be entered into public or unapproved AI tools?","opts":["Publicly available research papers and open government datasets.","Published marketing material, press releases and public website copy. This is a plausible-sounding but incorrect description.","Personal data, confidential and commercially sensitive information, credentials, and confidential documents.","Internal training slides that have already been shared company-wide."],"ans":2,"exp":"Correct. These are the categories the syllabus names. Each carries exposure if it leaves the organisation's control: legal, commercial or security.","why":["Incorrect. Public and open material is by definition already in the public domain.","Incorrect. Material already published carries no confidentiality exposure.","Correct. These are the categories the syllabus names. Each carries exposure if it leaves the organisation's control: legal, commercial or security.","Incorrect. Material already widely distributed internally does not carry the same confidentiality exposure, though policy may still restrict the tool used."]},{"q":"What is the default rule when uncertain whether data may be entered into an AI tool?","opts":["Enter it, and correct the position later if a concern is raised.","Enter it if the tool is free to use rather than paid.","Enter an abbreviated version that removes only the person's surname.","When in doubt, leave it out."],"ans":3,"exp":"Correct. This is the syllabus's stated default. Uncertainty is resolved conservatively, because data shared with a third-party service cannot be recalled.","why":["Incorrect. Disclosure is irreversible. The point of the rule is to decide before exposure, not after.","Incorrect. Cost model is unrelated to data protection. Free tools frequently have the weakest retention guarantees.","Incorrect. Partial redaction often leaves data that is still identifying. It also provides false reassurance.","Correct. This is the syllabus's stated default. Uncertainty is resolved conservatively, because data shared with a third-party service cannot be recalled."]},{"q":"A colleague wants to paste a customer contract into a public AI tool to summarise it. What is the appropriate response?","opts":["Use an approved tool configured for that content, or do not proceed.","Proceed, because summarising is a low-risk activity.","Proceed, provided the summary is not shared with anyone.","Proceed, and delete the conversation afterwards to remove the data. This confuses a related concept with the one being tested."],"ans":0,"exp":"Correct. The route to a permitted outcome is the approved tool. Personal deletion is not a control you own.","why":["Correct. The route to a permitted outcome is the approved tool. Personal deletion is not a control you own.","Incorrect. The task is low risk; the data is not. Exposure is created at input, not at output.","Incorrect. The exposure happens when the content leaves the organisation's control, regardless of who reads the result.","Incorrect. Deletion on your side does not establish what the provider retained or used. It is not a reliable mitigation."]},{"q":"What should be assumed about how a third-party AI service handles inputs?","opts":["Encryption in transit says nothing about handling after arrival.","It may transmit, store or use inputs according to its own terms.","Retention commonly occurs by default and opt-out is not universal.","Immediate deletion is a contractual commitment, not a default setting."],"ans":1,"exp":"Correct. Handling is governed by the provider's terms, which is why approved tools with suitable agreements matter. Assumptions are not a control.","why":["Incorrect. Encryption in transit protects data on the wire. It says nothing about what happens after arrival.","Correct. Handling is governed by the provider's terms, which is why approved tools with suitable agreements matter. Assumptions are not a control.","Incorrect. Retention commonly occurs by default, and opt-out is not universal.","Incorrect. Immediate deletion is a specific contractual commitment, not a default. Many services retain data for defined periods."]},{"q":"What do data retention and residency mean at a basic level?","opts":["Retention is whether data is encrypted; residency is who can access it.","Retention is which country data is kept in; residency is how long it is stored.","Retention is how long data is kept; residency is which country it is stored in.","Retention is the size of the dataset; residency is the number of users."],"ans":2,"exp":"Correct. Retention is duration; residency is location. Both matter because they determine legal exposure and which obligations attach.","why":["Incorrect. These describe encryption and access control, which are separate properties.","Incorrect. These are reversed. Residency concerns location, not duration.","Correct. Retention is duration; residency is location. Both matter because they determine legal exposure and which obligations attach.","Incorrect. Neither concerns volume or user counts. Both are about where and how long data persists."]},{"q":"Which statement about organisational policy and AI tool use is correct?","opts":["Individual staff may choose any tool as long as they consider it reputable. This confuses a related concept with the one being tested.","Policy applies only to data classified as secret or above.","Policy applies only to tools paid for by the organisation.","Organisational policy governs which tools and data are permitted, regardless of personal preference."],"ans":3,"exp":"Correct. Policy is the operative control. Personal judgement about a vendor's reputation is not a substitute for it.","why":["Incorrect. Reputation is not approval. The organisation must assess the tool's data terms before use.","Incorrect. Policy covers personal data and confidential commercial information, not only the highest classification levels.","Incorrect. Free and personal tools are the main shadow AI concern precisely because they sit outside procurement.","Correct. Policy is the operative control. Personal judgement about a vendor's reputation is not a substitute for it."]},{"q":"What is shadow AI?","opts":["Unapproved AI use that takes place outside organisational oversight.","AI systems that run without the user being aware of them.","AI systems used only for personal rather than work purposes.","Malicious AI software installed without the user's knowledge. This is a plausible-sounding but incorrect description."],"ans":0,"exp":"Correct. The defining feature is the absence of approval and oversight, not the intent of the user. Most shadow AI is well-intentioned.","why":["Correct. The defining feature is the absence of approval and oversight, not the intent of the user. Most shadow AI is well-intentioned.","Incorrect. The user generally knows they are using it. The organisation is the party in the dark.","Incorrect. Shadow AI is frequently used for work tasks, which is exactly why the data risk arises.","Incorrect. That describes malware. Shadow AI is typically a legitimate tool used without approval."]},{"q":"What is the correct response when a policy gap leaves a needed AI capability unaddressed?","opts":["Wait indefinitely until the organisation publishes a policy.","Escalate the gap and seek approval rather than proceeding independently.","Proceed and inform the team afterwards so the practice is at least visible.","Proceed using a personal account, since no policy prohibits it directly."],"ans":1,"exp":"Correct. A gap is a reason to escalate, not a licence. The organisation can then assess the tool and close the gap properly.","why":["Incorrect. Passive waiting leaves the need unmet and the workaround likely. Escalation is the active step.","Correct. A gap is a reason to escalate, not a licence. The organisation can then assess the tool and close the gap properly.","Incorrect. Informing after the fact does not establish oversight, and exposure has already occurred.","Incorrect. Absence of an explicit prohibition is not approval. That reasoning is precisely how shadow AI spreads."]},{"q":"What risks does shadow AI create for an organisation?","opts":["Staff become more productive than the IT department can support.","Software licensing costs increase without corresponding productivity gains. This confuses a related concept with the one being tested.","Data leaves controlled systems, and the organisation loses visibility and contractual protection.","The organisation's AI tools become slower due to shared usage."],"ans":2,"exp":"Correct. The core risk is ungoverned data movement: no assessment, no agreement, no record, no ability to respond if something goes wrong.","why":["Incorrect. Productivity is not the risk; it is often the motive. The risk is the exposure created along the way.","Incorrect. Licensing cost is a minor and secondary concern relative to data exposure.","Correct. The core risk is ungoverned data movement: no assessment, no agreement, no record, no ability to respond if something goes wrong.","Incorrect. Performance degradation of approved tools is not the concern shadow AI raises."]},{"q":"Which threats are enabled or enhanced by AI?","opts":["These are availability failures rather than AI-enabled threats.","These are physical security risks with no AI component at all.","These are engineering defects rather than threat-actor techniques. This is a plausible-sounding but incorrect description.","Deepfakes, impersonation, and AI-assisted phishing and social engineering."],"ans":3,"exp":"Correct. AI makes impersonation cheap and convincing at scale: cloned voices, synthetic video and personalised phishing that no longer reads as obviously fraudulent.","why":["Incorrect. These are availability failures. They are not AI-enabled threats.","Incorrect. These are physical security risks with no AI component.","Incorrect. These are engineering defects, not threat actors using AI.","Correct. AI makes impersonation cheap and convincing at scale: cloned voices, synthetic video and personalised phishing that no longer reads as obviously fraudulent."]},{"q":"At awareness level, how should an unexpected urgent request for a payment be verified?","opts":["Through a separate, trusted channel already known to be reliable.","By replying to the email that made the request to confirm the details.","By checking that the sender's email address looks correct.","By asking the sender to confirm their identity in the same call."],"ans":0,"exp":"Correct. A separate, pre-established channel defeats impersonation because the attacker does not control it. A cloned voice cannot answer a challenge on a channel you chose.","why":["Correct. A separate, pre-established channel defeats impersonation because the attacker does not control it. A cloned voice cannot answer a challenge on a channel you chose.","Incorrect. Replying uses the channel the attacker controls. If the mailbox is compromised or spoofed, the confirmation is worthless.","Incorrect. Lookalike domains pass casual inspection, and a compromised genuine account defeats address checking entirely.","Incorrect. The same call is the attacker's own channel. Confirmation within it proves nothing."]},{"q":"At awareness level, what is prompt injection?","opts":["Adding extra tokens to a prompt to exceed the context window.","Malicious instructions hidden in content that the AI processes.","Injecting code into a database by manipulating a query field.","A deliberate attempt to overload a system with excessive requests."],"ans":1,"exp":"Correct. The attack hides instructions in material the AI ingests, a web page, a document, an email, so the model acts on them without the user realising.","why":["Incorrect. Filling the context window is a resource issue, not an instruction-injection attack.","Correct. The attack hides instructions in material the AI ingests, a web page, a document, an email, so the model acts on them without the user realising.","Incorrect. This describes SQL injection against a database, a different attack against a different target.","Incorrect. This describes a denial-of-service pattern. Prompt injection aims to redirect the model's behaviour."]}];
var PASS = 70;
var L = ["A","B","C","D"];
var cur = 0, answered = [], correct = [], submitted = false;

// Randomise question order on every attempt so the sequence cannot be memorised
// from a screenshot. Uses the same RNG discipline as the accessible quiz standard.
(function shuffleQuestions(){
  var seed = Date.now() % 2147483647;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = Q.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = Q[i]; Q[i] = Q[j]; Q[j] = t;
  }
})();

// --- Copy / cut / paste attenuation -------------------------------------------------
// Assessment integrity: discourage copying questions out and pasting answers in.
// This is a deterrent, NOT a security control, a determined user can defeat it via
// devtools. It stops casual text harvesting and pasted-in answers during a sitting.
(function blockClipboard(){
  function stop(e){
    e.preventDefault();
    showToast('Copying, cutting and pasting are disabled during this assessment.');
    return false;
  }
  ['copy','cut','paste','contextmenu'].forEach(function(evt){
    document.addEventListener(evt, stop, true);
  });
  // Disable text selection inside the question and analysis areas only, so that
  // the skip link and buttons remain fully keyboard accessible.
  var style = document.createElement('style');
  style.textContent = '#qholder, #results { -webkit-user-select:none; -moz-user-select:none;'
                    + ' -ms-user-select:none; user-select:none; }';
  document.head.appendChild(style);
})();

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

var qlen = Q.length;
for (var i = 0; i < qlen; i++){ answered.push(false); correct.push(false); }

function el(id){ return document.getElementById(id); }

function render(){
  var q = Q[cur];
  var h = '<h2 class="qtext" id="qt">' + q.q + '</h2>';
  h += '<div role="radiogroup" aria-labelledby="qt">';
  for (var j = 0; j < q.opts.length; j++){
    h += '<button class="opt" type="button" role="radio" aria-checked="false" '
       + 'data-q="' + cur + '" data-o="' + j + '" id="o' + cur + '_' + j + '">'
       + '<span class="opt-letter">' + L[j] + '.</span>'
       + '<span class="op-text">' + q.opts[j] + '</span>'
       + '<span class="tag" id="t' + cur + '_' + j + '"></span></button>';
  }
  h += '</div><div id="ex' + cur + '"></div>';
  el('qholder').innerHTML = h;
  var btns = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', onPick);
  }
  var last = (cur === qlen - 1);
  el('next').style.display = last ? 'none' : '';
  el('submit').style.display = last ? '' : 'none';
  el('next').disabled = !answered[cur];
  el('submit').disabled = !answered[cur];
  updateBar();
}

function onPick(e){
  var b = e.currentTarget;
  var qi = parseInt(b.getAttribute('data-q'), 10);
  var oi = parseInt(b.getAttribute('data-o'), 10);
  if (answered[qi]) return;
  answered[qi] = true;
  var q = Q[qi];
  var isRight = (oi === q.ans);
  correct[qi] = isRight;
  var all = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < all.length; k++){
    var kq = parseInt(all[k].getAttribute('data-q'), 10);
    var ko = parseInt(all[k].getAttribute('data-o'), 10);
    if (kq !== qi) continue;
    all[k].disabled = true;
    all[k].setAttribute('aria-checked', ko === oi ? 'true' : 'false');
    var tg = el('t' + kq + '_' + ko);
    if (ko === q.ans){
      all[k].classList.add('correct');
      if (tg) tg.textContent = ko === oi ? '✓ Correct' : '✓ This was correct';
      if (tg) tg.className = 'tag correct';
    } else if (ko === oi){
      all[k].classList.add('wrong');
      if (tg) tg.textContent = '✗ Your answer';
      if (tg) tg.className = 'tag wrong';
    }
  }
  renderAnalysis(qi);
  var done = 0;
  for (var m = 0; m < qlen; m++){ if (answered[m]) done++; }
  el('running').textContent = 'Score: ' + tally() + ' / ' + done;
  el('next').disabled = false;
  el('submit').disabled = false;
  updateBar();
}

function renderAnalysis(qi){
  var q = Q[qi];
  var h = '<div class="analysis"><h3>Why each option is right or wrong</h3>';
  h += '<p class="why good">Correct answer: ' + L[q.ans] + '. '
     + q.opts[q.ans] + '</p><p>' + q.exp + '</p>';
  for (var j = 0; j < q.opts.length; j++){
    h += '<p><span class="why">' + L[j] + '.</span> ' + q.why[j] + '</p>';
  }
  h += '</div>';
  el('ex' + qi).innerHTML = h;
}

function tally(){
  var n = 0;
  for (var i = 0; i < qlen; i++){ if (correct[i]) n++; }
  return n;
}

function updateBar(){
  el('counter').textContent = 'Question ' + (cur + 1) + ' of ' + qlen;
  var pct = Math.round(((cur + 1) / qlen) * 100);
  el('pinner').style.width = pct + '%';
  var pb = el('pbar');
  if (pb){ pb.setAttribute('aria-valuenow', String(cur + 1)); }
}

el('next').addEventListener('click', function(){
  if (cur < qlen - 1){ cur++; render(); }
});
el('submit').addEventListener('click', function(){ showResults(false); });

function mark(){
  var c = tally();
  var p = Math.round((c / qlen) * 100);
  el('pct').textContent = p + '%';
  el('ncorrect').textContent = c;
  el('nwrong').textContent = qlen - c;
  el('ntotal').textContent = qlen;
  var g = el('gauge');
  var pass = (p >= PASS);
  g.style.background = pass ? '#dff3e1' : '#fbe3e3';
  g.style.border = '8px solid ' + (pass ? '#2e7d32' : '#c62828');
  el('verdictlbl').textContent = pass ? 'PASS' : 'NOT YET';
  el('verdictlbl').style.color = pass ? '#2e7d32' : '#c62828';
  el('pct').style.color = pass ? '#2e7d32' : '#c62828';
  el('dignote').textContent = pass
    ? 'You have met the pass standard for this section. Revisit any missed items below, then move on.'
    : 'Below the pass standard of ' + PASS + '%. Review each missed item below and retake when ready.';
  var ul = el('missed');
  ul.innerHTML = '';
  var missed = 0;
  for (var i = 0; i < qlen; i++){
    if (!correct[i]){
      missed++;
      var li = document.createElement('li');
      li.style.marginBottom = '8px';
      li.textContent = Q[i].q + ', correct: ' + L[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans];
      ul.appendChild(li);
    }
  }
  if (missed === 0){
    var li2 = document.createElement('li');
    li2.textContent = 'No missed items.';
    ul.appendChild(li2);
  }
}

function showResults(force){
  if (submitted && !force) return;
  submitted = true;
  mark();
  el('quiz').style.display = 'none';
  el('results').style.display = 'block';
  window.scrollTo(0, 0);
}

el('restart').addEventListener('click', function(){
  var p = window.prompt('Enter supervisor passcode to reset this assessment:');
  if (p !== '1234'){
    if (p !== null){ window.alert('Incorrect passcode. Assessment not reset.'); }
    return;
  }
  location.reload();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && !answered[cur] === false && cur < qlen - 1){
    e.preventDefault(); cur++; render();
  }
});

// ---- Assessment integrity guard ----
// Deterrent only: browser menus can bypass keyboard blocks and the HTML source
// always contains the questions. Pair with invigilation for real integrity.
(function integrityGuard(){
  var tc = null;
  function toast(msg){
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (tc) clearTimeout(tc);
    tc = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function block(e, msg){
    e.preventDefault();
    e.stopPropagation();
    toast(msg || 'Copying is disabled on this assessment.');
    return false;
  }
  document.addEventListener('contextmenu', function(e){ block(e); });
  document.addEventListener('copy', function(e){ block(e); });
  document.addEventListener('cut', function(e){ block(e); });
  document.addEventListener('dragstart', function(e){ block(e, 'Dragging is disabled.'); });
  document.addEventListener('selectstart', function(e){
    var n = e.target;
    while (n && n !== document.body){
      if (n.id === 'qholder' || n.id === 'results' ||
          (n.classList && (n.classList.contains('opt') || n.classList.contains('analysis')))){
        block(e, 'Selecting question text is disabled.');
        return;
      }
      n = n.parentNode;
    }
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'a' || k === 'u' || k === 's' || k === 'p')){
      block(e); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){
      block(e, 'Developer tools are disabled.'); return;
    }
    if (e.key === 'F12'){ block(e, 'Developer tools are disabled.'); }
  }, true);
})();

render();
</script>
