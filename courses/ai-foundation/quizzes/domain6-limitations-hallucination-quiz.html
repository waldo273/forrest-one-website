var Q = [{"q": "Which best defines hallucination in a language model?", "opts": ["Confident, fluent output that is factually wrong with no signal that anything is amiss", "Text that starts repeating itself once the context window has been exceeded.", "A visible error message that appears whenever the model cannot answer a question.", "Output that the model declines to produce on safety, policy or ethical grounds. This mistakes a symptom of the problem for its cause."], "ans": 0, "exp": "Syllabus 6.1 defines hallucination as confident, fluent output that is factually wrong, with no signal that anything is amiss. The absence of any warning cue is what makes it dangerous, because the text looks exactly as trustworthy as correct text.", "why": ["Correct. This is the syllabus 6.1 definition, and the missing warning signal is the key feature.", "Hallucination is not an error state, and the model produces plausible text and presents it normally.", "Repetition is a separate context-window effect, while hallucination concerns fabricated or wrong content.", "Refusals are a safety behaviour rather than hallucination, and they are visible rather than silent."]}, {"q": "Why does the syllabus describe hallucination as inherent to how language models work?", "opts": ["Models eventually run out of stored facts and invent replacements in order to keep responding.", "Models are deliberately engineered to mislead their users on a small percentage of occasions.", "Models generate likely next tokens, so fluent text can appear without any factual grounding", "Models simply reproduce errors that were present in the training data they were built from."], "ans": 2, "exp": "Syllabus 6.1 links hallucination to the mechanism described in 2.2, namely next-token prediction producing likely continuations. Nothing in that process checks whether a continuation is true, so fabrication is a natural consequence rather than an occasional bug.", "why": ["Training-data errors are one source of wrongness, but hallucination arises from generation itself.", "Models do not run out of storage mid-response, since they generate tokens regardless of knowledge.", "Correct. Generation by likelihood has no built-in truth check, which is why the flaw is structural.", "There is no designed intent to mislead, and the behaviour emerges from how the model generates text."]}, {"q": "A model produces a fluent, confident answer containing three specific-looking statistics. What is the syllabus position?", "opts": ["Figures and citations are high-risk elements that must be verified at their original source", "The model will reliably flag any statistic that it is genuinely unsure about when it writes.", "Statistics from a modern model can be trusted whenever the surrounding answer reads well.", "Numbers are inherently safer than prose because they look precise and specific to readers."], "ans": 0, "exp": "Syllabus 6.3 identifies citations, statistics and quotes as high-risk, and requires confirming important information at its original source. Syllabus 6.2 warns specifically that fabricated statistics appear authoritative.", "why": ["Correct. Statistics are named in 6.3 as high-risk and require verification at source before use.", "According to 6.1 there is no signal when something is wrong, so self-flagging cannot be relied on.", "Precision of form says nothing about accuracy, since fabricated figures look precise by design.", "Fluency is precisely the misleading signal that makes hallucination dangerous, as 6.1 warns."]}, {"q": "What should you do about a citation produced by an AI tool?", "opts": ["Accept it provided the citation appears in a plausible and correctly formatted reference style.", "Check it against the response that a second and different AI tool gives to the same question.", "Assume it is valid provided that the author name and the year both look familiar to you.", "Confirm it exists and confirm that it actually supports the proposition it is attached to"], "ans": 3, "exp": "Syllabus 6.3 requires confirming important information at its original source, and 6.4 specifies cross-checking against primary sources rather than another AI. A citation can exist yet not support the claim attributed to it, so both existence and support must be checked.", "why": ["Syllabus 6.4 explicitly rules this out, because cross-checking against another AI is not verification.", "Familiar-looking author names and years are exactly the surface plausibility that fabrication exploits.", "Correct formatting is trivial to generate and therefore proves nothing about existence or accuracy.", "Correct. Both conditions matter, since the source must exist and must substantiate the stated proposition."]}, {"q": "Cross-checking an AI answer against a second AI tool. What does the syllabus say?", "opts": ["It is a mandatory step for any output that will be used in a high-stakes setting.", "It is acceptable only where both models come from the same underlying provider.", "It is not verification, and you should check against primary sources instead", "It is the most reliable and convenient verification method currently available."], "ans": 2, "exp": "Syllabus 6.4 is explicit that you should cross-check against primary sources rather than another AI. Two models drawing on similar patterns can produce the same confident error, so agreement between them is not evidence of truth.", "why": ["It offers no independent evidence of truth, so it cannot be considered the most reliable method.", "It is not required, and it is specifically discouraged as a substitute for checking sources.", "Correct. Syllabus 6.4 rules out AI-to-AI checking and directs you to primary sources instead.", "Provider similarity makes agreement even weaker as evidence of accuracy rather than stronger."]}, {"q": "What is the effect of the knowledge cut-off on time-sensitive questions?", "opts": ["The model becomes noticeably less confident in its answers but remains broadly accurate.", "The base model cannot know later events, so such answers are unreliable without live sources", "The model silently updates itself as new information becomes available online each day.", "The model automatically warns you whenever a question postdates its own training date."], "ans": 1, "exp": "Syllabus 2.4 and 6.2 establish that a base model has no knowledge of events after its training date, so time-sensitive questions are unreliable from the base model alone. Some applications add live search, but the base model itself remains frozen.", "why": ["There is no reliable warning, which is exactly why this limitation must be known in advance.", "Correct. The training date is a hard boundary, so anything after it must come from an external source.", "The base model does not update itself by browsing, and only applications with added search supply current data.", "Accuracy on post-cut-off events is not merely reduced but ungrounded, so the model may invent details."]}, {"q": "An AI tool claims to be 'hallucination-free' because it uses retrieval. How should you treat that claim?", "opts": ["As a firm vendor commitment that the tool will reimburse you for any error.", "As reliable, because retrieval grounds every answer in a set of real documents.", "Sceptically, because retrieval reduces error but does not actually remove it", "As reliable for citations specifically, even if other content needs checking."], "ans": 2, "exp": "Syllabus 3.3 states plainly that RAG improves freshness and grounding but reduces rather than removes error. Research into retrieval-based legal research tools marketed as hallucination-free found continued hallucination across a substantial proportion of queries.", "why": ["Citation accuracy is itself a documented weakness of retrieval-based tools rather than a strength.", "The syllabus excludes commercial product evaluation, since the certification is deliberately vendor-neutral.", "Correct. This restates syllabus 3.3 and matches the evidence that retrieval is not a panacea.", "Retrieval improves grounding but cannot guarantee that every generated claim traces to a retrieved source."]}, {"q": "Why does 'it looked completely convincing' fail as a defence for publishing AI errors?", "opts": ["Because the model should have flagged its own uncertainty clearly before you published.", "Because publishing any content that was produced with AI assistance is always prohibited.", "Because text that appears convincing is statistically more likely to contain errors in it.", "Fluency is not a signal of accuracy, and the human remains fully accountable for it"], "ans": 3, "exp": "Syllabus 6.1 explains that hallucination carries no warning signal, and syllabus 8.2 states that 'the AI did it' is not a defence. Convincing presentation is precisely the failure mode, so it cannot also serve as the excuse.", "why": ["Convincing text is not statistically more likely to be wrong, and the point is that it tells you nothing.", "According to 6.1 there is no reliable self-flagging, so this cannot be the standard you rely on.", "The syllabus does not ban publishing AI-assisted content, and it requires verification and sometimes disclosure.", "Correct. The absence of a warning plus retained human accountability means plausibility excuses nothing."]}, {"q": "Which set names the mandated verification contexts from syllabus 6.5?", "opts": ["Legal, medical, financial, safety, HR or people decisions, and anything published externally", "Legal and medical work only, since these are the two fields where errors cause direct harm.", "Only work that will be reviewed by senior management or an external regulatory authority.", "Any task that involves reading and combining more than one document into a single output."], "ans": 0, "exp": "Syllabus 6.5 lists the contexts where verification is required: legal, medical, financial, safety, HR and people decisions, and anything published externally. These share high stakes and direct impact on people.", "why": ["Correct. This is the complete 6.5 list, and external publication is included because reach amplifies harm.", "Visibility to management is not the criterion, because impact and stakes are what actually matter.", "Document count does not determine stakes, since a single-document legal memo still needs verification.", "Legal and medical are included, but so are financial, safety, HR and externally published material."]}, {"q": "Which is a practical grounding technique from syllabus 6.4?", "opts": ["Providing the real source text and instructing the model to answer only from it", "Using a larger model that has more parameters and a longer training history.", "Asking the model to be more careful and considered in its general approach.", "Rewriting the question so that it is shorter and more tightly focused. This attributes to the system a capacity it cannot hold."], "ans": 0, "exp": "Syllabus 6.4 recommends grounding prompts in real content, asking the model to flag uncertainty, cross-checking against primary sources, and keeping a human in the loop. Supplying the actual source text and constraining the answer to it is grounding in its most direct form.", "why": ["Correct. Anchoring the answer to supplied text is the clearest and most practical application of grounding.", "Shortening a question does not connect it to a source, since grounding is about supplying evidence.", "Model size is not a grounding technique, and the syllabus stays neutral about capability claims.", "General carefulness instructions are vague and do not supply any factual anchor for the answer."]}, {"q": "How does an AI tool differ from a search engine when answering a factual question?", "opts": ["The tool is always more accurate because it genuinely understands the meaning behind the query.", "There is no meaningful practical difference between the two for factual questions of this kind.", "The tool generates text that may not trace to a real source, while search returns indexed items", "The tool automatically cites its sources and those citations can therefore be relied upon."], "ans": 2, "exp": "Syllabus 6.3 draws the distinction between generated content and sourced content. A search engine returns actual indexed material you can open, whereas a generative tool produces text, and whether it corresponds to a real source must be checked.", "why": ["The difference is material and is exactly why the verification obligations differ between them.", "Understanding meaning does not make the output traceable to a real and checkable source.", "Correct. Generated content is not the same as sourced content, which is the crux of syllabus 6.3.", "Citations can be fabricated, which makes them one of the highest-risk outputs named in 6.3."]}, {"q": "What role does keeping 'a human in the loop' play?", "opts": ["A person reviews the output and takes responsibility before it is used or acted upon", "A person approves the training data that the underlying model was originally built on.", "A person types the prompt into the tool on the model's behalf to speed up the process.", "A person monitors the model's electricity consumption and hardware resource usage."], "ans": 0, "exp": "Syllabus 6.4 names keeping a human in the loop as a risk-reduction measure, and 8.3 sets out the principle that AI proposes while a person decides and owns the outcome. The human is a decision point rather than an operator.", "why": ["Correct. Oversight means a person reviews and owns the result before it has any real effect.", "Prompt entry is a purely mechanical task that confers no oversight or accountability whatsoever.", "Infrastructure monitoring is unrelated to the accountability that genuine oversight provides.", "Training-data approval is not what in-the-loop oversight means in this particular syllabus."]}, {"q": "Why does the syllabus call hallucination a professional risk rather than a technical curiosity?", "opts": ["Because correcting it requires expensive specialist intervention from qualified engineers.", "Unverified AI content has led to real sanctions, retractions and reputational damage", "Because hallucination noticeably slows down the model's response times for all its users.", "Because hallucination consumes excessive computing resources during normal operation."], "ans": 1, "exp": "Real-world consequences are documented, including court sanctions against lawyers who filed AI-fabricated citations, adverse findings against tribunals and authorities relying on AI-generated material, and research-misconduct exposure for published articles containing hallucinated references. That is why verification is framed as a professional duty.", "why": ["Response time is unrelated to the professional risk that the syllabus is describing here.", "Correct. The harm is professional and documented, covering sanctions, retractions and damaged standing.", "Computing cost is not the concern that the syllabus raises anywhere in this domain.", "The remedy is an ordinary professional habit of verifying at source rather than specialist intervention."]}, {"q": "What does 'fluency does not guarantee accuracy' mean in practice?", "opts": ["Accuracy only really matters in formal writing such as reports and academic publications.", "Only poorly written output needs to be checked, since fluent output is reliable by nature.", "Well-written output can still be wrong, so prose quality is not evidence of correctness", "Fluent output is usually wrong, so it should generally be treated as suspect by default."], "ans": 2, "exp": "Syllabus 2.2 makes this point directly in the context of how language models generate text, and 6.1 repeats it. Because the model optimises for likely continuations, it can produce polished prose around entirely false content.", "why": ["All output should be assessed, since prose quality is not a filter for what needs checking.", "Accuracy matters in all contexts, although the stakes and consequences differ between domains.", "Correct. Prose quality and factual accuracy are independent, so good writing cannot proxy for truth.", "Fluent output is often correct, and the real point is that fluency alone tells you nothing either way."]}, {"q": "A vendor says its AI 'never makes things up because it only uses your documents'. What is the sound professional response?", "opts": ["Accept it, because a system grounded in your own documents cannot fabricate content.", "Refuse to use any retrieval-based tool at all, since none of them can be fully trusted.", "Ask what happens when the supplied documents do not contain an answer to the question", "Accept it provided the tool also offers a very large context window for long documents."], "ans": 2, "exp": "Syllabus 3.3 warns that RAG reduces rather than removes error. A model constrained to documents still has to compose an answer, and when the source is silent it may bridge the gap, which is where fabrication returns.", "why": ["Context-window size does not guarantee that answers are traceable to the supplied material.", "No grounding system eliminates fabrication, as 3.3 and the retrieval-tool evidence both show.", "Correct. The failure mode appears precisely where the source material is silent or ambiguous.", "Retrieval-based tools are useful and the syllabus supports using them with verification, not refusing them."]}, {"q": "Which is the best example of a fabricated statistic risk?", "opts": ["A figure that the model calculates directly from numbers you supplied to it.", "A statistic that the model explicitly says it is not confident about providing.", "A rounded estimate that the model itself labels as approximate and uncertain.", "A precise-sounding figure attributed to a named report that does not contain it"], "ans": 3, "exp": "Syllabus 6.2 warns that fabricated statistics, citations, quotes and case studies appear authoritative. Specificity plus a plausible attribution is exactly the combination that defeats casual review, which is why source checking is mandatory.", "why": ["A calculation from supplied numbers is traceable back to your own inputs and can be checked.", "An explicit statement of uncertainty is the opposite of the confident fabrication the syllabus describes.", "A labelled approximation is honest about its limits and is not presented as a sourced fact.", "Correct. Specificity and a credible attribution are what make a fabricated figure genuinely dangerous."]}, {"q": "When a summary of a high-stakes document is being prepared with AI, what must happen?", "opts": ["The original must be read, because summaries can omit critical detail", "The summary is sufficient provided it is well structured and clearly laid out.", "A second AI summary can reasonably substitute for reading the original document.", "Only the executive summary section of the original needs to be checked over."], "ans": 0, "exp": "Syllabus 5.2 names the limitation that summaries can omit critical detail, and requires reading the original for high-stakes documents. Compression always involves judgement about what to drop, and that judgement may discard what matters most to you.", "why": ["Correct. For high-stakes material the original is the authority and the summary is only an aid.", "Checking one section does not establish that nothing important was omitted from the rest.", "Two summaries can drop the same material, and neither of them is the authoritative document.", "Good structure does not prevent omission, since formatting says nothing about completeness."]}, {"q": "Which behaviour best matches 'verification at the original source'?", "opts": ["Searching for the claim to see whether other AI answers repeat it.", "Opening the cited document itself and reading the relevant passage", "Checking that the citation's web address resolves to a live page.", "Asking the model to confirm the accuracy of its own earlier answer."], "ans": 1, "exp": "Syllabus 6.3 requires confirming important information at its original source, and 6.4 directs cross-checking against primary sources. Reading the actual passage is the only method that establishes both existence and support.", "why": ["Self-confirmation is not independent evidence and may simply repeat the original error.", "Correct. Reading the source passage confirms the document exists and says what was claimed.", "A resolving address does not prove the source supports the claim, and fabricated citations can point at irrelevant pages.", "Recurrence across AI answers may reflect shared training patterns rather than an underlying source."]}, {"q": "What is the significance of the documented court sanctions involving AI citations?", "opts": ["They show that AI is fundamentally unsuitable for all professional writing tasks.", "They show that only lawyers and legal professionals are affected by hallucination.", "They show that unverified AI content carries real professional consequences", "They show that courts have now banned the use of AI in legal drafting entirely."], "ans": 2, "exp": "Sanctions, referral to disciplinary authorities and orders to pay opposing costs demonstrate that the verification duty is enforceable rather than merely advisory. This is what turns syllabus 6.5 from guidance into professional obligation.", "why": ["AI remains useful for drafting, so the lesson concerns verification rather than blanket prohibition.", "The documented pattern spans courts, tribunals, authorities and research publication across many countries.", "Correct. The cases establish that failing to verify AI output has enforceable professional consequences.", "Courts have increasingly required disclosure and verification rather than imposing a total ban."]}, {"q": "Which is the most reliable way to check whether an AI claim about a regulation is correct?", "opts": ["Ask the AI model to explain its reasoning about the regulation in more detail.", "Read the regulation on the official publisher's website for that jurisdiction", "Ask a completely different AI model the very same question and compare replies.", "Check whether the answer the model gave is internally consistent and coherent."], "ans": 1, "exp": "Syllabus 6.3 and 6.4 both point to the original source. For a regulation, the authoritative text is published by the issuing body, and only that text settles what the regulation actually says.", "why": ["An answer can be internally consistent and still be factually wrong in its substantive claims.", "Correct. The official published text is the definitive authority for what a regulation provides.", "A second model can reproduce the same error, which syllabus 6.4 explicitly anticipates.", "More detailed reasoning may simply elaborate a fabrication with greater fluency and confidence."]}, {"q": "Why is a fabricated quote particularly dangerous in professional work?", "opts": ["It is usually much longer than a fabricated statistic would be.", "It attaches a real person's name to words they never actually said", "It only causes problems in social media and public commentary posts.", "It is considerably harder for the model to generate than other text."], "ans": 1, "exp": "Syllabus 6.3 identifies quotes as high-risk alongside citations and statistics. A fabricated quote does two kinds of damage, since the claim itself may be false and a named individual is misrepresented, which can carry its own professional and reputational consequences.", "why": ["Fabricated quotes are equally dangerous in reports, briefings, board papers and academic work.", "Correct. Misattribution harms a real person and compounds the accuracy problem with a reputational one.", "Length is irrelevant to the risk, since the harm comes from the false attribution itself.", "Generating plausible dialogue is well within a language model's ordinary capability."]}, {"q": "What does 'AI proposes while a person decides' require in practice?", "opts": ["The AI must be switched off completely during the final review stage.", "The AI must state its own confidence level clearly before proceeding further.", "The task must be small enough for one single person to check it all through.", "A named human reviews and approves the output before it takes effect"], "ans": 3, "exp": "Syllabus 8.3 states this principle directly, and 6.4 requires keeping a human in the loop. In practice it means that a specific, identifiable person accepts responsibility before the output is acted on or published.", "why": ["The tool need not be switched off, but a person must own the eventual decision.", "Task size does not determine accountability, since large tasks can still have a named approver.", "Confidence statements are not reliable signals, as syllabus 6.1 makes clear to candidates.", "Correct. Oversight requires an accountable person who approves before any consequences follow."]}, {"q": "Which is the correct handling of an AI-generated case study you want to use in a client proposal?", "opts": ["Use it provided that the client is unlikely to check the details for themselves.", "Use it provided it is plausible and reads well as a piece of professional writing.", "Use it but add the word illustrative somewhere near the case study text.", "Verify the events actually occurred and replace it if it cannot be substantiated"], "ans": 3, "exp": "Syllabus 6.2 names fabricated case studies alongside statistics and citations as appearing authoritative. Since 6.5 covers anything published externally and client-facing work is high-stakes, an unverifiable case study must be replaced rather than glossed.", "why": ["Illustrative does not fix a fabricated claim presented as real, and in client work it may itself mislead.", "The likelihood of detection is irrelevant to the question of whether the claim is actually true.", "Plausibility is the exact property that makes fabrication dangerous, as syllabus 6.1 explains.", "Correct. If the events cannot be substantiated then the case study is fabricated and must not be used."]}, {"q": "What is the relationship between the knowledge cut-off and fabricated content?", "opts": ["The presence of a knowledge cut-off actually prevents fabrication from occurring at all.", "Out-of-date knowledge can lead the model to invent plausible detail rather than admit ignorance", "Fabrication occurs only on topics that postdate the model's training cut-off date. This understates how early the duty begins in the workflow.", "A knowledge cut-off only affects the model's response speed and not its factual accuracy."], "ans": 1, "exp": "Syllabus 6.2 explicitly links stale information to fabrication, since out-of-date output arises from the knowledge cut-off and fabricated statistics and citations appear authoritative. The model tends to answer rather than decline, so gaps get filled with invention.", "why": ["A cut-off is a boundary on knowledge and not a safeguard against fabrication in any form.", "Correct. Stale knowledge plus a tendency to answer produces confident invention where knowledge runs out.", "The cut-off affects what the model knows rather than how quickly it responds to questions.", "Fabrication is not limited to post-cut-off events and also affects the model's own trained knowledge."]}, {"q": "Which instruction is most useful for surfacing uncertainty?", "opts": ["Double-check all of your work carefully before you reply to me with the final answer.", "If the sources I have given do not answer this, say so rather than inferring an answer", "Please be as accurate as you possibly can be in everything that you write for me here.", "Do not make any mistakes at all in the response that you provide for me this time."], "ans": 1, "exp": "Syllabus 6.4 recommends asking the model to flag uncertainty. A specific instruction that identifies the acceptable outcome, namely saying that the supplied material does not answer the question, is far more actionable than a general plea for care.", "why": ["Do not make mistakes is unactionable and provides no route for the model to admit a knowledge gap.", "Correct. Naming the permitted response gives the model a clear alternative to guessing at an answer.", "A general wish for accuracy gives the model no mechanism for revealing genuine doubt to you.", "Instructions to self-check do not establish any external anchor that could confirm correctness."]}, {"q": "Why is 'the tool said it' insufficient as an audit trail?", "opts": ["Because the same tool cannot reliably reproduce the same answer on two separate occasions.", "Because audit trails only really matter in the financial services and accounting sectors.", "Because AI tools generally do not keep detailed logs of the responses they generate.", "Output must be traceable to a verifiable source, not merely to the tool that produced it"], "ans": 3, "exp": "Syllabus 6.3 establishes that generated content is not sourced content. An audit trail requires tracing a claim back to an authoritative source, and pointing at the model that produced it establishes only who generated the text, not whether it is true.", "why": ["Logging is a separate issue, and even a perfect log of a fabricated claim proves nothing about truth.", "Reproducibility is a variability question at syllabus 2.5 and not the reason an audit trail is required.", "Verification obligations span legal, medical, financial, safety, HR and published contexts rather than finance alone.", "Correct. Traceability requires reaching an authoritative source, which the tool itself is not."]}, {"q": "A model gives two different answers to the same factual question on two occasions. What does this indicate?", "opts": ["Generation involves sampling, so output varies, and variation signals fragility", "One of the two answers given must be the correct one of the pair.", "The model has learned from the first answer and adjusted its response.", "The second answer is the improved and more reliable of the two replies."], "ans": 0, "exp": "Syllabus 2.5 explains that identical prompts can produce different answers because of sampling and the temperature setting. When a factual claim changes between runs, that instability is a warning that the detail is not securely grounded.", "why": ["Correct. Variability is expected from sampling, and it is a useful signal that a fact needs checking.", "Later generations are not refinements, and the model does not improve unless you explicitly correct it.", "Both answers could be wrong, so variation between them does not imply that one is right.", "The model does not update its internal weights based on the content of your conversation."]}, {"q": "Which habit most directly reduces the risk of publishing an AI error?", "opts": ["Reading the generated output through carefully two separate times before you send it.", "Keeping all of your prompts very short and tightly focused on a single small point.", "Using the most expensive and most recently released model that is available to you.", "Applying a fixed verification checklist to names, figures, dates, quotes and citations"], "ans": 3, "exp": "Syllabus 5.5 lists exactly this set, namely facts, figures, dates, names, quotes and citations, as elements to verify before acting on or sharing output. A checklist makes the duty consistent rather than dependent on how convincing the text felt.", "why": ["Model cost is not a guarantee of accuracy, and the syllabus is deliberately vendor-neutral.", "Re-reading catches typographical slips but not fabrications that read perfectly well on the page.", "Prompt length is unrelated to the verification duty that applies to the finished output.", "Correct. A fixed checklist targets the named high-risk elements and removes reliance on impressions."]}, {"q": "What is the syllabus position on using AI output in a document that will be published externally?", "opts": ["Publication is prohibited unless a qualified legal specialist has reviewed the document first.", "Verification is mandatory, and disclosure is required where AI substantially generated the content", "Only the statistics within the document need to be checked carefully before publication.", "No verification is needed provided that a human being edited and tidied up the final text."], "ans": 1, "exp": "Syllabus 6.5 includes anything published externally among the mandated verification contexts, and 8.4 requires disclosure where AI substantially generated the content or where non-disclosure would mislead. Editing improves text but does not make it verified.", "why": ["Editing is not verification, since an editor may smooth fabricated prose without spotting the fabrication.", "Correct. External publication triggers both the verification duty and the disclosure question.", "The syllabus excludes legal interpretation, and its remedy is verification with appropriate disclosure.", "Citations, quotes and names carry the same risk as statistics and must also be checked."]}, {"q": "Why does the syllabus pair hallucination with critical evaluation as a core competency?", "opts": ["Because all AI output should generally be distrusted as a matter of sensible default policy.", "Because automated evaluation tools can now reliably detect hallucinations without human help.", "Because output must be assessed on evidence rather than plausibility before it is trusted", "Because critical evaluation of output removes the need to check against original sources."], "ans": 2, "exp": "Domain 6 is introduced as critical evaluation and verification as a core professional competency. The pairing reflects that hallucination cannot be detected from the output alone, so the professional habit is to evaluate against evidence.", "why": ["No automated detector reliably identifies hallucination, which is why human verification is required.", "The syllabus is not generally distrustful of AI, and it requires appropriate and verified use.", "Correct. The competency is disciplined evidence-based assessment of output before relying on it.", "Critical evaluation directs you towards source checking and does not substitute for it."]}, {"q": "A colleague says hallucination will disappear as models improve. What is the best-informed response?", "opts": ["Fabrication has not declined consistently across generations, so verification remains essential", "Hallucination only ever affects older or smaller models and not the current generation of tools.", "That is correct, so verification can reasonably be relaxed for the very newest models available.", "Hallucination is actually increasing steadily in every measurable dimension across all models."], "ans": 0, "exp": "Research benchmarking fabricated legal citations across eight successive model generations found that hallucination rates were not consistently decreasing, and that newer models produced more citations per document from less canonical sources, which increases the verification burden. The trend is not self-correcting.", "why": ["Correct. The evidence shows no consistent decline, and the verification burden has grown rather than shrunk.", "Assuming improvement and relaxing checks is exactly the behaviour that the evidence warns against.", "Hallucination affects current models, including some marketed as grounding-based and hallucination-free.", "The finding is that rates are not consistently decreasing, rather than that they are rising in every measure."]}];
var PASS = 70;
var L = ["A","B","C","D"];
var cur = 0, answered = [], correct = [], submitted = false;

// Randomise question order on every attempt so the sequence cannot be memorised
// from a screenshot. Uses the same RNG discipline as the accessible quiz standard.
(function shuffleQuestions(){
  var seed = Date.now() % 2147483647;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = Q.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = Q[i]; Q[i] = Q[j]; Q[j] = t;
  }
})();

// --- Copy / cut / paste attenuation -------------------------------------------------
// Assessment integrity: discourage copying questions out and pasting answers in.
// This is a deterrent, NOT a security control, a determined user can defeat it via
// devtools. It stops casual text harvesting and pasted-in answers during a sitting.
(function blockClipboard(){
  function stop(e){
    e.preventDefault();
    showToast('Copying, cutting and pasting are disabled during this assessment.');
    return false;
  }
  ['copy','cut','paste','contextmenu'].forEach(function(evt){
    document.addEventListener(evt, stop, true);
  });
  // Disable text selection inside the question and analysis areas only, so that
  // the skip link and buttons remain fully keyboard accessible.
  var style = document.createElement('style');
  style.textContent = '#qholder, #results { -webkit-user-select:none; -moz-user-select:none;'
                    + ' -ms-user-select:none; user-select:none; }';
  document.head.appendChild(style);
})();

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

var qlen = Q.length;
for (var i = 0; i < qlen; i++){ answered.push(false); correct.push(false); }

function el(id){ return document.getElementById(id); }

function render(){
  var q = Q[cur];
  var h = '<h2 class="qtext" id="qt">' + q.q + '</h2>';
  h += '<div role="radiogroup" aria-labelledby="qt">';
  for (var j = 0; j < q.opts.length; j++){
    h += '<button class="opt" type="button" role="radio" aria-checked="false" '
       + 'data-q="' + cur + '" data-o="' + j + '" id="o' + cur + '_' + j + '">'
       + '<span class="opt-letter">' + L[j] + '.</span>'
       + '<span class="op-text">' + q.opts[j] + '</span>'
       + '<span class="tag" id="t' + cur + '_' + j + '"></span></button>';
  }
  h += '</div><div id="ex' + cur + '"></div>';
  el('qholder').innerHTML = h;
  var btns = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', onPick);
  }
  var last = (cur === qlen - 1);
  el('next').style.display = last ? 'none' : '';
  el('submit').style.display = last ? '' : 'none';
  el('next').disabled = !answered[cur];
  el('submit').disabled = !answered[cur];
  updateBar();
}

function onPick(e){
  var b = e.currentTarget;
  var qi = parseInt(b.getAttribute('data-q'), 10);
  var oi = parseInt(b.getAttribute('data-o'), 10);
  if (answered[qi]) return;
  answered[qi] = true;
  var q = Q[qi];
  var isRight = (oi === q.ans);
  correct[qi] = isRight;
  var all = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < all.length; k++){
    var kq = parseInt(all[k].getAttribute('data-q'), 10);
    var ko = parseInt(all[k].getAttribute('data-o'), 10);
    if (kq !== qi) continue;
    all[k].disabled = true;
    all[k].setAttribute('aria-checked', ko === oi ? 'true' : 'false');
    var tg = el('t' + kq + '_' + ko);
    if (ko === q.ans){
      all[k].classList.add('correct');
      if (tg) tg.textContent = ko === oi ? '✓ Correct' : '✓ This was correct';
      if (tg) tg.className = 'tag correct';
    } else if (ko === oi){
      all[k].classList.add('wrong');
      if (tg) tg.textContent = '✗ Your answer';
      if (tg) tg.className = 'tag wrong';
    }
  }
  renderAnalysis(qi);
  var done = 0;
  for (var m = 0; m < qlen; m++){ if (answered[m]) done++; }
  el('running').textContent = 'Score: ' + tally() + ' / ' + done;
  el('next').disabled = false;
  el('submit').disabled = false;
  updateBar();
}

function renderAnalysis(qi){
  var q = Q[qi];
  var h = '<div class="analysis"><h3>Why each option is right or wrong</h3>';
  h += '<p class="why good">Correct answer: ' + L[q.ans] + '. '
     + q.opts[q.ans] + '</p><p>' + q.exp + '</p>';
  for (var j = 0; j < q.opts.length; j++){
    h += '<p><span class="why">' + L[j] + '.</span> ' + q.why[j] + '</p>';
  }
  h += '</div>';
  el('ex' + qi).innerHTML = h;
}

function tally(){
  var n = 0;
  for (var i = 0; i < qlen; i++){ if (correct[i]) n++; }
  return n;
}

function updateBar(){
  el('counter').textContent = 'Question ' + (cur + 1) + ' of ' + qlen;
  var pct = Math.round(((cur + 1) / qlen) * 100);
  el('pinner').style.width = pct + '%';
  var pb = el('pbar');
  if (pb){ pb.setAttribute('aria-valuenow', String(cur + 1)); }
}

el('next').addEventListener('click', function(){
  if (cur < qlen - 1){ cur++; render(); }
});
el('submit').addEventListener('click', function(){ showResults(false); });

function mark(){
  var c = tally();
  var p = Math.round((c / qlen) * 100);
  el('pct').textContent = p + '%';
  el('ncorrect').textContent = c;
  el('nwrong').textContent = qlen - c;
  el('ntotal').textContent = qlen;
  var g = el('gauge');
  var pass = (p >= PASS);
  g.style.background = pass ? '#dff3e1' : '#fbe3e3';
  g.style.border = '8px solid ' + (pass ? '#2e7d32' : '#c62828');
  el('verdictlbl').textContent = pass ? 'PASS' : 'NOT YET';
  el('verdictlbl').style.color = pass ? '#2e7d32' : '#c62828';
  el('pct').style.color = pass ? '#2e7d32' : '#c62828';
  el('dignote').textContent = pass
    ? 'You have met the pass standard for this section. Revisit any missed items below, then move on.'
    : 'Below the pass standard of ' + PASS + '%. Review each missed item below and retake when ready.';
  var ul = el('missed');
  ul.innerHTML = '';
  var missed = 0;
  for (var i = 0; i < qlen; i++){
    if (!correct[i]){
      missed++;
      var li = document.createElement('li');
      li.style.marginBottom = '8px';
      li.textContent = Q[i].q + ', correct: ' + L[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans];
      ul.appendChild(li);
    }
  }
  if (missed === 0){
    var li2 = document.createElement('li');
    li2.textContent = 'No missed items.';
    ul.appendChild(li2);
  }
}

function showResults(force){
  if (submitted && !force) return;
  submitted = true;
  mark();
  el('quiz').style.display = 'none';
  el('results').style.display = 'block';
  window.scrollTo(0, 0);
}

el('restart').addEventListener('click', function(){
  var p = window.prompt('Enter supervisor passcode to reset this assessment:');
  if (p !== '1234'){
    if (p !== null){ window.alert('Incorrect passcode. Assessment not reset.'); }
    return;
  }
  location.reload();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && !answered[cur] === false && cur < qlen - 1){
    e.preventDefault(); cur++; render();
  }
});

// ---- Assessment integrity guard ----
// Deterrent only: browser menus can bypass keyboard blocks and the HTML source
// always contains the questions. Pair with invigilation for real integrity.
(function integrityGuard(){
  var tc = null;
  function toast(msg){
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (tc) clearTimeout(tc);
    tc = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function block(e, msg){
    e.preventDefault();
    e.stopPropagation();
    toast(msg || 'Copying is disabled on this assessment.');
    return false;
  }
  document.addEventListener('contextmenu', function(e){ block(e); });
  document.addEventListener('copy', function(e){ block(e); });
  document.addEventListener('cut', function(e){ block(e); });
  document.addEventListener('dragstart', function(e){ block(e, 'Dragging is disabled.'); });
  document.addEventListener('selectstart', function(e){
    var n = e.target;
    while (n && n !== document.body){
      if (n.id === 'qholder' || n.id === 'results' ||
          (n.classList && (n.classList.contains('opt') || n.classList.contains('analysis')))){
        block(e, 'Selecting question text is disabled.');
        return;
      }
      n = n.parentNode;
    }
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'a' || k === 'u' || k === 's' || k === 'p')){
      block(e); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){
      block(e, 'Developer tools are disabled.'); return;
    }
    if (e.key === 'F12'){ block(e, 'Developer tools are disabled.'); }
  }, true);
})();

render();
</script>
<script data-cfasync="false">
(function () {
  function native(){ return typeof window.Capacitor!=='undefined' && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform(); }
  function setup(){
    if(!native()){return;}
    var App = window.Capacitor.Plugins && window.Capacitor.Plugins.App; if(!App){return;}
    var t=null,b=0;
    function toast(m){ if(!t){t=document.createElement('div'); t.className='app-toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.classList.add('show'); clearTimeout(t._z); t._z=setTimeout(function(){t.classList.remove('show');},2200); }
    App.addListener('backButton', function(info){ var cb=info&&info.canGoBack;
      if(cb){ if(window.history.length>1){window.history.back();} else {window.location.href=window.location.origin+'/';} return; }
      var n=Date.now(); if(n-b<2200){App.exitApp(); return;} b=n; toast('Press back again to exit');
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',setup);}else{setup();}
})();
</script>
