<script data-cfasync="false">
var Q = [{"q": "A recruitment team uses an AI screening tool trained on the company's own ten years of successful hires. It consistently ranks men above women for engineering roles, even though qualifications are equivalent. What is the most accurate description of what has happened?", "opts": ["The tool is malfunctioning and a software update will remove the pattern. This overstates the requirement beyond the professional-literacy standard.", "The tool is neutral; the outcome reflects genuine differences in candidate quality. This substitutes a superficial check for verification at the original source.", "The tool has learned patterns from historical data that reflect past hiring bias, so it reproduces and can amplify that bias at scale", "The tool has developed its own opinion about which candidates are better, so it should be asked to explain its reasoning."], "ans": 2, "exp": "Bias in AI commonly enters through the training data. Where historical hiring outcomes favoured one group, a model trained to reproduce those outcomes learns the same preference and can apply it consistently and at scale. This is a data and design problem, not a bug or a malfunction.", "why": ["Wrong. Reframing bias as a malfunction suggests a patch will fix it. Bias arises from data and design choices, so it requires review of those choices, not only a software update.", "Wrong. The question states qualifications are equivalent, so the difference in ranking is not explained by candidate quality. Neutrality of the tool cannot be assumed from the fact that it is automated.", "Correct. Historical data carries historical bias; the model learns and scales that pattern.", "Wrong. Models do not hold opinions. They reproduce statistical patterns in their training data. This framing also invites the false comfort that an explanation will resolve the issue."]}, {"q": "Under syllabus area 8.1, a bias assessment is described as a duty in which circumstances?", "opts": ["In uses that affect people, such as hiring, lending or access to services", "Only where legislation has already been breached. This treats an optional good practice as a mandatory control.", "Whenever an AI tool is used for any purpose at all.", "Only when a model has been trained on data the organisation collected itself."], "ans": 0, "exp": "Bias assessment is a duty where AI is used in ways that affect people, because the harm falls on individuals. Hiring, lending and access to services are the syllabus examples. It is not triggered by every possible use, nor only after a breach.", "why": ["Correct. People-affecting uses are where bias does real harm and where the duty applies.", "Wrong. This is backwards. Assessment exists to prevent harm and demonstrate responsible use, not to respond only once the law has already been broken.", "Wrong. The source of the training data is not the trigger. The question is whose interests are at stake in the use.", "Wrong. Too broad. The syllabus ties the duty to people-affecting uses, not to any conceivable use of AI."]}, {"q": "Which of the following is NOT identified in the syllabus as a source of bias?", "opts": ["The speed at which the model produces its output", "Training data. This assumes the model holds intent it does not have.", "The context in which the system is deployed.", "Design choices made when building the system."], "ans": 0, "exp": "The syllabus identifies three sources of bias: training data, design choices and deployment context. The processing speed of a model is not a source of bias, although it can reduce the opportunity for review.", "why": ["Correct. Speed is not a source of bias in the syllabus. It is a factor that can make oversight harder, which is a Domain 8.3 point.", "Wrong. Training data is explicitly named as a source of bias.", "Wrong. Deployment context is explicitly named as a source of bias. A model that behaves acceptably in one setting can cause harm in another.", "Wrong. Design choices are explicitly named as a source of bias."]}, {"q": "An AI tool used to shortlist job applicants was tested and found to select men at a notably higher rate than women with comparable qualifications. The organisation decides to keep using it but to remove names and gender markers from applications before screening. What is the best assessment?", "opts": ["The fix is sufficient, because the model can no longer see gender. This treats an optional good practice as a mandatory control.", "The fix is unnecessary, because the tool is only advisory. This treats an optional good practice as a mandatory control.", "The organisation should stop using AI in hiring entirely, since no AI tool can be made fair. This describes a related concept from a different area of the syllabus.", "Removing obvious markers may help but does not prove the tool is fair, because bias can persist through proxy signals in the remaining data"], "ans": 3, "exp": "Blinding obvious markers is a reasonable mitigation but not proof of fairness. Correlated features such as career gaps, institution names or phrasing can act as proxies that preserve the bias. Fairness has to be tested on outcomes, not assumed from the removal of a field.", "why": ["Wrong. This mistakes an unobservable field for an unlearned pattern. Proxies can carry the same signal indirectly.", "Wrong. Overcorrects. Bias can be assessed, mitigated and monitored. Abandoning the tool is one option, not the only defensible one.", "Wrong. Advisory status does not remove the duty of care. An advisory ranking still steers human decisions and can cause the same harm.", "Correct. Removing a field reduces but does not eliminate the risk of proxy discrimination. Outcome testing is still required."]}, {"q": "Which statement best reflects the relationship between bias and the deployment context?", "opts": ["Deployment context is a legal question and therefore outside a Foundation-level syllabus. This describes a related concept from a different area of the syllabus.", "A system that is unbiased in testing is unbiased everywhere, because bias is a property of the model alone.", "A system that performs acceptably in one setting can cause harm in another, so context is part of the bias assessment", "Deployment context matters only for systems that make decisions without any human involvement. This reverses the relationship between the two ideas being compared."], "ans": 2, "exp": "The syllabus names deployment context as a source of bias. The same model can be harmless in a low-stakes setting and harmful in one that affects people's opportunities or safety, so the setting is part of the assessment.", "why": ["Wrong. Bias is not a fixed property of a model alone. It emerges from the interaction of data, design and use.", "Wrong. The syllabus tests bias assessment as a professional duty at Foundation level. High-level awareness of the regulatory picture appears separately at 8.5.", "Correct. Context changes the stakes and can change the outcome, so it belongs in the assessment.", "Wrong. Human involvement can reduce risk but does not make context irrelevant. An advised human can still be misled."]}, {"q": "An AI-assisted decision leads to a customer being denied a service. When challenged, a staff member says 'the system made that decision, so it is not something I can answer for.' Why is this not an acceptable response?", "opts": ["Because the staff member should have overridden every AI recommendation. This treats an optional good practice as a mandatory control.", "Because the system is a legal person and should be pursued directly. This assumes the model holds intent it does not have.", "Because the human or the organisation remains accountable; 'the AI did it' is not a defence", "Because customers are not entitled to any explanation of automated decisions."], "ans": 2, "exp": "Accountability stays with the human and the organisation. An AI system cannot hold responsibility, so attributing the outcome to the system simply relocates blame to something that cannot answer for it. This is the central principle of syllabus 8.2.", "why": ["Wrong. This contradicts 8.2 and 8.4. Transparency and explainability at Foundation level exist precisely so decisions can be accounted for.", "Wrong. AI systems are not legal persons and cannot be held liable. This misconception is exactly what the syllabus guards against.", "Correct. The AI cannot bear accountability, so the person and organisation that deployed it remain answerable.", "Wrong. Overstating the duty. Oversight means meaningful review of material decisions, not a requirement to overrule every recommendation."]}, {"q": "What does 'explainability' mean at Foundation level in this syllabus?", "opts": ["Revealing the exact numerical weights inside the neural network. This assumes the model holds intent it does not have.", "Being able to give a meaningful account of how a decision was reached and what it was based on", "Guaranteeing that every AI decision can be perfectly reconstructed years later.", "Publishing the full source code of the model. This describes a related concept from a different area of the syllabus."], "ans": 1, "exp": "At Foundation level, explainability means being able to give a meaningful account of a decision: what information informed it and how it was arrived at. It is a professional-literacy standard, not a demand for source code or internal weights.", "why": ["Wrong. Publishing source code is not required and would not by itself explain a decision. Many systems are also third-party services the organisation does not own.", "Correct. Explainability is about giving a meaningful account of the basis for a decision.", "Wrong. Perfect reconstruction is a much stronger standard than the syllabus requires and is often technically impossible.", "Wrong. Model weights are technical detail well beyond Foundation level and, on their own, do not explain a particular outcome in professional terms."]}, {"q": "A manager is told that an automated tool rejected a large batch of applications. She asks for the criteria used. Which of the following best describes why this question matters?", "opts": ["Because a written reason removes any need for further human judgement. This substitutes a superficial check for verification at the original source.", "Because the criteria are the intellectual property of the organisation and must be protected. This assumes the model holds intent it does not have.", "Because automated decisions of any kind are prohibited without written reasons. This substitutes a superficial check for verification at the original source.", "Transparency and explainability allow the decision to be justified and reviewed, which is what makes accountability possible"], "ans": 3, "exp": "Transparency and explainability are the mechanisms through which accountability becomes real. Without a defensible account of the criteria, nobody can review the decision or answer for it.", "why": ["Wrong. A stated reason is a starting point for review, not a substitute for judgement. The human still owns the outcome.", "Wrong. The syllabus does not prohibit automated decisions. It requires oversight, transparency and accountability for them.", "Wrong. Protecting intellectual property is a separate concern and does not remove the need to account for a decision affecting a person.", "Correct. Being able to state and review the basis of a decision is what makes the accountable party able to answer for it."]}, {"q": "Which statement best captures the relationship between AI and human decision-makers in the syllabus's oversight principle?", "opts": ["AI and the person share accountability equally for the decision.", "AI proposes while a person decides and owns the outcome", "AI decides while a person reviews the decision afterwards if time allows.", "A person must personally perform every calculation the AI would otherwise do."], "ans": 1, "exp": "The syllabus states the principle directly: AI proposes, a person decides and owns the outcome. Oversight means the human holds the decision and the accountability, not that the human re-does the work.", "why": ["Wrong. Overstating the requirement. Oversight is about ownership of the decision, not duplication of every computation.", "Correct. This is the syllabus formulation and the cleanest statement of meaningful oversight.", "Wrong. Post-hoc review that may not happen is not oversight. The human must be positioned to decide, not merely to audit afterwards.", "Wrong. Accountability cannot be shared with a system that cannot bear it. It rests with the human and the organisation."]}, {"q": "In which situation does automated decision-making most clearly increase risk?", "opts": ["Where the decision is made quickly and cheaply. This treats an optional good practice as a mandatory control.", "Where the decision is based on data the organisation collected itself.", "Where the decision materially affects a person's rights, opportunities or safety", "Where the decision concerns an internal administrative matter. This treats an optional good practice as a mandatory control."], "ans": 2, "exp": "Risk rises with the stakes for the individual. Decisions that materially affect people's rights, opportunities or safety are where automated decisions most clearly increase risk and where human oversight matters most.", "why": ["Wrong. Internal administrative matters are generally lower stakes, though the principle still applies. They are not where risk most clearly increases.", "Wrong. Speed and cost are efficiency factors. They do not by themselves determine the risk to a person.", "Correct. High stakes for the individual is the factor that most clearly increases risk.", "Wrong. The origin of the data does not determine the stakes. The nature of the decision and its effect on people does."]}, {"q": "An organisation deploys a tool that automatically approves or declines expense claims up to £500, with no human review, and reports no problems. What is the strongest reason for caution?", "opts": ["Because the tool processes personal data, it cannot be used at all. This mistakes a symptom of the problem for its cause.", "The absence of human oversight removes the ability to catch systematic errors or unfair patterns before they affect many people", "The tool will certainly be biased against every employee. This mistakes a symptom of the problem for its cause.", "Automated approval is always unlawful below any monetary threshold. This applies a general principle without regard to the stakes involved."], "ans": 1, "exp": "No reported problems is not evidence of no problems. Without oversight, systematic errors or unfair patterns can be applied consistently to many people before anyone notices. Oversight provides the detection mechanism.", "why": ["Wrong. Processing personal data is governed by policy and law (Domain 7), but it does not make the use impossible. Many uses are lawful and appropriate.", "Correct. Removing oversight removes the mechanism that catches systematic error and unfairness.", "Wrong. The syllabus does not set monetary thresholds or prohibit automated approval as such. The concern is oversight proportionate to stakes.", "Wrong. Overstating the claim. Bias is a risk to be assessed, not a certainty to be assumed."]}, {"q": "A customer service chatbot handles enquiries without telling users it is not a person. A customer later complains. Under syllabus 8.4, what is the core problem?", "opts": ["Chatbots are not permitted in customer service roles. This reverses the relationship between the two ideas being compared.", "The chatbot gave incorrect information, which is the only real issue. This relies on the tool vendor to carry a duty that stays with the user.", "The problem is purely technical and can be resolved by improving the chatbot's accuracy. This treats an optional good practice as a mandatory control.", "Users should be told when they are interacting with an AI system, because non-disclosure misleads them about who they are dealing with"], "ans": 3, "exp": "Disclosure is required where AI use would otherwise mislead. A person who believes they are speaking to a human is misled about the nature of the interaction, regardless of whether the information given was accurate.", "why": ["Wrong. The syllabus does not prohibit chatbots. It requires appropriate disclosure of their nature.", "Wrong. Framing a disclosure duty as a technical accuracy problem misses the point entirely. The customer was not told what they were dealing with.", "Wrong. Accuracy is a separate issue and is not the complaint here. A perfectly accurate chatbot can still breach disclosure expectations.", "Correct. The failure is the misleading impression of human contact, which is exactly what 8.4 addresses."]}, {"q": "Which of the following is the clearest case where AI use should be disclosed?", "opts": ["An employee used a spell-checker to correct typing errors.", "A member of staff used a search engine to look up a reference.", "A published report was substantially generated by an AI tool", "A team used a calculator to check a total."], "ans": 2, "exp": "The syllabus ties disclosure to where it is required, where AI substantially generated the content, or where non-disclosure would mislead. Substantial generation of a published report is the clear case. Assistive tools that do not alter meaning are not the same thing.", "why": ["Wrong. Checking arithmetic with a calculator is routine assistance and does not meet the disclosure threshold.", "Wrong. Using a search engine to locate a source is a research action, not the generation of content.", "Correct. Substantial AI generation of published content triggers disclosure.", "Wrong. A spelling correction is an assistive edit that does not alter the substance or meaning of the content."]}, {"q": "A team uses AI to draft the bulk of an external policy document, then a senior manager reviews, edits and approves it. What does the syllabus suggest about disclosure?", "opts": ["Disclosure is required only if the document contains errors. This substitutes a superficial check for verification at the original source.", "Disclosure is never needed once a human has reviewed and approved the document. This assumes the model holds intent it does not have.", "Disclosure is required for all documents of any kind produced with any AI assistance. This substitutes a superficial check for verification at the original source.", "Disclosure should be considered where AI substantially generated the content, and non-disclosure would mislead if readers assumed it was entirely human-authored"], "ans": 3, "exp": "Substantial AI generation is a disclosure trigger in its own right. The question to ask is whether omitting disclosure would mislead the audience. Human review and approval is good practice and may affect the judgment, but it does not automatically remove the trigger.", "why": ["Wrong. Too broad. Ordinary assistive uses that do not substantially generate the content are not disclosure triggers.", "Wrong. Review and approval is important and can affect the assessment, but it does not automatically settle the disclosure question.", "Wrong. Disclosure is about transparency regarding how content was produced, not about whether the content happens to be correct.", "Correct. Substantial generation plus a misleading impression is the trigger. Human review informs the judgment but does not erase it."]}, {"q": "What is the primary purpose of an organisational AI policy?", "opts": ["To satisfy a single regulator in one jurisdiction.", "To guarantee that the organisation will never experience an AI-related incident.", "To set out how AI may be used, who is accountable, and how use is reviewed", "To prevent employees from learning about AI tools. This understates how early the duty begins in the workflow."], "ans": 2, "exp": "A policy provides the framework: permitted use, accountability, and review. Its purpose is to make responsible use the default and to make responsibilities clear, not to promise that nothing will ever go wrong.", "why": ["Wrong. Policy is not about restricting knowledge. It is about directing use. Restricting awareness would also undermine the AI literacy obligations elsewhere in the framework.", "Wrong. No policy can guarantee the absence of incidents. Its value is in guiding behaviour and enabling response.", "Correct. Policy defines permitted use, assigns accountability and establishes review. These are the governance essentials.", "Wrong. Organisations commonly operate across multiple jurisdictions. A policy written to satisfy a single regulator is incomplete."]}, {"q": "An employee wants to use a new AI tool that is not on the organisation's approved list. What is the appropriate course of action according to syllabus 7.3 and 8.5?", "opts": ["Use the tool freely, because unapproved tools are only a concern for the IT department. This substitutes a superficial check for verification at the original source.", "Use the tool but avoid mentioning it, to prevent unnecessary delay. This treats an optional good practice as a mandatory control.", "Seek approval through the organisation's process, and treat a gap in policy as a reason to escalate rather than to proceed", "Use the tool for non-confidential work only, since the risk is limited. This mistakes a symptom of the problem for its cause."], "ans": 2, "exp": "The syllabus is explicit: use approved tools and seek approval for new ones. Where policy is silent, that is a reason to escalate, not a licence to proceed on personal judgement.", "why": ["Wrong. Deciding unilaterally that the risk is limited is exactly the judgement the approval process exists to make. 'Non-confidential' is easy to get wrong.", "Wrong. Responsibility for governance is not confined to one department. Every user has obligations, and the organisation carries the consequences.", "Correct. Escalation is the syllabus position. A policy gap is a governance question for the organisation, not a decision for the individual.", "Wrong. Concealing unapproved use is the definition of shadow AI and is expressly contrary to the syllabus."]}, {"q": "Which of the following best describes the regulatory picture as the syllabus presents it at Foundation level?", "opts": ["A matter for specialist legal interpretation and therefore outside this certification.", "A single worldwide AI law with uniform requirements that must be learned in detail.", "A purely voluntary set of guidelines with no legal effect anywhere.", "A high-level, risk-based landscape, in which obligations scale with the risk of the use"], "ans": 3, "exp": "The syllabus tests the regulatory picture at awareness level: a high-level, risk-based landscape. Obligations increase with the risk of the use. Detailed legal interpretation is explicitly outside the scope of this certification.", "why": ["Wrong. There is no single worldwide AI law. Treating the landscape as one uniform regime is a factual error and beyond what is required here.", "Wrong. Regulatory frameworks are not purely voluntary, and describing them as having no legal effect is inaccurate.", "Wrong. The syllabus deliberately excludes legal interpretation, but that does not place the regulatory picture outside the certification. It is tested at awareness level.", "Correct. Risk-based and high-level is the syllabus framing, with the regulatory picture marked as awareness."]}, {"q": "The professional decision framework in syllabus 8.6 consists of which set of options?", "opts": ["Use / use with verification / escalate / do not use", "Draft / review / publish / archive. This understates how early the duty begins in the workflow.", "Ask / accept / record / move on.", "Use / delegate / automate / disclose."], "ans": 0, "exp": "The syllabus framework has four outcomes: use, use with verification, escalate, and do not use. The final clause of 8.6 adds the direction that when unsure, be more cautious.", "why": ["Correct. These are the four options named in the syllabus.", "Wrong. These terms belong to other domains. Delegation and automation are not the framework's options.", "Wrong. This is not the syllabus framework and omits the 'do not use' outcome entirely.", "Wrong. This describes a document workflow, not a decision framework for AI use."]}, {"q": "A member of staff is unsure whether an AI tool may be used for a particular task, and the relevant policy does not clearly cover the situation. According to the syllabus, what should guide the decision?", "opts": ["Being more cautious when unsure, escalating the question rather than assuming permission", "Proceeding, because uncertainty is resolved by the individual's judgement.", "Stopping all AI use across the organisation until a new policy is written. This assumes the model holds intent it does not have.", "Proceeding, because the absence of a prohibition implies permission."], "ans": 0, "exp": "Syllabus 8.6 states that the framework is applied with greater caution when unsure. Combined with the escalation principle in 7.3, the correct response to an unclear situation is to ask.", "why": ["Correct. Caution and escalation are exactly what the syllabus prescribes when the position is unclear.", "Wrong. Overcorrects. The obligation is to escalate the unclear case, not to halt all use across the organisation.", "Wrong. The framework exists to constrain individual judgement in exactly these cases, not to rely on it.", "Wrong. Silence in a policy is not permission. A gap is a reason to escalate."]}, {"q": "Which statement best expresses the central principle that syllabus 8.6 requires candidates to demonstrate?", "opts": ["AI can assist with professional work, but humans remain accountable for the outcome", "AI should be avoided in professional work wherever it is possible to do so.", "Accountability is transferred to the AI provider once a system is purchased.", "AI can be held accountable for outcomes where its recommendations were followed."], "ans": 0, "exp": "The central principle is that AI assists while humans remain accountable. This runs through 8.2, 8.3 and 8.6 and is the anchor for the whole domain.", "why": ["Correct. Assistance with retained human accountability is the syllabus's central principle.", "Wrong. The syllabus is not anti-AI. It requires responsible, accountable use, not avoidance.", "Wrong. Directly contradicts 8.2. 'The AI did it' is not a defence and AI cannot hold accountability.", "Wrong. Procuring a system does not transfer accountability away from the deploying organisation."]}, {"q": "A hospital plans to use an AI tool to help triage patients. Which combination of actions best reflects the syllabus across Domains 6, 7 and 8?", "opts": ["Avoid recording that AI was used, to protect patient confidentiality. This substitutes a superficial check for verification at the original source.", "Keep a clinician in the loop for every decision, treat all output as requiring verification given the stakes, and use only an approved tool under organisational policy", "Use the tool as the primary decision-maker because it processes cases faster than staff. This applies a general principle without regard to the stakes involved.", "Rely on the tool because medical software is regulated and therefore cannot be wrong. This applies a general principle without regard to the stakes involved."], "ans": 1, "exp": "Medical contexts are named in syllabus 6.5 as mandatory-verification settings. Oversight (8.3) and approval (7.3) also apply. The correct combination keeps the clinician accountable, verifies the output, and uses the approved tool.", "why": ["Wrong. Regulation of a product does not make its outputs correct in every case, and it does not remove the operator's duty of care.", "Correct. High stakes require verification, human oversight and approved tooling, all of which the syllabus requires.", "Wrong. Concealing AI use is the opposite of the disclosure duty in 8.4 and conflicts with governance and audit requirements.", "Wrong. This inverts 8.3. AI proposes while a person decides, and 6.5 names medical contexts as requiring verification."]}, {"q": "A financial services firm uses AI to produce a creditworthiness score. An applicant is declined and asks why. Which response best meets the syllabus standard?", "opts": ["Provide the model's internal numerical weights so the applicant can assess them.", "State that the decision was automated and therefore cannot be explained.", "Decline to respond, on the basis that the model is commercially confidential. This attributes to the system a capacity it cannot hold.", "Provide a meaningful account of the basis for the decision, with a route to human review"], "ans": 3, "exp": "Credit scoring affects people's opportunities and is a high-stakes use. The syllabus requires transparency and explainability at Foundation level, plus human oversight. A meaningful account with a route to review satisfies all three.", "why": ["Wrong. Commercial confidentiality does not remove the duty to account for a decision that affects a person.", "Wrong. Internal weights are far beyond Foundation level and would not give the applicant a meaningful account in professional terms.", "Wrong. Contradicts 8.2. Automation does not extinguish accountability, and explainability is still required.", "Correct. Explainability plus human oversight is precisely what 8.2 and 8.3 require in a people-affecting decision."]}, {"q": "Which of the following best describes why 'the AI did it' fails as a professional defence?", "opts": ["Because automated decisions are unlawful in professional contexts. This assumes the model holds intent it does not have.", "Because accountability requires a party that can answer for the outcome, and an AI system has no standing to do so", "Because AI systems deliberately conceal their reasoning from users. This mistakes a symptom of the problem for its cause.", "Because AI systems are owned by their providers, who become liable. This reverses the relationship between the two ideas being compared."], "ans": 1, "exp": "The defence fails because accountability needs a subject that can answer for the outcome. An AI system cannot be answerable, so responsibility remains with the human and the organisation that chose to deploy it.", "why": ["Wrong. This attributes intent to a system that has none, and it misdescribes the basis of the principle.", "Correct. Accountability requires a party capable of answering for the outcome. A system cannot be that party.", "Wrong. Provider liability is a separate commercial and regulatory question. It does not remove the deploying organisation's own accountability.", "Wrong. Automated decisions are not unlawful as such. They carry oversight, transparency and accountability obligations."]}, {"q": "An organisation wants to introduce an AI tool that summarises employee performance reviews to inform promotion decisions. Which set of considerations from Domain 8 is most directly engaged?", "opts": ["Only the technical accuracy of the summarisation model. This treats an optional good practice as a mandatory control.", "Bias assessment, human oversight of people-affecting decisions, and disclosure to those affected", "Only the cost of the tool compared with manual summarisation. This overstates the requirement beyond the professional-literacy standard.", "Only the data retention terms of the supplier agreement. This confuses a technical property of the system with a professional obligation."], "ans": 1, "exp": "Performance summaries feeding promotion decisions are a people-affecting use. Bias assessment (8.1), human oversight (8.3) and disclosure (8.4) are all engaged, and the stakes are high because careers are affected.", "why": ["Wrong. Data terms matter under Domain 7, but they are not the most direct Domain 8 considerations for a promotion decision.", "Correct. This use engages bias, oversight and disclosure together, which is the point of the domain.", "Wrong. Cost is a business consideration, not the dominant ethical consideration in a people-affecting use.", "Wrong. Accuracy alone is insufficient. A technically accurate summary can still embed unfair patterns and be applied without proper oversight."]}, {"q": "A team wants to publish an article written largely by generative AI. The team lead says 'we do not need to say anything, because the facts have all been checked.' How should this be assessed?", "opts": ["Accuracy checking and disclosure are separate obligations; disclosure may still be required where AI substantially generated the content", "The assessment is correct, because verified content needs no disclosure. This reverses the relationship between the two ideas being compared.", "Disclosure is only required if the article contains a factual error. This treats an optional good practice as a mandatory control.", "Disclosure is never required for text, only for images and video. This understates how early the duty begins in the workflow."], "ans": 0, "exp": "Fact-checking addresses whether the content is correct. Disclosure addresses how the content was produced. They are distinct obligations under 8.4 and 6.3, and satisfying one does not discharge the other.", "why": ["Correct. Verification and disclosure are separate duties. Doing one does not remove the other.", "Wrong. The syllabus disclosure principle is not limited to images and video. Substantial AI generation of text can trigger it, particularly where readers would be misled.", "Wrong. This makes disclosure depend on error, which inverts the purpose of transparency.", "Wrong. This conflates two distinct obligations. Verified content can still require disclosure."]}, {"q": "Which of the following best illustrates the syllabus statement that bias is a duty in people-affecting uses rather than a purely technical concern?", "opts": ["A team documents how a screening tool was tested for differential outcomes before deployment and records the results for review", "A supplier confirms the tool meets its own published benchmarks. This substitutes a superficial check for verification at the original source.", "A manager confirms the tool runs within its expected response time. This understates how early the duty begins in the workflow.", "A developer increases the model's accuracy score by two percentage points. This overstates the requirement beyond the professional-literacy standard."], "ans": 0, "exp": "Treating bias as a duty means actively testing for differential impact in the uses that affect people, and documenting the results so the decision can be reviewed. Accuracy, latency and supplier benchmarks are not assessments of fairness.", "why": ["Correct. Outcome testing plus a documented record is what discharging the duty looks like in practice.", "Wrong. Overall accuracy can improve while differential outcomes stay the same or worsen. It is not a fairness measure.", "Wrong. Supplier benchmarks may be relevant evidence, but they are not the deployer's assessment of its own use and its own affected population.", "Wrong. Response time is a performance measure and says nothing about differential impact on groups."]}, {"q": "A junior employee is asked to send an AI-drafted response to a client complaint. Which action best demonstrates the professional decision framework from 8.6?", "opts": ["Send the draft but add a line stating that AI produced it. This describes a related concept from a different area of the syllabus.", "Send the draft unchanged because the AI drafted it accurately. This relies on the tool vendor to carry a duty that stays with the user.", "Review and verify the draft against the case record, correct it where needed, and take ownership of the final message", "Refuse the task because AI should not be used in client communication. This attributes to the system a capacity it cannot hold."], "ans": 2, "exp": "The framework's 'use with verification' outcome applies: check the draft against the real record, correct it, and own the result. This combines the verification habit (5.5) with the accountability principle (8.2).", "why": ["Wrong. A disclosure line is not a substitute for verification and may be unnecessary in a routine internal reply. The work of checking still has to be done.", "Wrong. This ignores 5.5 and 8.6. Uncritical use of a draft is the behaviour the framework is designed to prevent.", "Correct. Use with verification plus personal ownership is exactly the framework's expected behaviour.", "Wrong. Overcorrects. The syllabus does not prohibit AI use in client communication. It requires responsible, verified use."]}, {"q": "Which of the following most accurately states the relationship between the four ethical pillars described in Domain 8 and the wider syllabus?", "opts": ["The pillars apply only to organisations that develop their own AI models. This assumes the model holds intent it does not have.", "Accountability, transparency, oversight and responsible use are interconnected, so weakness in one undermines the others", "Each pillar operates independently, so an organisation need only satisfy the one most relevant to its sector.", "Only accountability carries any practical weight, because the others are aspirational. This mistakes a symptom of the problem for its cause."], "ans": 1, "exp": "The pillars reinforce one another. Oversight without transparency cannot be meaningful, and accountability without disclosure cannot be demonstrated. Weakness in one undermines the rest.", "why": ["Wrong. The obligations fall on deployers and users, not only on model developers. Most organisations are deployers.", "Correct. The pillars are interdependent, which is why the syllabus presents them as a framework rather than a checklist.", "Wrong. Treating them as independent invites gaps. An organisation that satisfies only one has not achieved responsible use.", "Wrong. All four carry practical weight and appear in the decision framework and governance material."]}, {"q": "An organisation adopts a policy requiring that AI-generated content intended for external publication be reviewed by a named individual before release. Which governance purpose does this serve?", "opts": ["It assigns clear accountability and inserts a human decision point where errors could cause public harm", "It guarantees that published content will contain no errors. This understates how early the duty begins in the workflow.", "It transfers liability to the reviewing individual and away from the organisation. This understates how early the duty begins in the workflow.", "It removes the need for any disclosure of AI use. This applies a general principle without regard to the stakes involved."], "ans": 0, "exp": "Naming a responsible reviewer creates an accountable human decision point before externally visible release, which is precisely what governance is for. It does not shift organisational liability, remove disclosure duties, or guarantee accuracy.", "why": ["Correct. Clear accountability plus a human gate at the highest-risk moment is the core purpose of the control.", "Wrong. Review reduces risk. It cannot guarantee the absence of errors.", "Wrong. Review and disclosure are separate obligations. Reviewing content does not remove the duty to disclose where required.", "Wrong. Naming a reviewer does not transfer liability away from the organisation, which remains accountable for its systems and processes."]}, {"q": "Which statement correctly distinguishes a Foundation-level understanding of responsible AI from a specialist one?", "opts": ["Foundation level requires only awareness that AI exists and carries risks. This attributes to the system a capacity it cannot hold.", "Foundation level requires the ability to build and audit a machine learning model. This describes a related concept from a different area of the syllabus.", "Foundation level requires the ability to interpret AI regulation in detail. This applies a general principle without regard to the stakes involved.", "Foundation level requires understanding and applying responsible-use principles in professional work, not legal or technical specialisation"], "ans": 3, "exp": "The syllabus states that all content is tested at Foundation level: candidates understand and apply concepts rather than engineer, implement or specialise. Legal interpretation and model building are explicitly excluded.", "why": ["Wrong. Model building and technical implementation are excluded. Awareness of how models work is not the same as being able to build one.", "Wrong. Legal and regulatory interpretation is expressly excluded from the syllabus.", "Wrong. Too low a standard. Foundation level requires application and judgement, not passive recognition, other than for the items marked awareness.", "Correct. Understand and apply is the Foundation standard. The exclusions are explicit in the syllabus scope statement."]}, {"q": "An organisation's AI policy is two years old and predates the tools its staff now use daily. What does the syllabus suggest about the governance response?", "opts": ["Staff should be trusted to interpret an out-of-date policy as they see fit. This substitutes a superficial check for verification at the original source.", "The policy should be reviewed and updated, because governance requires ongoing review as practice and the field change", "The policy remains valid indefinitely because it was formally approved. This relies on the tool vendor to carry a duty that stays with the user.", "The policy should be withdrawn entirely rather than updated. This overstates the requirement beyond the professional-literacy standard."], "ans": 1, "exp": "Syllabus 8.5 describes governance as including oversight, accountability and review. A policy that no longer reflects how AI is actually used cannot guide behaviour or assign responsibility, so it needs periodic review rather than permanent validity.", "why": ["Wrong. Overcorrects. The remedy for an out-of-date policy is to update it, not to remove the governance framework altogether.", "Correct. Review is a named element of governance, and a policy that lags actual practice has stopped doing its job.", "Wrong. Formal approval at a point in time does not make a policy fit for purpose as tools and practice change.", "Wrong. Leaving interpretation to individuals removes the accountability structure that policy exists to provide, and encourages shadow AI."]}];
var PASS = 70;
var L = ["A","B","C","D"];
var cur = 0, answered = [], correct = [], submitted = false;

// Randomise question order on every attempt so the sequence cannot be memorised
// from a screenshot. Uses the same RNG discipline as the accessible quiz standard.
(function shuffleQuestions(){
  var seed = Date.now() % 2147483647;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = Q.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = Q[i]; Q[i] = Q[j]; Q[j] = t;
  }
})();

// --- Copy / cut / paste attenuation -------------------------------------------------
// Assessment integrity: discourage copying questions out and pasting answers in.
// This is a deterrent, NOT a security control, a determined user can defeat it via
// devtools. It stops casual text harvesting and pasted-in answers during a sitting.
(function blockClipboard(){
  function stop(e){
    e.preventDefault();
    showToast('Copying, cutting and pasting are disabled during this assessment.');
    return false;
  }
  ['copy','cut','paste','contextmenu'].forEach(function(evt){
    document.addEventListener(evt, stop, true);
  });
  // Disable text selection inside the question and analysis areas only, so that
  // the skip link and buttons remain fully keyboard accessible.
  var style = document.createElement('style');
  style.textContent = '#qholder, #results { -webkit-user-select:none; -moz-user-select:none;'
                    + ' -ms-user-select:none; user-select:none; }';
  document.head.appendChild(style);
})();

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

var qlen = Q.length;
for (var i = 0; i < qlen; i++){ answered.push(false); correct.push(false); }

function el(id){ return document.getElementById(id); }

function render(){
  var q = Q[cur];
  var h = '<h2 class="qtext" id="qt">' + q.q + '</h2>';
  h += '<div role="radiogroup" aria-labelledby="qt">';
  for (var j = 0; j < q.opts.length; j++){
    h += '<button class="opt" type="button" role="radio" aria-checked="false" '
       + 'data-q="' + cur + '" data-o="' + j + '" id="o' + cur + '_' + j + '">'
       + '<span class="opt-letter">' + L[j] + '.</span>'
       + '<span class="op-text">' + q.opts[j] + '</span>'
       + '<span class="tag" id="t' + cur + '_' + j + '"></span></button>';
  }
  h += '</div><div id="ex' + cur + '"></div>';
  el('qholder').innerHTML = h;
  var btns = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', onPick);
  }
  var last = (cur === qlen - 1);
  el('next').style.display = last ? 'none' : '';
  el('submit').style.display = last ? '' : 'none';
  el('next').disabled = !answered[cur];
  el('submit').disabled = !answered[cur];
  updateBar();
}

function onPick(e){
  var b = e.currentTarget;
  var qi = parseInt(b.getAttribute('data-q'), 10);
  var oi = parseInt(b.getAttribute('data-o'), 10);
  if (answered[qi]) return;
  answered[qi] = true;
  var q = Q[qi];
  var isRight = (oi === q.ans);
  correct[qi] = isRight;
  var all = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < all.length; k++){
    var kq = parseInt(all[k].getAttribute('data-q'), 10);
    var ko = parseInt(all[k].getAttribute('data-o'), 10);
    if (kq !== qi) continue;
    all[k].disabled = true;
    all[k].setAttribute('aria-checked', ko === oi ? 'true' : 'false');
    var tg = el('t' + kq + '_' + ko);
    if (ko === q.ans){
      all[k].classList.add('correct');
      if (tg) tg.textContent = ko === oi ? '✓ Correct' : '✓ This was correct';
      if (tg) tg.className = 'tag correct';
    } else if (ko === oi){
      all[k].classList.add('wrong');
      if (tg) tg.textContent = '✗ Your answer';
      if (tg) tg.className = 'tag wrong';
    }
  }
  renderAnalysis(qi);
  var done = 0;
  for (var m = 0; m < qlen; m++){ if (answered[m]) done++; }
  el('running').textContent = 'Score: ' + tally() + ' / ' + done;
  el('next').disabled = false;
  el('submit').disabled = false;
  updateBar();
}

function renderAnalysis(qi){
  var q = Q[qi];
  var h = '<div class="analysis"><h3>Why each option is right or wrong</h3>';
  h += '<p class="why good">Correct answer: ' + L[q.ans] + '. '
     + q.opts[q.ans] + '</p><p>' + q.exp + '</p>';
  for (var j = 0; j < q.opts.length; j++){
    h += '<p><span class="why">' + L[j] + '.</span> ' + q.why[j] + '</p>';
  }
  h += '</div>';
  el('ex' + qi).innerHTML = h;
}

function tally(){
  var n = 0;
  for (var i = 0; i < qlen; i++){ if (correct[i]) n++; }
  return n;
}

function updateBar(){
  el('counter').textContent = 'Question ' + (cur + 1) + ' of ' + qlen;
  var pct = Math.round(((cur + 1) / qlen) * 100);
  el('pinner').style.width = pct + '%';
  var pb = el('pbar');
  if (pb){ pb.setAttribute('aria-valuenow', String(cur + 1)); }
}

el('next').addEventListener('click', function(){
  if (cur < qlen - 1){ cur++; render(); }
});
el('submit').addEventListener('click', function(){ showResults(false); });

function mark(){
  var c = tally();
  var p = Math.round((c / qlen) * 100);
  el('pct').textContent = p + '%';
  el('ncorrect').textContent = c;
  el('nwrong').textContent = qlen - c;
  el('ntotal').textContent = qlen;
  var g = el('gauge');
  var pass = (p >= PASS);
  g.style.background = pass ? '#dff3e1' : '#fbe3e3';
  g.style.border = '8px solid ' + (pass ? '#2e7d32' : '#c62828');
  el('verdictlbl').textContent = pass ? 'PASS' : 'NOT YET';
  el('verdictlbl').style.color = pass ? '#2e7d32' : '#c62828';
  el('pct').style.color = pass ? '#2e7d32' : '#c62828';
  el('dignote').textContent = pass
    ? 'You have met the pass standard for this section. Revisit any missed items below, then move on.'
    : 'Below the pass standard of ' + PASS + '%. Review each missed item below and retake when ready.';
  var ul = el('missed');
  ul.innerHTML = '';
  var missed = 0;
  for (var i = 0; i < qlen; i++){
    if (!correct[i]){
      missed++;
      var li = document.createElement('li');
      li.style.marginBottom = '8px';
      li.textContent = Q[i].q + ', correct: ' + L[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans];
      ul.appendChild(li);
    }
  }
  if (missed === 0){
    var li2 = document.createElement('li');
    li2.textContent = 'No missed items.';
    ul.appendChild(li2);
  }
}

function showResults(force){
  if (submitted && !force) return;
  submitted = true;
  mark();
  el('quiz').style.display = 'none';
  el('results').style.display = 'block';
  window.scrollTo(0, 0);
}

el('restart').addEventListener('click', function(){
  var p = window.prompt('Enter supervisor passcode to reset this assessment:');
  if (p !== '1234'){
    if (p !== null){ window.alert('Incorrect passcode. Assessment not reset.'); }
    return;
  }
  location.reload();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && !answered[cur] === false && cur < qlen - 1){
    e.preventDefault(); cur++; render();
  }
});

// ---- Assessment integrity guard ----
// Deterrent only: browser menus can bypass keyboard blocks and the HTML source
// always contains the questions. Pair with invigilation for real integrity.
(function integrityGuard(){
  var tc = null;
  function toast(msg){
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (tc) clearTimeout(tc);
    tc = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function block(e, msg){
    e.preventDefault();
    e.stopPropagation();
    toast(msg || 'Copying is disabled on this assessment.');
    return false;
  }
  document.addEventListener('contextmenu', function(e){ block(e); });
  document.addEventListener('copy', function(e){ block(e); });
  document.addEventListener('cut', function(e){ block(e); });
  document.addEventListener('dragstart', function(e){ block(e, 'Dragging is disabled.'); });
  document.addEventListener('selectstart', function(e){
    var n = e.target;
    while (n && n !== document.body){
      if (n.id === 'qholder' || n.id === 'results' ||
          (n.classList && (n.classList.contains('opt') || n.classList.contains('analysis')))){
        block(e, 'Selecting question text is disabled.');
        return;
      }
      n = n.parentNode;
    }
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'a' || k === 'u' || k === 's' || k === 'p')){
      block(e); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){
      block(e, 'Developer tools are disabled.'); return;
    }
    if (e.key === 'F12'){ block(e, 'Developer tools are disabled.'); }
  }, true);
})();

render();
</script>
<script data-cfasync="false">
(function () {
  function native(){ return typeof window.Capacitor!=='undefined' && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform(); }
  function setup(){
    if(!native()){return;}
    var App = window.Capacitor.Plugins && window.Capacitor.Plugins.App; if(!App){return;}
    var t=null,b=0;
    function toast(m){ if(!t){t=document.createElement('div'); t.className='app-toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.classList.add('show'); clearTimeout(t._z); t._z=setTimeout(function(){t.classList.remove('show');},2200); }
    App.addListener('backButton', function(info){ var cb=info&&info.canGoBack;
      if(cb){ if(window.history.length>1){window.history.back();} else {window.location.href=window.location.origin+'/';} return; }
      var n=Date.now(); if(n-b<2200){App.exitApp(); return;} b=n; toast('Press back again to exit');
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',setup);}else{setup();}
})();
</script>
