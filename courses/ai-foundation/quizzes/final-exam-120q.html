<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0"/>
<title>UKAIC AI Foundation, Final Examination (120 Questions)</title>
<style>
:root{--navy:#002b5c;--ink:#0d1b2a;--ok:#2e7d32;--bad:#c62828;--line:#c9d4e4;--bg:#ffffff;--tint:#eef3fa;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);
font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.6;}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;
padding:12px 20px;z-index:999;font-weight:bold;text-decoration:none;}
.skip-link:focus{left:0;}
header[role="banner"]{background:var(--navy);color:#fff;padding:14px 24px;}
header[role="banner"] h1{margin:0;font-size:1.15rem;font-weight:bold;letter-spacing:.2px;}
header[role="banner"] .sub{font-size:.85rem;opacity:.9;margin-top:3px;}
main[role="main"]{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
margin-bottom:8px;font-size:1rem;font-weight:bold;}
.progress-outer{height:14px;background:var(--tint);border:1px solid var(--line);
border-radius:8px;overflow:hidden;margin-bottom:26px;}
.progress-inner{height:100%;width:0;background:var(--navy);
transition:width .3s ease;}
@media (prefers-reduced-motion: reduce){.progress-inner{transition:none;}}
.qtext{font-size:1.3rem;font-weight:bold;margin:0 0 20px;line-height:1.45;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
background:var(--tint);border:2px solid var(--line);border-radius:10px;
padding:15px 17px;margin-bottom:12px;font-size:1.05rem;color:var(--ink);
font-family:inherit;cursor:pointer;line-height:1.5;}
.opt:hover:not(:disabled){background:#dde7f5;border-color:#9db3d0;}
.opt:disabled{cursor:default;}
.opt:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
.opt.correct{background:#dff3e1;border-color:var(--ok);}
.opt.wrong{background:#fbe3e3;border-color:var(--bad);}
.opt-letter{font-weight:bold;color:#4a6a8a;flex-shrink:0;width:24px;}
.opt.correct .opt-letter{color:var(--ok);}
.opt.wrong .opt-letter{color:var(--bad);}
.op-text{flex:1;}
.tag{font-weight:bold;font-size:.85rem;margin-left:8px;white-space:nowrap;}
.tag.correct{color:var(--ok);}
.tag.wrong{color:var(--bad);}
.analysis{margin-top:16px;padding:16px 18px;border-left:6px solid var(--navy);
background:var(--tint);border-radius:0 8px 8px 0;}
.analysis h3{margin:0 0 10px;font-size:1rem;text-transform:uppercase;
letter-spacing:.5px;}
.analysis p{margin:0 0 9px;font-size:.97rem;}
.analysis p:last-child{margin-bottom:0;}
.analysis .why{font-weight:bold;}
.analysis .good{color:var(--ok);}
.analysis .bad{color:var(--bad);}
.navrow{margin-top:26px;}
button.primary{background:var(--navy);color:#fff;border:none;border-radius:8px;
padding:15px 30px;font-size:1.05rem;font-weight:bold;cursor:pointer;
font-family:inherit;}
button.primary:hover{background:#00408a;}
button.primary:focus-visible{outline:3px solid #002b5c;outline-offset:3px;}
button.primary:disabled{background:#9db3d0;cursor:not-allowed;}
button.submit{background:var(--ok);}
button.submit:hover{background:#1f5b23;}
.verdict{font-size:1.15rem;font-weight:bold;margin:0 0 18px;padding:14px 18px;
border-radius:8px;}
.verdict.ok{background:#dff3e1;color:#1f5b23;border:2px solid var(--ok);}
.verdict.no{background:#fbe3e3;color:#8c1c1c;border:2px solid var(--bad);}
#results{display:none;text-align:center;}
.gauge{width:230px;height:230px;border-radius:50%;margin:0 auto 26px;
display:flex;align-items:center;justify-content:center;flex-direction:column;}
.gauge .pct{font-size:3.2rem;font-weight:bold;line-height:1;}
.gauge .lbl{font-size:.95rem;margin-top:6px;letter-spacing:1px;}
.grid{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px 0;}
.cell{border:2px solid var(--line);border-radius:10px;padding:16px 26px;min-width:130px;}
.cell .n{font-size:2rem;font-weight:bold;display:block;}
.cell .t{font-size:.9rem;text-transform:uppercase;letter-spacing:.5px;}
.cell.good{border-color:var(--ok);} .cell.good .n{color:var(--ok);}
.cell.bad{border-color:var(--bad);} .cell.bad .n{color:var(--bad);}
.note{font-size:.95rem;color:#3d5878;max-width:640px;margin:0 auto 22px;}
/* Assessment integrity: selection and copy are disabled on question content. */
#qholder,#results,.analysis,.opt{-webkit-user-select:none;-moz-user-select:none;
  -ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
#quiz,#results{-webkit-user-drag:none;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:13px 24px;border-radius:8px;
  font-size:.95rem;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:9999;display:none;}
.toast.show{display:block;}
@media (prefers-reduced-motion: no-preference){.toast{transition:opacity .2s ease;}}
</style>
</head>

<header role="banner">

<main role="main" id="main">
  <div id="quiz">
    <div class="bar">
      <span id="counter" role="status" aria-live="polite">Question 1 of 120</span>
      <span id="running" aria-live="polite">Score: 0 / 0</span>
    </div>
    <div class="progress-outer" role="progressbar" aria-labelledby="counter"
         aria-valuemin="0" aria-valuemax="120" aria-valuenow="0" id="pbar">
      <div class="progress-inner" id="pinner"></div>
    </div>
    <div id="qholder"></div>
    <div class="navrow">
      <button class="primary" id="next" type="button">Next question &rarr;</button>
      <button class="primary submit" id="submit" type="button"
              style="display:none">Submit assessment</button>
    </div>
  </div>
  <div id="results" role="region" aria-label="Assessment results">
    <div class="gauge" id="gauge"><span class="pct" id="pct">0%</span>
      <span class="lbl" id="verdictlbl">, </span></div>
    <div class="grid">
      <div class="cell good"><span class="n" id="ncorrect">0</span>
        <span class="t">Correct</span></div>
      <div class="cell bad"><span class="n" id="nwrong">0</span>
        <span class="t">Incorrect</span></div>
      <div class="cell"><span class="n" id="ntotal">0</span>
        <span class="t">Total</span></div>
    </div>
    <p class="note" id="dignote"></p>
    <ul id="missed" style="text-align:left;max-width:760px;margin:0 auto 24px;
      padding-left:22px;font-size:.98rem;"></ul>
    <button class="primary" id="restart" type="button">Restart assessment</button>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var Q = [{"q": "Which statement best describes what most modern artificial intelligence actually does?", "opts": ["It stores a large database of verified facts and looks up the correct answer. This treats an optional good practice as a mandatory control.", "It follows a fixed set of written rules that programmers supply in advance.", "It reasons from first principles in the way a human expert does. This mistakes a symptom of the problem for its cause.", "It learns patterns from data in order to make predictions, generate content or take actions"], "ans": 3, "exp": "Most modern AI learns patterns from data and then uses those patterns to make predictions, generate content or take actions. This is the syllabus definition and the foundation for everything else in Domain 1.", "why": ["Wrong. This describes rule-based systems, which the syllabus separately identifies as a distinct and older approach.", "Wrong. This describes a database lookup. A learning system derives answers from learned patterns rather than retrieving stored ones.", "Wrong. Reasoning from first principles is not how these systems work. They generalise from statistical patterns.", "Correct. Learning patterns from data to produce predictions, content or actions is the syllabus definition."]}, {"q": "A colleague says an AI tool 'knows' the answer because it is intelligent in the human sense. How should this be corrected?", "opts": ["The tool is conscious but its consciousness is not observable to users. This applies a general principle without regard to the stakes involved.", "The tool produces likely outputs from patterns in its training data; it is not conscious and is not infallible", "The tool has no relationship to its training data and produces answers at random. This overstates the requirement beyond the professional-literacy standard.", "The tool does know the answer, because it was trained on a very large amount of text. This attributes to the system a capacity it cannot hold."], "ans": 1, "exp": "Syllabus 1.1 states plainly what AI is not: not conscious, not infallible, not magic. Fluency in output is a property of pattern-based generation, not evidence of understanding.", "why": ["Wrong. Large training data improves fluency and coverage but does not confer knowledge in the human sense, nor accuracy.", "Correct. Pattern-based generation without consciousness or guaranteed accuracy is the syllabus position.", "Wrong. Overcorrects. The outputs are derived from training data; they are not random, which is precisely what makes them persuasive.", "Wrong. Suggesting an unobservable consciousness is not a correction and is not supported by the syllabus."]}, {"q": "Which of the following best illustrates that a simple explanation of AI can still be accurate?", "opts": ["Describing a language model as producing likely continuations of text, which is a simplification but not a falsehood", "Stating that AI is magic because the internal process is too complex to describe. This understates how early the duty begins in the workflow.", "Saying that AI cannot be explained at all and should simply be trusted. This substitutes a superficial check for verification at the original source.", "Claiming that AI has feelings because it responds sympathetically. This applies a general principle without regard to the stakes involved."], "ans": 0, "exp": "Syllabus 1.1 notes that some systems are rule-based rather than learning systems and that 'simple does not equal wrong'. A simplified but truthful description is accurate; a false description dressed up as simplicity is not.", "why": ["Correct. Simplified-but-true is the syllabus standard. It is a legitimate description of the mechanism.", "Wrong. This conflates complexity with inexplicability and encourages uncritical trust.", "Wrong. This attributes a capacity the system does not have. Sympathetic phrasing is generated, not felt.", "Wrong. Magic is a false explanation, not a simple one, and the syllabus explicitly rejects it."]}, {"q": "Which of the following is an example of a rule-based system rather than a learning system?", "opts": ["A system that generates a written summary of a long document.", "A system that predicts which email users are most likely to open.", "A system that checks an invoice against a fixed set of validation conditions", "A system that groups customers by reviewing past purchasing behaviour."], "ans": 2, "exp": "Syllabus 1.1 notes that some systems are rule-based rather than learning systems. Fixed validation conditions apply explicit rules; the other options derive behaviour from data.", "why": ["Wrong. Predicting which emails users open is derived from historical patterns, so it is a learning system.", "Wrong. Generating a summary requires a trained model, not a fixed rule set.", "Correct. Fixed validation conditions are rules applied directly, with no learning from data.", "Wrong. Grouping customers from past behaviour is learning from data, which is a learning system."]}, {"q": "Which sequence correctly shows how the terms nest, from broadest to narrowest?", "opts": ["Generative AI contains deep learning, which contains machine learning, which contains artificial intelligence.", "Artificial intelligence contains machine learning, which contains deep learning, which contains generative AI", "Machine learning contains artificial intelligence, which contains generative AI, which contains deep learning.", "Artificial intelligence, machine learning, deep learning and generative AI are all separate and unrelated fields."], "ans": 1, "exp": "Syllabus 1.2 requires candidates to state the nesting: AI contains machine learning, which contains deep learning, which contains generative AI and large language models.", "why": ["Wrong. This reverses the order entirely. Generative AI is the narrowest category, not the broadest.", "Correct. This is the exact nesting described in the syllabus.", "Wrong. This inverts the relationship. Machine learning is a subset of AI, not the other way round.", "Wrong. The terms are nested, not separate. Treating them as unrelated is the error the syllabus asks candidates to avoid."]}, {"q": "A software vendor advertises that its product 'uses AI' when it is in fact a machine learning model performing classification. How should a professional respond?", "opts": ["Reject the product, because vendors who use broad terms cannot be trusted. This relies on the tool vendor to carry a duty that stays with the user.", "Accept the claim, because machine learning is a form of artificial intelligence and the statement is therefore false", "Recognise that the claim is imprecise and that precision matters when reading tool claims and marketing", "Ignore the terminology, because the distinction has no practical consequence."], "ans": 2, "exp": "Syllabus 1.2 explains that precision matters when reading tool claims, vendor marketing and media coverage. Machine learning is a subset of AI, so the claim is technically defensible but vague rather than false. Precision lets a professional ask what the system actually does.", "why": ["Wrong. The distinction has practical consequences, because it determines what questions to ask about capability and limits.", "Wrong. Rejecting a product on terminology alone is an overreaction and is not what the syllabus asks for.", "Correct. The issue is imprecision, and the syllabus specifically says precision matters in marketing claims.", "Wrong. A machine learning model is a form of AI, so the statement is not false. It is imprecise, which is a different problem."]}, {"q": "Which of the following correctly distinguishes machine learning from deep learning?", "opts": ["The two terms are exact synonyms and may be used interchangeably. This applies a general principle without regard to the stakes involved.", "Machine learning requires no data, whereas deep learning requires data. This relies on the tool vendor to carry a duty that stays with the user.", "Deep learning uses neural networks with many layers, and sits within the broader category of machine learning", "Deep learning is a broader category that contains all of machine learning. This attributes to the system a capacity it cannot hold."], "ans": 2, "exp": "The syllabus requires the nesting to be understood: machine learning contains deep learning, which uses multi-layered neural networks. They are not synonyms.", "why": ["Wrong. This reverses the nesting. Deep learning sits inside machine learning, not outside it.", "Wrong. Both approaches learn from data. The claim that machine learning requires no data is false.", "Correct. Deep learning is a subset of machine learning characterised by multi-layered neural networks.", "Wrong. The syllabus specifically identifies treating these terms as synonyms as an error to avoid."]}, {"q": "Which statement best defines artificial general intelligence (AGI)?", "opts": ["A hypothetical system able to perform any intellectual task a human can, and a research goal rather than a current product", "Any AI system capable of performing more than one task. This describes a related concept from a different area of the syllabus.", "A general-purpose AI system available to the public without a licence. This assumes the model holds intent it does not have.", "A large language model that performs well on a wide range of benchmarks. This substitutes a superficial check for verification at the original source."], "ans": 0, "exp": "Syllabus 1.3 defines AGI as a hypothetical system able to perform any intellectual task a human can, and states it is a research goal and not a current product.", "why": ["Correct. This is the syllabus definition, including its status as a hypothesis rather than a shipping product.", "Wrong. Narrow AI routinely handles many tasks. Multi-task ability is not the AGI threshold.", "Wrong. Strong benchmark performance is evidence of broad capability within narrow tasks, not general intelligence.", "Wrong. Public availability and licensing have nothing to do with the AGI definition."]}, {"q": "A news article claims a new model 'has achieved general intelligence'. What is the most reliable test to apply?", "opts": ["Ask whether the model can pass a single difficult examination. This mistakes a symptom of the problem for its cause.", "Ask whether the model was trained on a very large dataset. This relies on the tool vendor to carry a duty that stays with the user.", "Ask whether the model is available to the public. This treats an optional good practice as a mandatory control.", "Ask whether it can perform any intellectual task a human can, or whether it is a system designed for specific tasks and limited outside them"], "ans": 3, "exp": "Syllabus 1.3 requires candidates to apply the 'narrow or general?' test to dramatic claims. Narrow systems are capable within their domain and limited outside it. All commercial AI today is narrow.", "why": ["Wrong. Availability is a distribution question, not a capability question.", "Wrong. Excelling on one examination demonstrates narrow capability in that area, not general intelligence.", "Wrong. Dataset size affects capability within a domain. It does not establish general intelligence.", "Correct. This is the narrow-versus-general test the syllabus asks candidates to apply."]}, {"q": "Which of the following is the most accurate statement about narrow AI?", "opts": ["It refers to AI systems with deliberately limited training data. This applies a general principle without regard to the stakes involved.", "It is designed for specific tasks, is capable within its domain and is limited outside it", "It is a temporary stage that all current systems have already moved beyond. This understates how early the duty begins in the workflow.", "It can only perform a single task and nothing else under any circumstances."], "ans": 1, "exp": "Syllabus 1.3 defines narrow AI as systems designed for specific tasks, capable within their domain but limited outside it. All commercial AI today is narrow.", "why": ["Wrong. The term refers to scope of capability, not the size of the training dataset.", "Correct. This is the syllabus definition of narrow AI.", "Wrong. Narrow AI is the current state of all commercial AI, not a stage that has been passed.", "Wrong. Slightly overstates it. Narrow systems can handle several related tasks; the limitation is breadth of domain."]}, {"q": "Which of the following is the clearest example of narrow AI already embedded in everyday tools?", "opts": ["Email spam filtering that classifies incoming messages", "A tool that has replaced the need for human judgement in all decisions", "A system that can perform any intellectual task a human can.", "A chatbot that is conscious of the conversation."], "ans": 0, "exp": "Syllabus 1.4 asks candidates to recognise narrow AI already embedded in routine tools such as spam filtering, search ranking, navigation and recommendations.", "why": ["Correct. Spam filtering is a named syllabus example of everyday narrow AI.", "Wrong. Chat systems are not conscious. This invokes a misconception the syllabus explicitly addresses.", "Wrong. This describes AGI, which the syllabus states is hypothetical and not a current product.", "Wrong. No system has replaced human judgement, and the syllabus requires humans to remain accountable."]}, {"q": "Why does syllabus 1.4 state that most professionals are already daily AI users?", "opts": ["Because everyone has now attended formal AI training. This substitutes a superficial check for verification at the original source.", "Because all workplace software now contains generative AI. This describes a related concept from a different area of the syllabus.", "Because using a computer is itself a form of AI use. This understates how early the duty begins in the workflow.", "Because narrow AI is embedded in routine tools such as search ranking, navigation and recommendations that people use without thinking of them as AI"], "ans": 3, "exp": "The syllabus point is that AI is already embedded in routine tools and used daily, often without the user identifying it as AI. This matters because it means AI literacy is not an optional future concern.", "why": ["Wrong. Too strong. Generative AI is one form of AI and is not present in all workplace software.", "Wrong. The claim is about tool use, not training. Most users have had no formal AI training at all.", "Wrong. Using a computer is not the same as using AI. The claim is specific to AI-enabled features.", "Correct. Embedded narrow AI in everyday tools is the reason the syllabus gives."]}, {"q": "A manager claims her team does not use AI at all. Which response is most consistent with the syllabus?", "opts": ["She is correct if her team only uses standard office software. This confuses a technical property of the system with a professional obligation.", "She should be advised to avoid all AI use to keep the position accurate. This relies on the tool vendor to carry a duty that stays with the user.", "She is correct because AI only counts as AI when it is generative. This overstates the requirement beyond the professional-literacy standard.", "Most professionals already use some form of narrow AI daily, so the useful question is which tools use it and how they should be governed"], "ans": 3, "exp": "Syllabus 1.4 makes the practical point that most professionals are already daily AI users. The valuable move is to recognise where AI is in use and govern it accordingly, not to debate the label.", "why": ["Wrong. Standard office software increasingly includes AI-enabled features such as ranking, suggestions and prediction, so the claim is unlikely to hold.", "Wrong. Avoidance is not the syllabus position. Responsible, accountable use is.", "Wrong. Narrow non-generative AI such as ranking and classification is still AI.", "Correct. Recognising embedded AI and governing it is the professionally useful response."]}, {"q": "Which of the following statements about all commercial AI available today is correct?", "opts": ["It is narrow AI, designed for specific tasks and limited outside its domain", "It is general AI, because modern models handle many different tasks.", "It is rule-based and contains no machine learning.", "It is a mixture, with several general AI systems in commercial use."], "ans": 0, "exp": "Syllabus 1.3 states explicitly that all commercial AI today is narrow. Handling multiple tasks within a broad domain does not make a system general.", "why": ["Correct. All commercial AI today is narrow, per the syllabus.", "Wrong. There are no commercially deployed general AI systems. AGI remains a research goal.", "Wrong. Handling many tasks is not the same as being able to perform any intellectual task a human can.", "Wrong. Modern commercial AI is predominantly learning-based, not purely rule-based."]}, {"q": "Which statement best describes what an AI model is at a conceptual level?", "opts": ["A copy of the data it was trained on, held in compressed form. This understates how early the duty begins in the workflow.", "A set of learned values, known as parameters, produced by training on data", "A database of stored answers that the model looks up. This attributes to the system a capacity it cannot hold.", "A set of instructions written by a programmer that the model follows."], "ans": 1, "exp": "Syllabus 2.1 describes a model as a set of learned values (parameters), not a database of stored answers. This distinction explains why a model can be fluent yet wrong, and why it cannot cite a stored record.", "why": ["Wrong. Programmed instructions describe rule-based software, which is a different approach.", "Correct. Learned parameters, not stored answers, is the syllabus description.", "Wrong. The model does not retain a compressed copy of its training data. It holds learned values derived from it.", "Wrong. A database retrieves stored records. A model derives outputs from learned values."]}, {"q": "What is the difference between training and inference?", "opts": ["Training is the process of learning the model from data; inference is using the trained model to produce an output", "Training produces the interface; inference produces the parameters. This reverses the relationship between the two ideas being compared.", "Training and inference are two names for the same process. This substitutes a superficial check for verification at the original source.", "Training happens on the user's device; inference happens in the cloud. This mistakes a symptom of the problem for its cause."], "ans": 0, "exp": "Syllabus 2.1 requires the distinction between training (learning the model) and inference (using it to produce an output). Parameters are adjusted during training and are effectively fixed during inference.", "why": ["Correct. Learning versus using is the distinction the syllabus requires.", "Wrong. This inverts the two. Parameters are produced by training, not inference.", "Wrong. They are distinct stages with different purposes and different computational behaviour.", "Wrong. Location is not the distinction. Inference commonly runs in the cloud as well."]}, {"q": "At Foundation level, what are parameters?", "opts": ["The maximum length of a prompt the model accepts.", "The settings a user chooses in an application menu.", "The adjustable values that a model learns during training", "The list of tasks the model is permitted to perform."], "ans": 2, "exp": "Syllabus 2.1 defines parameters at Foundation level as the adjustable values learned during training.", "why": ["Wrong. User-facing settings are application controls, not model parameters.", "Wrong. Prompt length relates to the context window, which is a different concept.", "Correct. Learned, adjustable values is the Foundation-level definition.", "Wrong. Permissions are a policy matter, not a property of the model's parameters."]}, {"q": "What role do datasets play in producing a model?", "opts": ["They determine the model's maximum output length. This applies a general principle without regard to the stakes involved.", "They set the price of using the model. This understates how early the duty begins in the workflow.", "They store the model's answers for later retrieval. This applies a general principle without regard to the stakes involved.", "They supply the material from which the model learns its patterns during training"], "ans": 3, "exp": "Syllabus 2.1 identifies the role of datasets as the material the model learns from. This is why the qualities and limitations of training data carry through into model behaviour, including bias (8.1).", "why": ["Wrong. Output length is a configuration limit, not a property of the dataset.", "Wrong. This describes a database, which the syllabus explicitly distinguishes from a model.", "Wrong. Pricing is commercial and unrelated to training data.", "Correct. Datasets are the material from which patterns are learned."]}, {"q": "How does a language model generate text?", "opts": ["By applying grammatical rules written by its developers. This understates how early the duty begins in the workflow.", "By copying sentences it has seen verbatim into a new arrangement.", "By retrieving the most relevant passage from a stored library of documents. This mistakes a symptom of the problem for its cause.", "By predicting likely next tokens based on the prompt and the text produced so far"], "ans": 3, "exp": "Syllabus 2.2 describes next-token prediction: producing likely continuations from the prompt and the text so far.", "why": ["Wrong. Written grammatical rules describe rule-based systems, not learned language models.", "Wrong. Retrieval from a document library describes RAG, not the base generation mechanism.", "Wrong. Verbatim copying is not how generation works and would not explain novel phrasing.", "Correct. Next-token prediction from the prompt and prior output is the syllabus explanation."]}, {"q": "Why does fluent AI output not guarantee accurate output?", "opts": ["Because the model has no training data to draw on. This substitutes a superficial check for verification at the original source.", "Because the model optimises for plausible continuations, and there is no built-in fact-checker", "Because fluency and accuracy are unrelated in principle but always coincide in practice. This mistakes a symptom of the problem for its cause.", "Because the model deliberately mixes true and false statements. This understates how early the duty begins in the workflow."], "ans": 1, "exp": "Syllabus 2.2 states that output is generated, not retrieved, and that fluency does not guarantee accuracy, because the mechanism has no built-in fact-checker.", "why": ["Wrong. The model does not intend to deceive. It has no intent and no knowledge of truth in the relevant sense.", "Correct. Plausibility is optimised; accuracy is not checked. The absence of a fact-checker is the syllabus point.", "Wrong. The claim that they always coincide is false and contradicts the syllabus.", "Wrong. The model has extensive training data. The issue is that it does not verify against it at generation time."]}, {"q": "Which statement best characterises the mechanism behind language models?", "opts": ["It is a reasoning engine that verifies each claim before producing it. This treats an optional good practice as a mandatory control.", "It is more sophisticated than simple autocomplete, but it has no built-in fact-checker", "It is exactly simple autocomplete and nothing more. This overstates the requirement beyond the professional-literacy standard.", "It is a search engine that returns the most popular answer. This attributes to the system a capacity it cannot hold."], "ans": 1, "exp": "Syllabus 2.2 makes this precise point: the mechanism is more sophisticated than simple autocomplete, yet it has no built-in fact-checker. Over-simplifying or over-claiming both mislead.", "why": ["Wrong. Understates it. Characterising it as simple autocomplete hides the scale and capability of the mechanism.", "Correct. Sophisticated continuation without verification is the syllabus formulation.", "Wrong. Overstates it. Verification is precisely what the mechanism lacks.", "Wrong. Popularity of an answer is not the basis for generation."]}, {"q": "What is a token?", "opts": ["A security credential used to access an AI service.", "The basic unit of text that a model reads and writes", "A measure of the model's accuracy. This attributes to the system a capacity it cannot hold.", "A single word, always separated by spaces."], "ans": 1, "exp": "Syllabus 2.3 defines tokens as the basic unit of text a model reads and writes. Tokens are not identical to words, which matters for estimating how much text fits in the context window.", "why": ["Wrong. This is an unrelated meaning of the word 'token' in the security domain.", "Correct. The basic unit of text is the syllabus definition.", "Wrong. Tokens often correspond to parts of words and do not map cleanly onto whitespace-separated words.", "Wrong. Tokens are units of text, not measures of accuracy."]}, {"q": "What is the context window best described as?", "opts": ["A settings panel where users configure the model. This mistakes a symptom of the problem for its cause.", "The total size of the model's training data. This describes a related concept from a different area of the syllabus.", "The maximum length of a single sentence the model can generate. This treats an optional good practice as a mandatory control.", "The model's short-term working memory, holding the text it can currently take into account"], "ans": 3, "exp": "Syllabus 2.3 describes the context window as short-term working memory.", "why": ["Wrong. Training data is a separate and much larger body of material.", "Wrong. The context window is a technical limit, not a user interface element.", "Wrong. It governs the total text in play, not one sentence.", "Correct. Short-term working memory is the syllabus description."]}, {"q": "What happens when a conversation exceeds the context window?", "opts": ["Earlier detail may effectively be forgotten, and large pastes can crowd out the instructions that matter", "The model becomes more accurate because it has more information. This describes a related concept from a different area of the syllabus.", "The conversation is permanently deleted without warning. This applies a general principle without regard to the stakes involved.", "The model automatically retrains on the new conversation. This relies on the tool vendor to carry a duty that stays with the user."], "ans": 0, "exp": "Syllabus 2.3 identifies the effects of exceeding the window: earlier detail is forgotten and large pastes crowd out instructions.", "why": ["Correct. Loss of earlier detail and displacement of instructions are the named effects.", "Wrong. More input beyond the limit does not improve accuracy. It displaces what was there.", "Wrong. The practical effect is that content falls out of scope, not necessarily permanent deletion.", "Wrong. The model does not learn or retrain during inference."]}, {"q": "Which of the following is a practical technique for working within the context window?", "opts": ["Keeping prompts concise, placing key instructions first or last, and chunking large material", "Repeating the same instructions many times throughout the prompt. This overstates the requirement beyond the professional-literacy standard.", "Pasting the entire document collection to be certain nothing is missed.", "Using the longest possible prompts to give the model more to work with. This assumes the model holds intent it does not have."], "ans": 0, "exp": "Syllabus 2.3 lists practical techniques: concise prompts, key instructions placed first or last, and chunking.", "why": ["Correct. These three techniques are named in the syllabus.", "Wrong. Pasting everything risks exceeding the window and losing the very detail that mattered.", "Wrong. Repetition consumes the window and displaces other content without improving adherence.", "Wrong. Longer prompts are the problem, not the solution, once the window is a constraint."]}, {"q": "Why does placing key instructions at the beginning or end of a prompt help?", "opts": ["Because the model only reads the first and last lines. This assumes the model holds intent it does not have.", "Because the model sorts prompts by length before processing them. This attributes to the system a capacity it cannot hold.", "Because instructions outside those positions are automatically rejected. This treats an optional good practice as a mandatory control.", "Because attention is strongest at the start and end of the input, so the middle is more easily overlooked"], "ans": 3, "exp": "Syllabus 2.3 identifies this as a practical technique for working within the window, and Domain 6 describes the underlying 'lost in the middle' effect where the model over-indexes the start and end of its input.", "why": ["Wrong. The model does read the whole input. The issue is the strength of attention, not outright omission.", "Wrong. Prompt ordering is not affected by any sorting behaviour.", "Wrong. Instructions in the middle are not rejected. They are simply more likely to be under-weighted.", "Correct. The start and end of the input receive the strongest attention, so important instructions are safest there."]}, {"q": "What is a knowledge cut-off?", "opts": ["The limit on how long output may be. This substitutes a superficial check for verification at the original source.", "The point after which a base model has no knowledge, because its training data ended at that date", "The point at which a model is retired from service. This assumes the model holds intent it does not have.", "The maximum number of questions a user may ask in one session. This reverses the relationship between the two ideas being compared."], "ans": 1, "exp": "Syllabus 2.4 defines the knowledge cut-off as the point after which a base model has no knowledge, because its training data ended at that date.", "why": ["Wrong. Session question limits are a service policy, not a knowledge cut-off.", "Correct. The end date of the training data is the knowledge cut-off.", "Wrong. Retirement is a lifecycle decision, unrelated to the training data date.", "Wrong. Output length relates to generation limits, not to knowledge."]}, {"q": "An application provides live web search alongside a model. How should this be understood?", "opts": ["The application adds current information, but the base model itself remains frozen at its training date", "The base model has been updated and now has current knowledge. This assumes the model holds intent it does not have.", "The model retrains itself each time search is used. This overstates the requirement beyond the professional-literacy standard.", "Live search removes any need to verify information. This assumes the model holds intent it does not have."], "ans": 0, "exp": "Syllabus 2.4 states that some applications add live search, but the base model itself remains frozen. This is an important distinction between the model and the application built around it (also syllabus 2.5 and 3.5).", "why": ["Correct. Search extends the application, not the model's own knowledge.", "Wrong. The model's parameters are unchanged. Current information comes from retrieval, not from the model.", "Wrong. Retrieved content still requires verification, and RAG reduces rather than removes error (3.3).", "Wrong. The model does not learn during inference."]}, {"q": "Why can the same prompt produce different answers on separate occasions?", "opts": ["Because the interface rewrites the prompt each time. This reverses the relationship between the two ideas being compared.", "Because the model's training data changes between requests. This reverses the relationship between the two ideas being compared.", "Because the model samples from a range of plausible continuations, influenced by settings such as temperature", "Because the model is malfunctioning. This applies a general principle without regard to the stakes involved."], "ans": 2, "exp": "Syllabus 2.5 explains that identical prompts can produce different answers because of sampling and settings such as temperature. This variability is why verification and review are essential.", "why": ["Wrong. Inconsistent output stems from the generation mechanism, not from prompt rewriting.", "Wrong. Variability is a property of the design, not a fault.", "Correct. Sampling behaviour, including the temperature setting, is the syllabus explanation.", "Wrong. Training data is fixed after training. It does not change between requests."]}, {"q": "Which distinction does syllabus 2.5 require candidates to make?", "opts": ["The distinction between open-source and proprietary licences.", "The distinction between a model and the application built around it", "The distinction between text and image outputs.", "The distinction between hardware and software."], "ans": 1, "exp": "Syllabus 2.5 requires the distinction between a model and the application built around it. Many features users attribute to the model, such as live search or saved context, are properties of the application layer.", "why": ["Wrong. This is a general computing distinction, not the one the syllabus specifies here.", "Correct. Model versus application is the required distinction.", "Wrong. Output modality is a separate concern, addressed under multimodal AI in 3.2.", "Wrong. Licensing is a commercial and legal matter, addressed elsewhere if at all."]}, {"q": "What are embeddings, at the awareness level required by the syllabus?", "opts": ["Encrypted versions of user prompts. This describes a related concept from a different area of the syllabus.", "Lists of keywords extracted from a text. This relies on the tool vendor to carry a duty that stays with the user.", "Numerical representations of meaning, in which related items sit close together", "Compressed copies of the original documents. This mistakes a symptom of the problem for its cause."], "ans": 2, "exp": "Syllabus 2.5 tests embeddings at awareness level as the representation of meaning as numbers, so that related items sit close together. This is what makes semantic search and retrieval possible.", "why": ["Wrong. Encryption protects data in transit or at rest. It is unrelated to embeddings.", "Wrong. Embeddings represent meaning rather than storing the source document.", "Correct. Meaning represented numerically, with related items close together, is the awareness-level description.", "Wrong. Keyword lists are a different and older technique, not embeddings."]}, {"q": "What does 'generative' mean in relation to AI?", "opts": ["The system produces new content rather than classifying or labelling existing content", "The system generates explanations of its own reasoning on request. This assumes the model holds intent it does not have.", "The system produces content that has never existed anywhere in any form, from no source at all", "The system generates revenue by automating tasks. This assumes the model holds intent it does not have."], "ans": 0, "exp": "Syllabus 3.1 defines generative as producing new content, as distinct from classifying or labelling. The output is generated from learned patterns rather than selected from a fixed list of labels.", "why": ["Correct. Producing new content, contrasted with classification, is the syllabus definition.", "Wrong. Producing explanations is one possible output, not the definition of generative AI.", "Wrong. This is a commercial meaning of 'generate' and is unrelated to the technical sense.", "Wrong. Overstated. Generated content derives from patterns in training data. It is new in composition, not conjured from nothing."]}, {"q": "Which of the following is NOT one of the major generative AI output types identified in the syllabus?", "opts": ["Video and code.", "Financial advice", "Audio and voice.", "Text."], "ans": 1, "exp": "Syllabus 3.1 lists the major output types as text, image, audio/voice, video and code. 'Financial advice' is a professional service and a regulated activity, not an output type.", "why": ["Wrong. Text is one of the listed output types.", "Correct. Financial advice is not an output type. It is a regulated professional activity, which is a useful reminder that generated content can touch regulated territory.", "Wrong. Video and code are both listed output types.", "Wrong. Audio and voice is one of the listed output types."]}, {"q": "What is a foundation model?", "opts": ["A model that has been formally certified as the basis for a product. This applies a general principle without regard to the stakes involved.", "The first model a company ever trains, on which later models are built.", "A small, specialised model used only for a single narrow task. This treats an optional good practice as a mandatory control.", "A large, general-purpose model that can be adapted to many different tasks, at awareness level"], "ans": 3, "exp": "Syllabus 3.2 tests foundation models at awareness level as large, general-purpose models adapted to many tasks.", "why": ["Wrong. Certification is a regulatory concept and is not part of the definition.", "Wrong. This is chronological, not definitional. The term describes scale and generality, not development order.", "Wrong. This describes the opposite of a foundation model, which is large and general rather than small and specialised.", "Correct. Large, general-purpose and adaptable to many tasks is the syllabus description."]}, {"q": "Which of the following best describes multimodal AI?", "opts": ["A system that produces several alternative answers to one question. This understates how early the duty begins in the workflow.", "A system deployed across many different departments. This describes a related concept from a different area of the syllabus.", "A system that can be used by many people at the same time. This assumes the model holds intent it does not have.", "A system that handles more than one type of input or output, such as text and images together"], "ans": 3, "exp": "Syllabus 3.2 tests multimodal AI at awareness level as handling more than one type of input or output.", "why": ["Wrong. Concurrent users is a scale question about serving, not about modalities.", "Wrong. Departmental spread is an organisational question, not a technical one about modalities.", "Wrong. Offering alternatives is a sampling behaviour, not multimodality.", "Correct. Multiple modalities of input or output is the syllabus definition."]}, {"q": "What problem does retrieval-augmented generation (RAG) primarily address?", "opts": ["The speed at which a model produces its output. This understates how early the duty begins in the workflow.", "The grounding problem: the model answers from its own frozen parameters with no reference to current or specific source material", "The need to disclose when AI has been used. This assumes the model holds intent it does not have.", "The cost of training a model from scratch. This understates how early the duty begins in the workflow."], "ans": 1, "exp": "Syllabus 3.3 identifies the grounding problem and describes RAG as retrieving relevant sources and then generating an answer grounded in them.", "why": ["Wrong. Training cost is a separate concern. RAG operates at inference time and does not retrain the model.", "Correct. RAG retrieves sources so the answer can be grounded in them rather than drawn only from the model's own parameters.", "Wrong. Response speed is not the problem RAG is designed to solve, and retrieval can add latency.", "Wrong. Disclosure is a governance requirement, addressed in Domain 8, not the purpose of RAG."]}, {"q": "Which statement about RAG is most accurate?", "opts": ["RAG makes a model's knowledge permanently current. This mistakes a symptom of the problem for its cause.", "RAG removes the need for the user to verify anything. This assumes the model holds intent it does not have.", "RAG improves freshness and grounding but reduces rather than removes error", "RAG eliminates hallucination because answers come from retrieved sources."], "ans": 2, "exp": "Syllabus 3.3 states directly that RAG improves freshness and grounding but reduces rather than removes error. This distinction is tested, and it is the reason verification remains necessary.", "why": ["Wrong. Verification remains essential. RAG changes how answers are produced, not the user's accountability for them.", "Wrong. Knowledge is current only insofar as the retrieved sources are current. A stale or partial index still yields weak grounding.", "Correct. This is the exact syllabus formulation, and it is why verification cannot be dropped.", "Wrong. This is the tempting error. Retrieval improves grounding but does not eliminate error. Tools marketed as hallucination-free have been shown to fail."]}, {"q": "What distinguishes an AI agent from a single-turn assistant?", "opts": ["An agent is a system with a larger model behind it. This confuses a technical property of the system with a professional obligation.", "An agent is any assistant that remembers the conversation. This relies on the tool vendor to carry a duty that stays with the user.", "An agent is an assistant that has been approved for enterprise use. This assumes the model holds intent it does not have.", "An agent pursues a goal across multiple steps, using tools, rather than responding once to one prompt"], "ans": 3, "exp": "Syllabus 3.4 defines agents as multi-step, tool-using systems that pursue a goal, distinct from a single-turn assistant.", "why": ["Wrong. Conversation memory is a feature of a session, not what makes a system agentic.", "Wrong. Approval is an organisational status and has nothing to do with the definition.", "Wrong. Model size is not the distinction. A larger model in a single-turn setting is still single-turn.", "Correct. Multi-step goal pursuit with tool use is the distinguishing characteristic."]}, {"q": "Why does the syllabus state that agents taking actions require greater human oversight?", "opts": ["Because agents are inherently less accurate than single-turn assistants. This substitutes a superficial check for verification at the original source.", "Because an agent can take consequential actions across several steps, so errors can compound and effects can be harder to reverse", "Because agents are not permitted in professional environments. This attributes to the system a capacity it cannot hold.", "Because agents cannot use tools safely under any circumstances. This attributes to the system a capacity it cannot hold."], "ans": 1, "exp": "Syllabus 3.4 marks this point at awareness level. The concern is that multi-step action-taking amplifies both the reach of errors and the difficulty of reversing them, so oversight must be stronger.", "why": ["Wrong. Tool use is the point of an agent. The requirement is oversight, not prohibition.", "Correct. Compounding errors and harder reversal are why oversight needs to be greater.", "Wrong. Agents are used professionally. The syllabus requires greater oversight, not exclusion.", "Wrong. Accuracy is not the essential difference. The scope of action is."]}, {"q": "Which correctly distinguishes a model, an application and an AI-enabled service?", "opts": ["The service is the model, and the application is the hardware it runs on. This overstates the requirement beyond the professional-literacy standard.", "The model is the engine, the application is the interface built around it, and the service is the offering delivered to users", "The model is the interface, the application is the engine, and the service is the training data. This relies on the tool vendor to carry a duty that stays with the user.", "All three terms refer to the same thing and are interchangeable. This treats an optional good practice as a mandatory control."], "ans": 1, "exp": "Syllabus 3.5 requires this distinction: the model is the engine, the application is the interface, and the service is what is delivered. The distinction matters because obligations and risks attach to different layers.", "why": ["Wrong. This misassigns every layer and invents a role for training data that the syllabus does not describe.", "Correct. Engine, interface and delivered offering is the syllabus distinction.", "Wrong. This conflates the model with the service and misdescribes the application as hardware.", "Wrong. The syllabus specifically asks candidates to distinguish them, so they are not interchangeable."]}, {"q": "An organisation wants maximum control over data residency and model behaviour. Which option and trade-off does the syllabus describe?", "opts": ["Hosted services always give more control over data residency. This understates how early the duty begins in the workflow.", "Data residency is unrelated to the choice between self-hosted and hosted services. This attributes to the system a capacity it cannot hold.", "Open-weight or self-hosted deployment gives more control but requires more setup and maintenance", "Open-weight deployment gives more control and requires no additional effort. This assumes the model holds intent it does not have."], "ans": 2, "exp": "Syllabus 3.5 marks this at awareness level: open-weight and self-hosted options trade control and data residency against setup and maintenance effort.", "why": ["Wrong. Self-hosting requires infrastructure, updates and expertise. The effort is real.", "Wrong. Hosted services generally give less control over where data resides and how it is handled.", "Correct. Control and residency improve, but setup and maintenance effort rises.", "Wrong. Data residency is a central consideration in this choice, which is why the syllabus names it."]}, {"q": "When selecting an appropriate category of AI tool, which set of factors does syllabus 3.6 identify?", "opts": ["Capability, cost, data sensitivity and organisational approval", "Model parameter count, release date and benchmark score.", "Speed of output, number of features and subscription tier.", "Brand recognition, market share and user reviews."], "ans": 0, "exp": "Syllabus 3.6 identifies capability, cost, data sensitivity and organisational approval as the factors for choosing a category of tool.", "why": ["Correct. These are the four factors named in the syllabus.", "Wrong. Technical benchmarks are not the Foundation-level basis for tool selection and are not vendor-neutral in practice.", "Wrong. Brand and popularity are not the syllabus criteria and can conflict with the exam's vendor-neutral stance.", "Wrong. These are feature comparisons rather than the syllabus's professional selection criteria."]}, {"q": "Why does the syllabus emphasise choosing a 'category' of tool rather than a specific product?", "opts": ["Because specific products are too expensive for most organisations. This reverses the relationship between the two ideas being compared.", "Because only categories of tool can be approved by an organisation. This confuses a technical property of the system with a professional obligation.", "Because product names change too quickly to be memorised. This attributes to the system a capacity it cannot hold.", "Because the certification is vendor-neutral, so the testable skill is recognising what kind of tool is appropriate"], "ans": 3, "exp": "The syllabus excludes knowledge of any specific commercial product. The transferable skill is selecting a category based on capability, cost, data sensitivity and approval.", "why": ["Wrong. Rate of change is a supporting reason at best. The stated reason is vendor neutrality.", "Wrong. Cost is one selection factor, but it is not the reason for the category-level framing.", "Wrong. Organisations approve specific products. The syllabus distinction is about what is tested, not what is procured.", "Correct. Vendor neutrality is a stated property of the certification, so the skill is category selection."]}, {"q": "A team needs to summarise a very large set of current internal documents and has an approved vector-store pipeline available. Which approach is most appropriate?", "opts": ["Retrieval-augmented generation, so answers are grounded in the organisation's own current sources", "Fine-tuning the model on the documents before every query. This substitutes a superficial check for verification at the original source.", "Asking the base model from memory, because it has seen similar documents in training. This mistakes a symptom of the problem for its cause.", "Pasting all documents into a single prompt regardless of length. This confuses a technical property of the system with a professional obligation."], "ans": 0, "exp": "RAG is designed for exactly this case: retrieving relevant sources from a corpus and grounding the answer in them. The base model has no access to internal documents and a training cut-off besides.", "why": ["Correct. RAG grounds answers in the organisation's own current sources, which is its purpose.", "Wrong. Fine-tuning before every query is not a practical or proportionate response, and RAG addresses the need directly.", "Wrong. The base model has no access to internal documents and cannot answer from them reliably.", "Wrong. Exceeding the context window causes earlier detail to be lost, which the syllabus identifies as a specific failure."]}, {"q": "Which statement best captures the relationship between generative AI and classification systems?", "opts": ["Generative systems produce new content, whereas classification systems assign existing content to categories or labels", "Generative systems assign labels, whereas classification systems produce new content. This relies on the tool vendor to carry a duty that stays with the user.", "Classification systems are a more advanced form of generative AI. This overstates the requirement beyond the professional-literacy standard.", "Both terms describe the same operation performed at different speeds. This assumes the model holds intent it does not have."], "ans": 0, "exp": "Syllabus 3.1 contrasts generative AI, which produces new content, with classifying or labelling, which assigns existing content to categories.", "why": ["Correct. Producing new content versus assigning labels is the distinction the syllabus draws.", "Wrong. They perform fundamentally different operations, not the same one faster.", "Wrong. Classification is not an advanced form of generation. They are different tasks.", "Wrong. This reverses the two definitions."]}, {"q": "A prompt is built from four components. Which set names all four?", "opts": ["Role, model, temperature and token budget.", "Task, context, format and constraints", "Subject, tone, length and language register.", "Question, example, answer and final review."], "ans": 1, "exp": "Syllabus 4.1 defines exactly four components: task (what you want done), context (background the model needs), format (how the output should be shaped) and constraints (the limits it must respect). These four are the backbone of the syllabus prompting model.", "why": ["These are real prompt qualities, but not the four components the syllabus defines; they sit inside format and constraints.", "Correct. Task, context, format and constraints is the syllabus 4.1 set, and the checklist to run every prompt against.", "This describes a question-and-answer cycle rather than the four-component anatomy of a single prompt.", "This mixes concepts: role is syllabus 4.2, while model and temperature are Domain 2 settings rather than prompt components."]}, {"q": "Which describes few-shot prompting?", "opts": ["Breaking a long task into many separate chat sessions over time.", "Asking the same question several times and keeping the best reply.", "Supplying one or more worked examples to calibrate style and format", "Giving the model several attempts so it can correct its own work."], "ans": 2, "exp": "Syllabus 4.3: few-shot prompting uses one or more examples to calibrate style, format and tone. Zero-shot gives no examples; few-shot gives some. The examples teach the pattern you want.", "why": ["Self-correction attempts are iterative refinement at syllabus 4.5, a different technique entirely.", "Repeating a question is not few-shot prompting; that is re-running a prompt hoping for variation.", "Correct. Examples demonstrate the pattern, which is far more reliable than describing it in the abstract.", "Splitting work across sessions relates to the context window at syllabus 2.3, not to few-shot prompting."]}, {"q": "What is task decomposition in prompting?", "opts": ["Asking the model to answer faster by generating fewer output tokens.", "Removing constraints so that the model has more freedom to respond.", "Shortening the prompt so that it comfortably fits the context window.", "Breaking a complex task into ordered steps and asking for them in sequence"], "ans": 3, "exp": "Syllabus 4.4: decompose a complex task into ordered steps, and ask for a plan or reasoning where useful. Decomposition makes the work tractable and the reasoning inspectable.", "why": ["Trimming a prompt is a context-window technique at syllabus 2.3 rather than decomposition.", "Token efficiency is a cost and context concern and has nothing to do with decomposing a task.", "Removing constraints loosens the prompt, whereas decomposition adds structure rather than removing it.", "Correct. Ordered steps turn one large ambiguous request into a sequence of checkable ones."]}, {"q": "Your first output is broadly right but too formal. What is the correct next move?", "opts": ["Accept the output as it stands, since the actual content is right.", "Start a brand-new chat and rewrite the prompt from the beginning.", "Give a specific corrective follow-up naming the change you want", "Add further constraints to a fresh copy of the original prompt."], "ans": 2, "exp": "Syllabus 4.5 treats the first output as a draft and refinement as a conversation that builds on previous responses. A specific correction such as 'make it warmer and less formal, but keep the structure' is the efficient move.", "why": ["Accepting the wrong tone means the output goes out unfit for purpose when one line would fix it.", "Rewriting in a fresh chat loses the draft and may add constraints that you do not actually need.", "Correct. A targeted follow-up preserves what worked and fixes only the part that did not.", "Restarting throws away the working draft along with the context that produced it."]}, {"q": "Which is a 'one-and-done' prompting fault?", "opts": ["Naming the intended audience clearly within the prompt itself.", "Providing a single worked example of the format that you want.", "Accepting the very first output without any refinement at all", "Sending a large number of follow-up corrections to the model."], "ans": 2, "exp": "Syllabus 4.6 lists one-and-done prompts among the common faults. Treating the initial response as final wastes the model's ability to improve through correction, so iterative refinement at 4.5 is exactly what gets skipped.", "why": ["Refining thoroughly is the recommended practice rather than a fault, and 4.5 encourages correction.", "Supplying an example is good practice under few-shot prompting at syllabus 4.3.", "Correct. One-and-done means treating a draft as a finished product and never refining it.", "Naming the audience is good practice under role and audience at syllabus 4.2."]}, {"q": "Which prompt is 'leading'?", "opts": ["What are the main arguments for and against remote working?.", "Summarise the available evidence on remote working productivity.", "List the main findings on remote working in the published literature.", "Why is remote work clearly better for productivity in most teams?"], "ans": 3, "exp": "A leading prompt embeds the conclusion in the question, so the model is nudged to justify a premise rather than examine it. The phrase 'clearly better' presumes the answer, and syllabus 4.6 lists leading prompts as a fault.", "why": ["Summarising the evidence is neutral about what that evidence actually shows on balance.", "Listing findings asks what the literature says rather than what it ideally ought to say.", "This asks for both sides of the argument and so does not presuppose any particular answer.", "Correct. 'Clearly better' asserts the conclusion, so the model is invited to agree rather than assess."]}, {"q": "What is the difference between zero-shot and few-shot prompting?", "opts": ["Zero-shot needs no prompt, while few-shot needs a system-level message.", "Zero-shot uses no role, while few-shot always assigns a specific role.", "Zero-shot gives no examples, while few-shot gives one or more examples", "Zero-shot works only for short tasks, while few-shot suits only long ones."], "ans": 2, "exp": "Syllabus 4.3 draws this distinction precisely: zero-shot prompting supplies no examples, and few-shot prompting supplies one or more to calibrate style, format and tone. Role and audience at 4.2 are separate and independent techniques.", "why": ["Shot count is unrelated to task length, since short tasks can use examples and long ones may not.", "Zero-shot still requires a prompt, which is the whole point; both are prompts that differ in examples.", "Correct. The distinguishing feature is purely the presence or absence of worked examples.", "Role assignment is independent of shot count, so you can use few-shot without any role at all."]}, {"q": "Which is the strongest reason to name your audience in a prompt?", "opts": ["It prevents the model from hallucinating details it cannot know.", "It makes the model more factually accurate in what it produces.", "It sets the appropriate register, depth and assumed prior knowledge", "It automatically shortens the output to a concise useful length."], "ans": 2, "exp": "Syllabus 4.2: naming the audience shapes the register and depth of the output. Telling the model that the reader is, say, a finance committee means it explains less background and chooses different vocabulary, but it does not change factual reliability.", "why": ["No prompt technique eliminates hallucination, as syllabus 6.1 makes entirely clear.", "Audience does not control length, which is a format or constraint instruction you must state separately.", "Correct. Audience information calibrates vocabulary, assumed background and the level of detail given.", "Audience framing affects style rather than factual accuracy, and hallucination is a Domain 6 concern."]}, {"q": "How should you treat the first response to a complex prompt?", "opts": ["As the final answer provided that it reads fluently and well.", "As a reliable source of facts that can be quoted directly.", "As a draft to be reviewed and refined through follow-up turns", "As fundamentally unreliable and worth discarding immediately."], "ans": 2, "exp": "Syllabus 4.5 frames checking output as drafting: treat the first result as a draft and refine through specific, corrective follow-ups. Fluency is not a quality signal, and syllabus 2.2 warns that fluent text is not necessarily accurate.", "why": ["Fluency is a poor quality signal, so a polished draft can still contain errors you must catch.", "Discarding a broadly correct draft wastes useful work that one follow-up could have refined.", "Correct. Draft treatment is the syllabus own framing and it keeps refinement conversational.", "Nothing should be quoted directly without verification, as Domains 5 and 6 make plain."]}, {"q": "Which best explains why prompting should be treated as a conversation?", "opts": ["Longer conversations always cost substantially less than shorter ones.", "The model permanently remembers your work between separate sessions.", "The model needs a few exchanges to warm up before it performs well.", "Each response gives information you use to write a better next instruction"], "ans": 3, "exp": "Syllabus 4.5: understand prompting as a conversation that builds on previous responses. Each output reveals what worked, and your next instruction can build on it, so the conversation is a feedback loop rather than a nicety.", "why": ["There is no warm-up effect, since a model does not need prior turns to become ready to respond.", "Conversation length relates to context window use at syllabus 2.3 and is not inherently cheaper.", "Whether work persists between sessions depends on the application and is not the reason prompting is conversational.", "Correct. The conversation is a feedback loop in which each turn informs the next instruction."]}, {"q": "Which single change most reliably fixes a vague prompt?", "opts": ["Add the instruction to be accurate and thorough in the answer.", "Repeat the same request twice within the body of the prompt.", "Make the prompt much longer and more detailed in a general way.", "State the task, audience and required output format explicitly"], "ans": 3, "exp": "Syllabus 4.1 gives the remedy for vagueness: supply the missing components, which are a clear task, the relevant context, an explicit format and any real constraints. Length is not the answer, since specification is what matters.", "why": ["Longer is not clearer, so padding a vague prompt leaves it vague and consumes context window space.", "Repeating a request adds noise and can confuse the instruction rather than resolve the vagueness.", "Being accurate and thorough is an aspiration the model cannot act on and does not improve accuracy.", "Correct. Vagueness is a specification gap, and the four components close it directly."]}, {"q": "A prompt says: 'Don't be too verbose, but also be comprehensive, and keep it brief but make sure nothing important is left out.' What is the fault?", "opts": ["The constraints contradict each other so no output can satisfy them", "It provides neither a role nor an audience for the requested output.", "It fails to specify any useful output format for the finished answer.", "The prompt is far too short to convey what the task actually is."], "ans": 0, "exp": "Syllabus 4.6 covers faults including overloaded and unclear constraint sets. Here comprehensive and brief-with-nothing-left-out pull in opposite directions, so the model must silently pick one and your results become unpredictable.", "why": ["Correct. Mutually exclusive constraints leave the model to choose arbitrarily, which is unpredictable.", "Missing role and audience are real gaps but secondary to the contradictory requirements here.", "Length of the prompt is not the problem, since the conflict between its requirements is what matters.", "An unstated format is a genuine gap, yet the dominant defect is the contradictory constraints."]}, {"q": "What is the practical benefit of requesting a structured format like a table?", "opts": ["It makes the resulting response shorter than an unstructured one.", "It makes the model considerably more knowledgeable about the topic.", "It makes omissions and errors easier to spot and compare", "It removes any need for you to verify the content afterwards."], "ans": 2, "exp": "Syllabus 4.4 recommends structured output such as tables and headed sections. The real payoff is reviewability, since a fixed set of columns shows immediately what is missing or inconsistent, which speeds up your verification step.", "why": ["A table may be longer or shorter depending on content, so brevity is not the point of structuring.", "Structured output still requires verification, because format is not in itself a correctness guarantee.", "Correct. Structure turns review into a checklist, exposing gaps and inconsistencies very quickly.", "Format changes presentation rather than knowledge, so the model is no more expert than before."]}, {"q": "Which best describes the relationship between prompting and hallucination?", "opts": ["Hallucination is caused solely by writing excessively long prompts.", "Better prompting reduces but cannot eliminate hallucination", "Better prompting eliminates hallucination completely and reliably.", "Prompting has no measurable effect on hallucination at all."], "ans": 1, "exp": "Syllabus 6.4 lists grounding prompts in real content as one risk-reduction measure, while 6.1 states hallucination is inherent to how language models work. Prompting is therefore a genuine but partial mitigation rather than a cure.", "why": ["No prompt technique removes hallucination, which the syllabus describes as inherent and not a removable bug.", "Correct. Grounding and clarity help materially, but the mechanism still permits confident errors.", "Prompt length is not the cause, since hallucination arises from how the model generates text.", "Prompt quality does influence error rates, so claiming zero effect understates the value of better prompting."]}, {"q": "Your prompt reads: 'Summarise the attached 40-page contract in 200 words.' Which component is the 200-word limit?", "opts": ["Task.", "Role.", "Constraint", "Context."], "ans": 2, "exp": "Syllabus 4.1 treats constraints as the limits the output must respect. A word limit is a hard boundary, which is exactly a constraint. The task is to summarise, and the context is the attached contract.", "why": ["The task is the action to summarise, while the 200-word figure governs how that task is executed.", "Context is background information the model needs, and the contract supplies that rather than the word count.", "Correct. A word limit is a boundary on the output, which is the definition of a constraint.", "No role or persona is assigned anywhere in this particular prompt at all."]}, {"q": "What is the key risk of a prompt that is vague about the output format?", "opts": ["The model will simply refuse to provide any answer at all. This assumes the model holds intent it does not have.", "The model will hallucinate considerably more statistics overall.", "The answer will always come back far too long to be useful.", "Each run may return a different shape, making output hard to reuse"], "ans": 3, "exp": "Syllabus 4.1 treats format as one of the four required components. Without a format instruction the model chooses, and its choice varies between runs, which is why vague prompts produce output you cannot reliably reuse or compare.", "why": ["Models answer vague format requests happily; they simply pick a shape for themselves.", "Hallucination is driven by how models generate text rather than by format specification.", "Unformatted output can be short or long, since length is governed by explicit constraints.", "Correct. Unspecified format means inconsistent structure that resists reuse and comparison."]}, {"q": "When would zero-shot prompting actually be the better choice?", "opts": ["When the task is simple and a clear instruction is sufficient", "When the task is complex and very highly patterned throughout.", "When you need a specific house tone across all the output.", "When the output must follow a strict and detailed template."], "ans": 0, "exp": "Syllabus 4.3 asks when to use examples. The answer is when calibration is genuinely needed. For a simple, well-specified task, examples add context-window cost with little benefit, so a clear zero-shot instruction is more efficient.", "why": ["Correct. Simple clearly specified tasks need no calibration, so zero-shot is leaner and just as effective.", "A strict template is precisely where examples help most, which makes zero-shot the weaker choice.", "A specific house tone is easier to show than describe, so that is clearly a few-shot case.", "Complex patterned tasks benefit most from demonstration, which makes few-shot the better fit."]}, {"q": "Which statement about prompting is most consistent with the syllabus?", "opts": ["Prompting is the highest-leverage practical skill and is learnable through structure", "Prompting only matters for technical professionals in engineering roles. This mistakes a symptom of the problem for its cause.", "Prompting is a temporary skill that improving models will soon make obsolete.", "Prompting is largely an innate talent that only some people happen to possess."], "ans": 0, "exp": "Syllabus Domain 4 is introduced as the highest-leverage practical skill, and it is taught as a set of structured techniques including components, roles, examples, decomposition and refinement. That framing makes it learnable and improvable.", "why": ["Correct. The syllabus frames prompting as the highest-leverage practical skill and presents it as structured technique.", "Domain 4 sits in a vendor-neutral non-technical certification aimed at any industry and not only at specialists.", "The syllabus presents prompting as core professional competence developed and assessed across the course.", "The syllabus teaches prompting as technique with named components, which implies it is learnable rather than innate."]}, {"q": "Which is the best example of an unformatted prompt fault from syllabus 4.6?", "opts": ["Summarise the Q3 results in three bullets written for the board.", "List the three largest Q3 variances together with their figures.", "Tell me about our Q3 results", "Return a table with four columns covering our Q3 results."], "ans": 2, "exp": "Syllabus 4.6 lists unformatted prompts as a fault. The bare request states no output shape and no bound, so the model picks the structure, the length and the angle itself, which is exactly the unformatted fault.", "why": ["This specifies the format of a list and the content of three variances with figures.", "This specifies both the structure and the four columns, so it is well formatted.", "Correct. No format and no bound are given, so the output shape is left entirely to the model.", "This specifies the format of three bullets and names the audience as the board."]}, {"q": "A professional uses AI to produce a first draft of a report. What does the syllabus say should happen next?", "opts": ["The draft should be discarded, because AI output cannot be used professionally.", "The draft should be sent as produced, to save time.", "The draft should be published with a note that AI produced it and no further review", "The draft should be reviewed and personalised rather than used unchanged"], "ans": 3, "exp": "Syllabus 5.1 requires that AI output be reviewed and personalised rather than used unchanged. The draft is a starting point that the professional owns once they adopt it.", "why": ["Wrong. Using the draft unchanged is the behaviour the syllabus warns against.", "Wrong. Disclosure and review are separate obligations. A disclosure note does not substitute for reviewing the work.", "Wrong. Overcorrects. The syllabus supports drafting with AI, subject to review.", "Correct. Review and personalisation is the syllabus requirement for drafting with AI."]}, {"q": "Which of the following is an example of reshaping existing content with AI, as described in syllabus 5.1?", "opts": ["Requesting a list of sources the model is confident about.", "Shortening a long report and re-levelling it for a non-specialist audience", "Asking the model to confirm that a document is legally accurate.", "Asking the model to invent supporting statistics for a report."], "ans": 1, "exp": "Syllabus 5.1 lists shortening, re-levelling for an audience, and changing tone or format as reshaping tasks.", "why": ["Wrong. Inventing statistics is fabrication, not reshaping, and is the highest-risk behaviour addressed in Domain 6.", "Correct. Shortening and re-levelling for a different audience is exactly the reshaping use described.", "Wrong. Legal accuracy requires qualified human expertise. AI cannot confirm it, and legal interpretation is outside the syllabus.", "Wrong. Confidence is not a reliable indicator of accuracy, and sourcing requires verification at the original source."]}, {"q": "What limitation of AI summarising does the syllabus specifically identify?", "opts": ["Summaries are only accurate if the document is under one page. This attributes to the system a capacity it cannot hold.", "Summaries are always longer than the original. This understates how early the duty begins in the workflow.", "Summaries cann
