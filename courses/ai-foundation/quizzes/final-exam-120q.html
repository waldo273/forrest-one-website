ot be produced for technical documents. This assumes the model holds intent it does not have.", "Summaries can omit critical detail, so the original must be read for high-stakes documents"], "ans": 3, "exp": "Syllabus 5.2 identifies the limitation that summaries can omit critical detail and requires reading the original for high-stakes documents.", "why": ["Wrong. Summarisation works across document types, though quality varies.", "Wrong. Length alone does not determine summary reliability.", "Wrong. A summary is by definition shorter. This is not a limitation the syllabus identifies.", "Correct. Omission of critical detail is the named limitation and the reason high-stakes documents must be read in full."]}, {"q": "A team is preparing a summary of a contract for a board decision. What does the syllabus require?", "opts": ["The AI summary can be relied upon if it is well written. This substitutes a superficial check for verification at the original source.", "The summary should be produced by two different AI tools and compared.", "The original should be read, because this is a high-stakes document where omitted detail could matter", "The AI summary can be relied upon if the model was given the whole document."], "ans": 2, "exp": "Syllabus 5.2 requires the original to be read for high-stakes documents. Provision of the whole document improves grounding but does not remove the risk that critical detail is omitted from the summary. Comparing two AI outputs is specifically rejected as verification under 6.4.", "why": ["Wrong. Full-document input improves grounding but does not guarantee that nothing critical was dropped.", "Wrong. Writing quality is a fluency signal, not an accuracy signal, and it does not protect against omission.", "Correct. High stakes plus the risk of omitted detail means the original must be read.", "Wrong. Cross-checking against another AI is explicitly not verification under syllabus 6.4."]}, {"q": "Which of the following best describes using AI as a thinking partner for ideation and planning?", "opts": ["Avoiding AI in planning because ideas must be original. This reverses the relationship between the two ideas being compared.", "Generating and testing ideas with AI while retaining human ownership of the result", "Delegating the decision to AI because it can consider more options.", "Using AI output as the final plan without further consideration."], "ans": 1, "exp": "Syllabus 5.3 supports AI as a thinking partner for ideas and planning, with human ownership of the result.", "why": ["Wrong. Overcorrects. The syllabus supports ideation with AI, subject to ownership of the result.", "Correct. AI assists with idea generation and testing; the human owns the outcome.", "Wrong. Delegating the decision contradicts the ownership requirement.", "Wrong. This treats a draft as a final decision and removes human judgement from the process."]}, {"q": "How does the syllabus characterise AI research assistance?", "opts": ["As an authoritative source when the model is well regarded.", "As a starting point to verify, not an authoritative source", "As a complete substitute for primary research.", "As unsuitable for any professional research purpose. This mistakes a symptom of the problem for its cause."], "ans": 1, "exp": "Syllabus 5.3 states that research assistance should be treated as a starting point to verify, not as an authoritative source.", "why": ["Wrong. Overcorrects. The syllabus supports AI research assistance, subject to verification.", "Correct. A starting point requiring verification is the syllabus position.", "Wrong. Model reputation does not confer authority. Authority comes from the original source.", "Wrong. AI assistance complements research. It does not replace primary sources."]}, {"q": "What determines whether AI is appropriate for a given task according to syllabus 5.4?", "opts": ["Whether the task can be completed quickly with AI. This treats an optional good practice as a mandatory control.", "Whether the organisation has a licence for the tool. This attributes to the system a capacity it cannot hold.", "The nature of the task and the stakes involved, which together indicate when human expertise or authoritative sources should lead", "Whether the team has been trained on the specific tool. This understates how early the duty begins in the workflow."], "ans": 2, "exp": "Syllabus 5.4 requires determining when AI is suitable and when human expertise, conventional tools or authoritative sources should lead, based on task and stakes.", "why": ["Wrong. Licensing is a commercial and compliance matter, not the basis for appropriateness.", "Wrong. Speed is an efficiency consideration and does not settle appropriateness.", "Correct. Task type and stakes determine whether AI, human expertise or an authoritative source should lead.", "Wrong. Training is a readiness factor, not the determinant of appropriateness."]}, {"q": "A junior employee is asked to provide a legal opinion on a contract clause. Which action is most consistent with syllabus 5.4?", "opts": ["Produce the opinion with AI, since the clause is short and self-contained.", "Produce the opinion with AI and note that AI assisted. This describes a related concept from a different area of the syllabus.", "Escalate to qualified human expertise, because the task requires expertise the AI cannot supply", "Produce the opinion with AI and have a colleague read it. This reverses the relationship between the two ideas being compared."], "ans": 2, "exp": "Legal interpretation requires qualified human expertise and is explicitly outside the syllabus scope. Where human expertise should lead, the appropriate action is to escalate.", "why": ["Wrong. Clause length is irrelevant. The nature of the task is what requires expertise.", "Wrong. Peer review by an unqualified colleague does not provide the required expertise.", "Correct. Where qualified expertise is required, the task should go to that expertise.", "Wrong. Disclosure does not supply the missing qualification."]}, {"q": "Which of the following should always be verified before AI output is acted on or shared?", "opts": ["Facts, figures, dates, names, quotes and citations", "Only the sections the reader is most likely to check.", "Nothing, provided the output reads fluently.", "Only the spelling and grammar. This attributes to the system a capacity it cannot hold."], "ans": 0, "exp": "Syllabus 5.5 names facts, figures, dates, names, quotes and citations as the elements to verify. Fluency is not evidence of accuracy.", "why": ["Correct. These are the specific high-risk elements named in the syllabus.", "Wrong. Fluency is precisely what makes unverified output dangerous, because it discourages checking.", "Wrong. Presentation checks do not address factual accuracy at all.", "Wrong. Verification cannot be limited to what an audience might happen to check."]}, {"q": "Who remains accountable for AI-assisted work according to syllabus 5.5?", "opts": ["No one, because AI output is provisional by nature.", "The tool vendor, because it supplied the system.", "The user, not the AI", "The AI system, because it produced the output."], "ans": 2, "exp": "Syllabus 5.5 states that the user, not the AI, remains accountable. This principle recurs in Domain 8.2 and 8.6.", "why": ["Wrong. Provisional outputs still require a responsible human. Accountability is not dissolved by the nature of the tool.", "Wrong. Vendor liability is a commercial matter and does not transfer the user's professional accountability.", "Correct. The user remains accountable, and this is stated explicitly.", "Wrong. An AI system cannot bear accountability. This is the recurring error the syllabus guards against."]}, {"q": "What is the purpose of maintaining a personal prompt library, as described in syllabus 5.6?", "opts": ["To save and organise reusable prompts and templates for recurring tasks, at awareness level", "To share prompts publicly for professional recognition. This treats an optional good practice as a mandatory control.", "To record every prompt ever used for audit purposes. This understates how early the duty begins in the workflow.", "To prevent colleagues from using the same prompts. This describes a related concept from a different area of the syllabus."], "ans": 0, "exp": "Syllabus 5.6 tests at awareness level the purpose of saving and organising reusable prompts and templates for recurring tasks.", "why": ["Correct. Reusable prompts and templates for recurring tasks is the stated purpose.", "Wrong. Exclusivity is not the purpose. The library is a personal efficiency aid.", "Wrong. A prompt library is a working aid, not an audit log. Audit requirements are a governance matter under Domain 8.", "Wrong. Public sharing is not the stated purpose and raises separate data considerations."]}, {"q": "A team members' AI-generated client email contains a specific figure that the model supplied without any source. What is the correct action?", "opts": ["Remove the figure and send the email without it. This assumes the model holds intent it does not have.", "Send it, because the model is generally reliable with numbers.", "Verify the figure against the authoritative source before sending", "Send it with a caveat that the figure is unverified."], "ans": 2, "exp": "Figures are named in syllabus 5.5 as elements requiring verification, and invented statistics are identified in 6.2 as a specific fabrication risk. Verification against the primary source is the correct action.", "why": ["Wrong. Sourced or not, a figure from a model carries no authority. Reliability in general is not evidence for this figure.", "Wrong. Removing the figure may be acceptable in some cases, but the syllabus requirement is to verify. The figure may well be correct and necessary.", "Correct. Unsupported figures are a named high-risk element and must be verified at source.", "Wrong. A caveat shifts risk to the client rather than resolving it, and an unverified figure should not be sent at all."]}, {"q": "Which of the following best describes the relationship between drafting with AI and professional authorship?", "opts": ["Authorship is determined by who last edited the text. This understates how early the duty begins in the workflow.", "Authorship is shared equally between the professional and the AI. This describes a related concept from a different area of the syllabus.", "The AI is the author because it produced the words. This confuses a technical property of the system with a professional obligation.", "The professional remains the author of the work and takes responsibility for the final content"], "ans": 3, "exp": "Syllabus 5.1 requires review and personalisation, and 5.5 places accountability on the user. The professional who adopts and issues the work is its author and is responsible for it.", "why": ["Wrong. A system cannot be an author or hold responsibility.", "Wrong. Accountability cannot be shared with an entity that cannot bear it.", "Wrong. Editing order does not determine authorship or responsibility.", "Correct. Adopting the work makes the professional responsible for it as its author."]}, {"q": "An analyst uses AI to help plan a project and then follows the plan without checking whether it accounts for a known regulatory constraint. What is the primary failure?", "opts": ["Failing to use a second AI tool to check the plan. This confuses a technical property of the system with a professional obligation.", "Using AI for planning, which the syllabus does not permit. This relies on the tool vendor to carry a duty that stays with the user.", "Treating AI output as a finished decision rather than a draft to be assessed against known constraints", "Failing to disclose the use of AI in the planning process. This reverses the relationship between the two ideas being compared."], "ans": 2, "exp": "Syllabus 5.3 requires human ownership of the result. A plan that ignores a known constraint has not been owned. Using AI for planning is permitted, and cross-checking with another AI is not a valid verification method.", "why": ["Wrong. Disclosure is a separate question and not the primary failure here.", "Wrong. Cross-checking against another AI is explicitly not verification under syllabus 6.4.", "Correct. The failure is adopting a draft as a decision without applying known constraints and judgement.", "Wrong. The syllabus supports AI use for planning, with human ownership."]}, {"q": "Which task is LEAST appropriate to delegate to AI without substantial human involvement?", "opts": ["Deciding whether an employee should be dismissed for misconduct", "Generating alternative phrasings of a sentence. This mistakes a symptom of the problem for its cause.", "Drafting a first version of a routine internal update.", "Shortening a public-facing document for a general audience."], "ans": 0, "exp": "Dismissal decisions are people-affecting, high-stakes and governed by process and law. The syllabus places these firmly in the category where human expertise must lead (5.4) and where oversight is essential (8.3). The other options are routine assistance tasks.", "why": ["Correct. A people-affecting decision with legal consequences requires human expertise to lead.", "Wrong. Shortening a document for an audience is a named reshaping task in syllabus 5.1, subject to review.", "Wrong. Generating alternative phrasings is routine assistance with low stakes.", "Wrong. Drafting a routine internal update is a standard assisted-drafting task."]}, {"q": "Which best defines hallucination in a language model?", "opts": ["Confident, fluent output that is factually wrong with no signal that anything is amiss", "Output that the model declines to produce on safety, policy or ethical grounds. This mistakes a symptom of the problem for its cause.", "Text that starts repeating itself once the context window has been exceeded.", "A visible error message that appears whenever the model cannot answer a question."], "ans": 0, "exp": "Syllabus 6.1 defines hallucination as confident, fluent output that is factually wrong, with no signal that anything is amiss. The absence of any warning cue is what makes it dangerous, because the text looks exactly as trustworthy as correct text.", "why": ["Correct. This is the syllabus 6.1 definition, and the missing warning signal is the key feature.", "Refusals are a safety behaviour rather than hallucination, and they are visible rather than silent.", "Hallucination is not an error state, and the model produces plausible text and presents it normally.", "Repetition is a separate context-window effect, while hallucination concerns fabricated or wrong content."]}, {"q": "A model produces a fluent, confident answer containing three specific-looking statistics. What is the syllabus position?", "opts": ["Numbers are inherently safer than prose because they look precise and specific to readers.", "Statistics from a modern model can be trusted whenever the surrounding answer reads well.", "The model will reliably flag any statistic that it is genuinely unsure about when it writes.", "Figures and citations are high-risk elements that must be verified at their original source"], "ans": 3, "exp": "Syllabus 6.3 identifies citations, statistics and quotes as high-risk, and requires confirming important information at its original source. Syllabus 6.2 warns specifically that fabricated statistics appear authoritative.", "why": ["Fluency is precisely the misleading signal that makes hallucination dangerous, as 6.1 warns.", "Precision of form says nothing about accuracy, since fabricated figures look precise by design.", "According to 6.1 there is no signal when something is wrong, so self-flagging cannot be relied on.", "Correct. Statistics are named in 6.3 as high-risk and require verification at source before use."]}, {"q": "What should you do about a citation produced by an AI tool?", "opts": ["Confirm it exists and confirm that it actually supports the proposition it is attached to", "Accept it provided the citation appears in a plausible and correctly formatted reference style.", "Assume it is valid provided that the author name and the year both look familiar to you.", "Check it against the response that a second and different AI tool gives to the same question."], "ans": 0, "exp": "Syllabus 6.3 requires confirming important information at its original source, and 6.4 specifies cross-checking against primary sources rather than another AI. A citation can exist yet not support the claim attributed to it, so both existence and support must be checked.", "why": ["Correct. Both conditions matter, since the source must exist and must substantiate the stated proposition.", "Syllabus 6.4 explicitly rules this out, because cross-checking against another AI is not verification.", "Correct formatting is trivial to generate and therefore proves nothing about existence or accuracy.", "Familiar-looking author names and years are exactly the surface plausibility that fabrication exploits."]}, {"q": "Cross-checking an AI answer against a second AI tool. What does the syllabus say?", "opts": ["It is acceptable only where both models come from the same underlying provider.", "It is a mandatory step for any output that will be used in a high-stakes setting.", "It is the most reliable and convenient verification method currently available.", "It is not verification, and you should check against primary sources instead"], "ans": 3, "exp": "Syllabus 6.4 is explicit that you should cross-check against primary sources rather than another AI. Two models drawing on similar patterns can produce the same confident error, so agreement between them is not evidence of truth.", "why": ["It is not required, and it is specifically discouraged as a substitute for checking sources.", "It offers no independent evidence of truth, so it cannot be considered the most reliable method.", "Provider similarity makes agreement even weaker as evidence of accuracy rather than stronger.", "Correct. Syllabus 6.4 rules out AI-to-AI checking and directs you to primary sources instead."]}, {"q": "An AI tool claims to be 'hallucination-free' because it uses retrieval. How should you treat that claim?", "opts": ["As reliable, because retrieval grounds every answer in a set of real documents.", "Sceptically, because retrieval reduces error but does not actually remove it", "As a firm vendor commitment that the tool will reimburse you for any error.", "As reliable for citations specifically, even if other content needs checking."], "ans": 1, "exp": "Syllabus 3.3 states plainly that RAG improves freshness and grounding but reduces rather than removes error. Research into retrieval-based legal research tools marketed as hallucination-free found continued hallucination across a substantial proportion of queries.", "why": ["The syllabus excludes commercial product evaluation, since the certification is deliberately vendor-neutral.", "Correct. This restates syllabus 3.3 and matches the evidence that retrieval is not a panacea.", "Citation accuracy is itself a documented weakness of retrieval-based tools rather than a strength.", "Retrieval improves grounding but cannot guarantee that every generated claim traces to a retrieved source."]}, {"q": "Why does 'it looked completely convincing' fail as a defence for publishing AI errors?", "opts": ["Because publishing any content that was produced with AI assistance is always prohibited.", "Because text that appears convincing is statistically more likely to contain errors in it.", "Because the model should have flagged its own uncertainty clearly before you published.", "Fluency is not a signal of accuracy, and the human remains fully accountable for it"], "ans": 3, "exp": "Syllabus 6.1 explains that hallucination carries no warning signal, and syllabus 8.2 states that 'the AI did it' is not a defence. Convincing presentation is precisely the failure mode, so it cannot also serve as the excuse.", "why": ["According to 6.1 there is no reliable self-flagging, so this cannot be the standard you rely on.", "The syllabus does not ban publishing AI-assisted content, and it requires verification and sometimes disclosure.", "Convincing text is not statistically more likely to be wrong, and the point is that it tells you nothing.", "Correct. The absence of a warning plus retained human accountability means plausibility excuses nothing."]}, {"q": "What role does keeping 'a human in the loop' play?", "opts": ["A person reviews the output and takes responsibility before it is used or acted upon", "A person types the prompt into the tool on the model's behalf to speed up the process.", "A person approves the training data that the underlying model was originally built on.", "A person monitors the model's electricity consumption and hardware resource usage."], "ans": 0, "exp": "Syllabus 6.4 names keeping a human in the loop as a risk-reduction measure, and 8.3 sets out the principle that AI proposes while a person decides and owns the outcome. The human is a decision point rather than an operator.", "why": ["Correct. Oversight means a person reviews and owns the result before it has any real effect.", "Infrastructure monitoring is unrelated to the accountability that genuine oversight provides.", "Prompt entry is a purely mechanical task that confers no oversight or accountability whatsoever.", "Training-data approval is not what in-the-loop oversight means in this particular syllabus."]}, {"q": "When a summary of a high-stakes document is being prepared with AI, what must happen?", "opts": ["Only the executive summary section of the original needs to be checked over.", "The original must be read, because summaries can omit critical detail", "The summary is sufficient provided it is well structured and clearly laid out.", "A second AI summary can reasonably substitute for reading the original document."], "ans": 1, "exp": "Syllabus 5.2 names the limitation that summaries can omit critical detail, and requires reading the original for high-stakes documents. Compression always involves judgement about what to drop, and that judgement may discard what matters most to you.", "why": ["Good structure does not prevent omission, since formatting says nothing about completeness.", "Correct. For high-stakes material the original is the authority and the summary is only an aid.", "Checking one section does not establish that nothing important was omitted from the rest.", "Two summaries can drop the same material, and neither of them is the authoritative document."]}, {"q": "Which behaviour best matches 'verification at the original source'?", "opts": ["Asking the model to confirm the accuracy of its own earlier answer.", "Searching for the claim to see whether other AI answers repeat it.", "Opening the cited document itself and reading the relevant passage", "Checking that the citation's web address resolves to a live page."], "ans": 2, "exp": "Syllabus 6.3 requires confirming important information at its original source, and 6.4 directs cross-checking against primary sources. Reading the actual passage is the only method that establishes both existence and support.", "why": ["Recurrence across AI answers may reflect shared training patterns rather than an underlying source.", "Self-confirmation is not independent evidence and may simply repeat the original error.", "Correct. Reading the source passage confirms the document exists and says what was claimed.", "A resolving address does not prove the source supports the claim, and fabricated citations can point at irrelevant pages."]}, {"q": "What is the significance of the documented court sanctions involving AI citations?", "opts": ["They show that only lawyers and legal professionals are affected by hallucination.", "They show that AI is fundamentally unsuitable for all professional writing tasks.", "They show that courts have now banned the use of AI in legal drafting entirely.", "They show that unverified AI content carries real professional consequences"], "ans": 3, "exp": "Sanctions, referral to disciplinary authorities and orders to pay opposing costs demonstrate that the verification duty is enforceable rather than merely advisory. This is what turns syllabus 6.5 from guidance into professional obligation.", "why": ["The documented pattern spans courts, tribunals, authorities and research publication across many countries.", "AI remains useful for drafting, so the lesson concerns verification rather than blanket prohibition.", "Courts have increasingly required disclosure and verification rather than imposing a total ban.", "Correct. The cases establish that failing to verify AI output has enforceable professional consequences."]}, {"q": "Which is the most reliable way to check whether an AI claim about a regulation is correct?", "opts": ["Ask the AI model to explain its reasoning about the regulation in more detail.", "Read the regulation on the official publisher's website for that jurisdiction", "Check whether the answer the model gave is internally consistent and coherent.", "Ask a completely different AI model the very same question and compare replies."], "ans": 1, "exp": "Syllabus 6.3 and 6.4 both point to the original source. For a regulation, the authoritative text is published by the issuing body, and only that text settles what the regulation actually says.", "why": ["An answer can be internally consistent and still be factually wrong in its substantive claims.", "Correct. The official published text is the definitive authority for what a regulation provides.", "More detailed reasoning may simply elaborate a fabrication with greater fluency and confidence.", "A second model can reproduce the same error, which syllabus 6.4 explicitly anticipates."]}, {"q": "Why is a fabricated quote particularly dangerous in professional work?", "opts": ["It attaches a real person's name to words they never actually said", "It is usually much longer than a fabricated statistic would be.", "It only causes problems in social media and public commentary posts.", "It is considerably harder for the model to generate than other text."], "ans": 0, "exp": "Syllabus 6.3 identifies quotes as high-risk alongside citations and statistics. A fabricated quote does two kinds of damage, since the claim itself may be false and a named individual is misrepresented, which can carry its own professional and reputational consequences.", "why": ["Correct. Misattribution harms a real person and compounds the accuracy problem with a reputational one.", "Fabricated quotes are equally dangerous in reports, briefings, board papers and academic work.", "Length is irrelevant to the risk, since the harm comes from the false attribution itself.", "Generating plausible dialogue is well within a language model's ordinary capability."]}, {"q": "What does 'AI proposes while a person decides' require in practice?", "opts": ["A named human reviews and approves the output before it takes effect", "The AI must state its own confidence level clearly before proceeding further.", "The AI must be switched off completely during the final review stage.", "The task must be small enough for one single person to check it all through."], "ans": 0, "exp": "Syllabus 8.3 states this principle directly, and 6.4 requires keeping a human in the loop. In practice it means that a specific, identifiable person accepts responsibility before the output is acted on or published.", "why": ["Correct. Oversight requires an accountable person who approves before any consequences follow.", "Task size does not determine accountability, since large tasks can still have a named approver.", "The tool need not be switched off, but a person must own the eventual decision.", "Confidence statements are not reliable signals, as syllabus 6.1 makes clear to candidates."]}, {"q": "Which instruction is most useful for surfacing uncertainty?", "opts": ["If the sources I have given do not answer this, say so rather than inferring an answer", "Please be as accurate as you possibly can be in everything that you write for me here.", "Double-check all of your work carefully before you reply to me with the final answer.", "Do not make any mistakes at all in the response that you provide for me this time."], "ans": 0, "exp": "Syllabus 6.4 recommends asking the model to flag uncertainty. A specific instruction that identifies the acceptable outcome, namely saying that the supplied material does not answer the question, is far more actionable than a general plea for care.", "why": ["Correct. Naming the permitted response gives the model a clear alternative to guessing at an answer.", "A general wish for accuracy gives the model no mechanism for revealing genuine doubt to you.", "Do not make mistakes is unactionable and provides no route for the model to admit a knowledge gap.", "Instructions to self-check do not establish any external anchor that could confirm correctness."]}, {"q": "Why is 'the tool said it' insufficient as an audit trail?", "opts": ["Because audit trails only really matter in the financial services and accounting sectors.", "Output must be traceable to a verifiable source, not merely to the tool that produced it", "Because the same tool cannot reliably reproduce the same answer on two separate occasions.", "Because AI tools generally do not keep detailed logs of the responses they generate."], "ans": 1, "exp": "Syllabus 6.3 establishes that generated content is not sourced content. An audit trail requires tracing a claim back to an authoritative source, and pointing at the model that produced it establishes only who generated the text, not whether it is true.", "why": ["Reproducibility is a variability question at syllabus 2.5 and not the reason an audit trail is required.", "Correct. Traceability requires reaching an authoritative source, which the tool itself is not.", "Logging is a separate issue, and even a perfect log of a fabricated claim proves nothing about truth.", "Verification obligations span legal, medical, financial, safety, HR and published contexts rather than finance alone."]}, {"q": "A model gives two different answers to the same factual question on two occasions. What does this indicate?", "opts": ["One of the two answers given must be the correct one of the pair.", "Generation involves sampling, so output varies, and variation signals fragility", "The second answer is the improved and more reliable of the two replies.", "The model has learned from the first answer and adjusted its response."], "ans": 1, "exp": "Syllabus 2.5 explains that identical prompts can produce different answers because of sampling and the temperature setting. When a factual claim changes between runs, that instability is a warning that the detail is not securely grounded.", "why": ["Later generations are not refinements, and the model does not improve unless you explicitly correct it.", "Correct. Variability is expected from sampling, and it is a useful signal that a fact needs checking.", "The model does not update its internal weights based on the content of your conversation.", "Both answers could be wrong, so variation between them does not imply that one is right."]}, {"q": "Which habit most directly reduces the risk of publishing an AI error?", "opts": ["Using the most expensive and most recently released model that is available to you.", "Applying a fixed verification checklist to names, figures, dates, quotes and citations", "Reading the generated output through carefully two separate times before you send it.", "Keeping all of your prompts very short and tightly focused on a single small point."], "ans": 1, "exp": "Syllabus 5.5 lists exactly this set, namely facts, figures, dates, names, quotes and citations, as elements to verify before acting on or sharing output. A checklist makes the duty consistent rather than dependent on how convincing the text felt.", "why": ["Prompt length is unrelated to the verification duty that applies to the finished output.", "Correct. A fixed checklist targets the named high-risk elements and removes reliance on impressions.", "Model cost is not a guarantee of accuracy, and the syllabus is deliberately vendor-neutral.", "Re-reading catches typographical slips but not fabrications that read perfectly well on the page."]}, {"q": "Why does the syllabus pair hallucination with critical evaluation as a core competency?", "opts": ["Because output must be assessed on evidence rather than plausibility before it is trusted", "Because automated evaluation tools can now reliably detect hallucinations without human help.", "Because all AI output should generally be distrusted as a matter of sensible default policy.", "Because critical evaluation of output removes the need to check against original sources."], "ans": 0, "exp": "Domain 6 is introduced as critical evaluation and verification as a core professional competency. The pairing reflects that hallucination cannot be detected from the output alone, so the professional habit is to evaluate against evidence.", "why": ["Correct. The competency is disciplined evidence-based assessment of output before relying on it.", "The syllabus is not generally distrustful of AI, and it requires appropriate and verified use.", "No automated detector reliably identifies hallucination, which is why human verification is required.", "Critical evaluation directs you towards source checking and does not substitute for it."]}, {"q": "A colleague says hallucination will disappear as models improve. What is the best-informed response?", "opts": ["Hallucination only ever affects older or smaller models and not the current generation of tools.", "Fabrication has not declined consistently across generations, so verification remains essential", "That is correct, so verification can reasonably be relaxed for the very newest models available.", "Hallucination is actually increasing steadily in every measurable dimension across all models."], "ans": 1, "exp": "Research benchmarking fabricated legal citations across eight successive model generations found that hallucination rates were not consistently decreasing, and that newer models produced more citations per document from less canonical sources, which increases the verification burden. The trend is not self-correcting.", "why": ["Assuming improvement and relaxing checks is exactly the behaviour that the evidence warns against.", "Correct. The evidence shows no consistent decline, and the verification burden has grown rather than shrunk.", "Hallucination affects current models, including some marketed as grounding-based and hallucination-free.", "The finding is that rates are not consistently decreasing, rather than that they are rising in every measure."]}, {"q": "Which of the following must NOT be entered into a public or unapproved AI tool?", "opts": ["Personal data, confidential and commercially sensitive information, credentials and confidential documents", "Published research papers. This relies on the tool vendor to carry a duty that stays with the user.", "General questions about a topic with no specific details. This applies a general principle without regard to the stakes involved.", "Publicly available marketing content. This attributes to the system a capacity it cannot hold."], "ans": 0, "exp": "Syllabus 7.1 names the categories that must not be entered into public or unapproved tools: personal data, confidential and commercially sensitive information, credentials and confidential documents.", "why": ["Correct. These categories are named explicitly in the syllabus.", "Wrong. Published papers are public documents.", "Wrong. A general question with no identifying or confidential detail carries no disclosure risk.", "Wrong. Publicly available marketing material is already in the public domain and contains no confidential detail."]}, {"q": "What is the default rule the syllabus gives for handling information in AI tools?", "opts": ["When in doubt, ask a colleague. This mistakes a symptom of the problem for its cause.", "When in doubt, use an approved tool instead.", "When in doubt, leave it out", "When in doubt, remove the person's name and proceed"], "ans": 2, "exp": "Syllabus 7.1 gives the default rule directly: 'when in doubt, leave it out.' It is a conservative default that resolves uncertainty in favour of protection.", "why": ["Wrong. Removing a name does not necessarily remove identifiability, and other confidential detail may remain.", "Wrong. Consulting a colleague may be sensible, but the syllabus default is a decision rule about the data itself.", "Correct. This is the syllabus rule and it is deliberately conservative.", "Wrong. Using an approved tool may address part of the concern, but the default rule is about whether the information belongs in a prompt at all."]}, {"q": "What should a professional understand about how a third-party AI service handles inputs?", "opts": ["Inputs are always confidential by default. This assumes the model holds intent it does not have.", "Inputs are deleted immediately and are never transmitted. This treats an optional good practice as a mandatory control.", "The service may transmit, store or use inputs according to its terms, so organisational policy governs what may be entered", "Inputs are only stored if the user explicitly opts in. This relies on the tool vendor to carry a duty that stays with the user."], "ans": 2, "exp": "Syllabus 7.2 states that third-party services may transmit, store or use inputs according to their terms, and that organisational policy governs use.", "why": ["Wrong. Confidentiality is not automatic. It depends on the terms of the specific service.", "Wrong. Immediate deletion is not a safe default assumption and is not true of all services.", "Correct. Handling follows the provider's terms, and organisational policy governs what may be submitted.", "Wrong. Retention behaviour varies by service and tier. Assuming opt-in storage is unsafe."]}, {"q": "What do the concepts of data retention and residency refer to in relation to AI services?", "opts": ["How much the service costs, and how the cost is calculated. This describes a related concept from a different area of the syllabus.", "How the model was trained, and which data was used. This reverses the relationship between the two ideas being compared.", "How quickly the model responds, and how many users it supports. This overstates the requirement beyond the professional-literacy standard.", "How long inputs and outputs are kept, and where they are stored or processed geographically"], "ans": 3, "exp": "Syllabus 7.2 requires basic awareness of data retention and residency: how long data is kept and where it is held or processed.", "why": ["Wrong. Cost is a commercial matter unrelated to these terms.", "Wrong. These are performance and capacity characteristics, not retention and residency.", "Wrong. Training provenance is a separate concern, though related to transparency.", "Correct. Duration of storage and geographic location are the two concepts."]}, {"q": "What is shadow AI?", "opts": ["AI used for security testing purposes. This applies a general principle without regard to the stakes involved.", "AI used by employees working remotely. This confuses a technical property of the system with a professional obligation.", "AI that operates without a user interface. This relies on the tool vendor to carry a duty that stays with the user.", "Unapproved AI use outside organisational oversight, which creates data and compliance risks the organisation cannot see"], "ans": 3, "exp": "Syllabus 7.3 defines shadow AI as unapproved AI use outside organisational oversight and identifies the risks it creates.", "why": ["Wrong. Security testing is a specific authorised activity, not the definition of shadow AI.", "Wrong. Interface type is irrelevant. Approval and oversight are what matter.", "Wrong. Remote work is a location, not the defining characteristic. Approved remote AI use is not shadow AI.", "Correct. Unapproved use outside oversight is the definition."]}, {"q": "An employee finds that the organisation has no policy covering the AI tool they want to use. What should they do according to syllabus 7.3?", "opts": ["Treat the policy gap as a reason to escalate for approval rather than proceeding on personal judgement", "Proceed, because absence of a policy means the use is permitted. This treats an optional good practice as a mandatory control.", "Ask a colleague whether they think it is acceptable. This overstates the requirement beyond the professional-literacy standard.", "Proceed but keep a personal record of what they entered. This substitutes a superficial check for verification at the original source."], "ans": 0, "exp": "Syllabus 7.3 states that a policy gap is a reason to escalate. Proceeding without approval is the shadow AI behaviour the syllabus warns against.", "why": ["Correct. Escalation is the syllabus position on a policy gap.", "Wrong. A colleague's opinion does not substitute for organisational approval.", "Wrong. This is the reasoning that produces shadow AI.", "Wrong. A personal record does not provide authorisation or oversight."]}, {"q": "Which of the following best describes AI-enabled threats named in syllabus 7.4?", "opts": ["Threats that are easily recognised because they contain errors. This describes a related concept from a different area of the syllabus.", "Attacks that exclusively target AI systems. This mistakes a symptom of the problem for its cause.", "Only attacks carried out by AI systems acting alone. This overstates the requirement beyond the professional-literacy standard.", "Deepfakes, impersonation and AI-assisted phishing and social engineering that can be highly convincing"], "ans": 3, "exp": "Syllabus 7.4 names deepfakes, impersonation and AI-assisted phishing and social engineering, tested at awareness level.", "why": ["Wrong. This is precisely the danger. AI-assisted attacks can be fluent and convincing rather than error-ridden.", "Wrong. Targets are people and organisations, not only AI systems.", "Wrong. The threats are AI-enabled, meaning humans use AI to make attacks more effective.", "Correct. These are the named threat categories."]}, {"q": "You receive an urgent message from an executive, apparently in their voice, asking for an immediate payment. What is the correct response?", "opts": ["Forward the message to a colleague for a second opinion.", "Reply to the message asking for confirmation.", "Verify the request through a separate, trusted channel before acting", "Comply, because the request came from a senior person."], "ans": 2, "exp": "Syllabus 7.4 requires verification of unexpected or urgent requests through a separate, trusted channel. Replying through the same channel does not verify identity, since the same attacker controls it.", "why": ["Wrong. Seniority is exactly what makes the request attractive to an attacker.", "Wrong. Replying within the same channel does not verify identity. The attacker receives the reply.", "Correct. A separate trusted channel is the syllabus requirement, and it defeats impersonation of the original channel.", "Wrong. A second opinion through the same channel does not establish authenticity."]}, {"q": "What is prompt injection?", "opts": ["Malicious instructions hidden in content the AI processes, which the model may follow as if they came from the user", "An attempt to overload the model's context window. This assumes the model holds intent it does not have.", "A technique for inserting structured data into a prompt. This treats an optional good practice as a mandatory control.", "An error in a prompt that causes the model to produce a wrong answer. This applies a general principle without regard to the stakes involved."], "ans": 0, "exp": "Syllabus 7.5, tested at awareness level, defines prompt injection as malicious instructions hidden in content the AI processes.", "why": ["Correct. Hidden malicious instructions in processed content is the definition.", "Wrong. Structured data insertion is a legitimate prompting technique.", "Wrong. Overloading the context window is a different failure mode, addressed in Domain 2 and 6.", "Wrong. A mistake in a prompt is a user error, not an injection."]}, {"q": "An AI assistant is asked to summarise a document supplied by an external party. Why is caution warranted?", "opts": ["Because summarisation is not a supported task for AI. This overstates the requirement beyond the professional-literacy standard.", "The document may contain hidden instructions aimed at the AI, so untrusted content should be handled with caution and AI actions kept under oversight", "Because external documents are always longer than expected. This treats an optional good practice as a mandatory control.", "Because summarising requires approval from the document's author. This treats an optional good practice as a mandatory control."], "ans": 1, "exp": "Syllabus 7.5 requires caution with untrusted content and oversight of AI actions, because hidden instructions in processed content can redirect the model.", "why": ["Wrong. Summarisation is a supported task. The issue is the trustworthiness of the content.", "Correct. Untrusted content is the injection vector, so caution and oversight are required.", "Wrong. Permission from an author is a separate matter, and the summary may be fully legitimate.", "Wrong. Length is a context-window concern, not the reason for caution here."]}, {"q": "Which combination best reflects the handling of information when using AI at work?", "opts": ["Use only tools recommended by colleagues, since peer experience reduces risk. This assumes the model holds intent it does not have.", "Use approved tools, enter no confidential or personal data into unapproved ones, and follow organisational policy", "Use any tool, provided the data is deleted afterwards on the user's device. This understates how early the duty begins in the workflow.", "Use any tool that is free, since cost indicates low risk. This assumes the model holds intent it does not have."], "ans": 1, "exp": "Syllabus 7.1 to 7.3 together require approved tooling, protection of information and adherence to organisational policy. The other options substitute assumptions for governance.", "why": ["Wrong. Cost to the user has no bearing on the risk of data handling.", "Correct. Approved tools, protected information and policy compliance are the three requirements combined.", "Wrong. Peer recommendation is not approval, and it provides no oversight.", "Wrong. Local deletion does not affect what has already been transmitted or stored by the service."]}, {"q": "Why does the syllabus treat a policy gap as a matter for escalation rather than individual discretion?", "opts": ["Because the organisation carries the consequences of unapproved AI use and is the body able to assess and approve the risk", "Because individuals are not permitted to make any decisions at work. This substitutes a superficial check for verification at the original source.", "Because escalation delays use until the tool is no longer needed. This relies on the tool vendor to carry a duty that stays with the user.", "Because policy gaps always indicate that use is prohibited. This assumes the model holds intent it does not have."], "ans": 0, "exp": "Unapproved use creates organisational risk in data protection and compliance, and the organisation is responsible for assessing and accepting that risk. That is why the decision belongs with the organisation, not the individual.", "why": ["Correct. Risk acceptance belongs to the organisation, which bears the consequences.", "Wrong. A gap is not a prohibition. It is an unanswered question that should be answered before use.", "Wrong. Escalation is intended to reach a decision, not to stall indefinitely.", "Wrong. Overstated. Individuals make many decisions, but risk acceptance for unapproved tooling is not one of them."]}, {"q": "Under syllabus area 8.1, a bias assessment is described as a duty in which circumstances?", "opts": ["Whenever an AI tool is used for any purpose at all.", "In uses that affect people, such as hiring, lending or access to services", "Only when a model has been trained on data the organisation collected itself.", "Only where legislation has already been breached. This treats an optional good practice as a mandatory control."], "ans": 1, "exp": "Bias assessment is a duty where AI is used in ways that affect people, because the harm falls on individuals. Hiring, lending and access to services are the syllabus examples. It is not triggered by every possible use, nor only after a breach.", "why": ["Wrong. The source of the training data is not the trigger. The question is whose interests are at stake in the use.", "Correct. People-affecting uses are where bias does real harm and where the duty applies.", "Wrong. Too broad. The syllabus ties the duty to people-affecting uses, not to any conceivable use of AI.", "Wrong. This is backwards. Assessment exists to prevent harm and demonstrate responsible use, not to respond only once the law has already been broken."]}, {"q": "An AI tool used to shortlist job applicants was tested and found to select men at a notably higher rate than women with comparable qualifications. The organisation decides to keep using it but to remove names and gender markers from applications before screening. What is the best assessment?", "opts": ["The organisation should stop using AI in hiring entirely, since no AI tool can be made fair. This describes a related concept from a different area of the syllabus.", "The fix is unnecessary, because the tool is only advisory. This treats an optional good practice as a mandatory control.", "Removing obvious markers may help but does not prove the tool is fair, because bias can persist through proxy signals in the remaining data", "The fix is sufficient, because the model can no longer see gender. This treats an optional good practice as a mandatory control."], "ans": 2, "exp": "Blinding obvious markers is a reasonable mitigation but not proof of fairness. Correlated features such as career gaps, institution names or phrasing can act as proxies that preserve the bias. Fairness has to be tested on outcomes, not assumed from the removal of a field.", "why": ["Wrong. Advisory status does not remove the duty of care. An advisory ranking still steers human decisions and can cause the same harm.", "Wrong. Overcorrects. Bias can be assessed, mitigated and monitored. Abandoning the tool is one option, not the only defensible one.", "Correct. Removing a field reduces but does not eliminate the risk of proxy discrimination. Outcome testing is still required.", "Wrong. This mistakes an unobservable field for an unlearned pattern. Proxies can carry the same signal indirectly."]}, {"q": "Which statement best reflects the relationship between bias and the deployment context?", "opts": ["A system that is unbiased in testing is unbiased everywhere, because bias is a property of the model alone.", "Deployment context matters only for systems that make decisions without any human involvement. This reverses the relationship between the two ideas being compared.", "A system that performs acceptably in one setting can cause harm in another, so context is part of the bias assessment", "Deployment context is a legal question and therefore outside a Foundation-level syllabus. This describes a related concept from a different area of the syllabus."], "ans": 2, "exp": "The syllabus names deployment context as a source of bias. The same model can be harmless in a low-stakes setting and harmful in one that affects people's opportunities or safety, so the setting is part of the assessment.", "why": ["Wrong. The syllabus tests bias assessment as a professional duty at Foundation level. High-level awareness of the regulatory picture appears separately at 8.5.", "Wrong. Human involvement can reduce risk but does not make context irrelevant. An advised human can still be misled.", "Correct. Context changes the stakes and can change the outcome, so it belongs in the assessment.", "Wrong. Bias is not a fixed property of a model alone. It emerges from the interaction of data, design and use."]}, {"q": "What does 'explainability' mean at Foundation level in this syllabus?", "opts": ["Publishing the full source code of the model. This describes a related concept from a different area of the syllabus.", "Being able to give a meaningful account of how a decision was reached and what it was based on", "Revealing the exact numerical weights inside the neural network. This assumes the model holds intent it does not have.", "Guaranteeing that every AI decision can be perfectly reconstructed years later."], "ans": 1, "exp": "At Foundation level, explainability means being able to give a meaningful account of a decision: what information informed it and how it was arrived at. It is a professional-literacy standard, not a demand for source code or internal weights.", "why": ["Wrong. Model weights are technical detail well beyond Foundation level and, on their own, do not explain a particular outcome in professional terms.", "Correct. Explainability is about giving a meaningful account of the basis for a decision.", "Wrong. Publishing source code is not required and would not by itself explain a decision. Many systems are also third-party services the organisation does not own.", "Wrong. Perfect reconstruction is a much stronger standard than the syllabus requires and is often technically impossible."]}, {"q": "A manager is told that an automated tool rejected a large batch of applications. She asks for the criteria used. Which of the following best describes why this question matters?", "opts": ["Because the criteria are the intellectual property of the organisation and must be protected. This assumes the model holds intent it does not have.", "Because automated decisions of any kind are prohibited without written reasons. This substitutes a superficial check for verification at the original source.", "Because a written reason removes any need for further human judgement. This substitutes a superficial check for verification at the original source.", "Transparency and explainability allow the decision to be justified and reviewed, which is what makes accountability possible"], "ans": 3, "exp": "Transparency and explainability are the mechanisms through which accountability becomes real. Without a defensible account of the criteria, nobody can review the decision or answer for it.", "why": ["Wrong. The syllabus does not prohibit automated decisions. It requires oversight, transparency and accountability for them.", "Wrong. Protecting intellectual property is a separate concern and does not remove the need to account for a decision affecting a person.", "Wrong. A stated reason is a starting point for review, not a substitute for judgement. The human still owns the outcome.", "Correct. Being able to state and review the basis of a decision is what makes the accountable party able to answer for it."]}, {"q": "Which statement best captures the relationship between AI and human decision-makers in the syllabus's oversight principle?", "opts": ["AI decides while a person reviews the decision afterwards if time allows.", "AI and the person share accountability equally for the decision.", "A person must personally perform every calculation the AI would otherwise do.", "AI proposes while a person decides and owns the outcome"], "ans": 3, "exp": "The syllabus states the principle directly: AI proposes, a person decides and owns the outcome. Oversight means the human holds the decision and the accountability, not that the human re-does the work.", "why": ["Wrong. Post-hoc review that may not happen is not oversight. The human must be positioned to decide, not merely to audit afterwards.", "Wrong. Overstating the requirement. Oversight is about ownership of the decision, not duplication of every computation.", "Wrong. Accountability cannot be shared with a system that cannot bear it. It rests with the human and the organisation.", "Correct. This is the syllabus formulation and the cleanest statement of meaningful oversight."]}, {"q": "Which statement best expresses the central principle that syllabus 8.6 requires candidates to demonstrate?", "opts": ["Accountability is transferred to the AI provider once a system is purchased.", "AI can be held accountable for outcomes where its recommendations were followed.", "AI should be avoided in professional work wherever it is possible to do so.", "AI can assist with professional work, but humans remain accountable for the outcome"], "ans": 3, "exp": "The central principle is that AI assists while humans remain accountable. This runs through 8.2, 8.3 and 8.6 and is the anchor for the whole domain.", "why": ["Wrong. Directly contradicts 8.2. 'The AI did it' is not a defence and AI cannot hold accountability.", "Wrong. Procuring a system does not transfer accountability away from the deploying organisation.", "Wrong. The syllabus is not anti-AI. It requires responsible, accountable use, not avoidance.", "Correct. Assistance with retained human accountability is the syllabus's central principle."]}, {"q": "A team wants to publish an article written largely by generative AI. The team lead says 'we do not need to say anything, because the facts have all been checked.' How should this be assessed?", "opts": ["Disclosure is never required for text, only for images and video. This understates how early the duty begins in the workflow.", "Accuracy checking and disclosure are separate obligations; disclosure may still be required where AI substantially generated the content", "The assessment is correct, because verified content needs no disclosure. This reverses the relationship between the two ideas being compared.", "Disclosure is only required if the article contains a factual error. This treats an optional good practice as a mandatory control."], "ans": 1, "exp": "Fact-checking addresses whether the content is correct. Disclosure addresses how the content was produced. They are distinct obligations under 8.4 and 6.3, and satisfying one does not discharge the other.", "why": ["Wrong. This conflates two distinct obligations. Verified content can still require disclosure.", "Correct. Verification and disclosure are separate duties. Doing one does not remove the other.", "Wrong. The syllabus disclosure principle is not limited to images and video. Substantial AI generation of text can trigger it, particularly where readers would be misled.", "Wrong. This makes disclosure depend on error, which inverts the purpose of transparency."]}, {"q": "An organisation adopts a policy requiring that AI-generated content intended for external publication be reviewed by a named individual before release. Which governance purpose does this serve?", "opts": ["It removes the need for any disclosure of AI use. This applies a general principle without regard to the stakes involved.", "It guarantees that published content will contain no errors. This understates how early the duty begins in the workflow.", "It assigns clear accountability and inserts a human decision point where errors could cause public harm", "It transfers liability to the reviewing individual and away from the organisation. This understates how early the duty begins in the workflow."], "ans": 2, "exp": "Naming a responsible reviewer creates an accountable human decision point before externally visible release, which is precisely what governance is for. It does not shift organisational liability, remove disclosure duties, or guarantee accuracy.", "why": ["Wrong. Naming a reviewer does not transfer liability away from the organisation, which remains accountable for its systems and processes.", "Wrong. Review reduces risk. It cannot guarantee the absence of errors.", "Correct. Clear accountability plus a human gate at the highest-risk moment is the core purpose of the control.", "Wrong. Review and disclosure are separate obligations. Reviewing content does not remove the duty to disclose where required."]}, {"q": "An organisation's AI policy is two years old and predates the tools its staff now use daily. What does the syllabus suggest about the governance response?", "opts": ["The policy should be reviewed and updated, because governance requires ongoing review as practice and the field change", "The policy remains valid indefinitely because it was formally approved. This relies on the tool vendor to carry a duty that stays with the user.", "Staff should be trusted to interpret an out-of-date policy as they see fit. This substitutes a superficial check for verification at the original source.", "The policy should be withdrawn entirely rather than updated. This overstates the requirement beyond the professional-literacy standard."], "ans": 0, "exp": "Syllabus 8.5 describes governance as including oversight, accountability and review. A policy that no longer reflects how AI is actually used cannot guide behaviour or assign responsibility, so it needs periodic review rather than permanent validity.", "why": ["Correct. Review is a named element of governance, and a policy that lags actual practice has stopped doing its job.", "Wrong. Formal approval at a point in time does not make a policy fit for purpose as tools and practice change.", "Wrong. Overcorrects. The remedy for an out-of-date policy is to update it, not to remove the governance framework altogether.", "Wrong. Leaving interpretation to individuals removes the accountability structure that policy exists to provide, and encourages shadow AI."]}];
var PASS = 70;
var L = ["A","B","C","D"];
var cur = 0, answered = [], correct = [], submitted = false;

// Randomise question order on every attempt so the sequence cannot be memorised
// from a screenshot. Uses the same RNG discipline as the accessible quiz standard.
(function shuffleQuestions(){
  var seed = Date.now() % 2147483647;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = Q.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var t = Q[i]; Q[i] = Q[j]; Q[j] = t;
  }
})();

// --- Copy / cut / paste attenuation -------------------------------------------------
// Assessment integrity: discourage copying questions out and pasting answers in.
// This is a deterrent, NOT a security control, a determined user can defeat it via
// devtools. It stops casual text harvesting and pasted-in answers during a sitting.
(function blockClipboard(){
  function stop(e){
    e.preventDefault();
    showToast('Copying, cutting and pasting are disabled during this assessment.');
    return false;
  }
  ['copy','cut','paste','contextmenu'].forEach(function(evt){
    document.addEventListener(evt, stop, true);
  });
  // Disable text selection inside the question and analysis areas only, so that
  // the skip link and buttons remain fully keyboard accessible.
  var style = document.createElement('style');
  style.textContent = '#qholder, #results { -webkit-user-select:none; -moz-user-select:none;'
                    + ' -ms-user-select:none; user-select:none; }';
  document.head.appendChild(style);
})();

function showToast(msg){
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

var qlen = Q.length;
for (var i = 0; i < qlen; i++){ answered.push(false); correct.push(false); }

function el(id){ return document.getElementById(id); }

function render(){
  var q = Q[cur];
  var h = '<h2 class="qtext" id="qt">' + q.q + '</h2>';
  h += '<div role="radiogroup" aria-labelledby="qt">';
  for (var j = 0; j < q.opts.length; j++){
    h += '<button class="opt" type="button" role="radio" aria-checked="false" '
       + 'data-q="' + cur + '" data-o="' + j + '" id="o' + cur + '_' + j + '">'
       + '<span class="opt-letter">' + L[j] + '.</span>'
       + '<span class="op-text">' + q.opts[j] + '</span>'
       + '<span class="tag" id="t' + cur + '_' + j + '"></span></button>';
  }
  h += '</div><div id="ex' + cur + '"></div>';
  el('qholder').innerHTML = h;
  var btns = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++){
    btns[k].addEventListener('click', onPick);
  }
  var last = (cur === qlen - 1);
  el('next').style.display = last ? 'none' : '';
  el('submit').style.display = last ? '' : 'none';
  el('next').disabled = !answered[cur];
  el('submit').disabled = !answered[cur];
  updateBar();
}

function onPick(e){
  var b = e.currentTarget;
  var qi = parseInt(b.getAttribute('data-q'), 10);
  var oi = parseInt(b.getAttribute('data-o'), 10);
  if (answered[qi]) return;
  answered[qi] = true;
  var q = Q[qi];
  var isRight = (oi === q.ans);
  correct[qi] = isRight;
  var all = el('qholder').querySelectorAll('.opt');
  for (var k = 0; k < all.length; k++){
    var kq = parseInt(all[k].getAttribute('data-q'), 10);
    var ko = parseInt(all[k].getAttribute('data-o'), 10);
    if (kq !== qi) continue;
    all[k].disabled = true;
    all[k].setAttribute('aria-checked', ko === oi ? 'true' : 'false');
    var tg = el('t' + kq + '_' + ko);
    if (ko === q.ans){
      all[k].classList.add('correct');
      if (tg) tg.textContent = ko === oi ? '✓ Correct' : '✓ This was correct';
      if (tg) tg.className = 'tag correct';
    } else if (ko === oi){
      all[k].classList.add('wrong');
      if (tg) tg.textContent = '✗ Your answer';
      if (tg) tg.className = 'tag wrong';
    }
  }
  renderAnalysis(qi);
  var done = 0;
  for (var m = 0; m < qlen; m++){ if (answered[m]) done++; }
  el('running').textContent = 'Score: ' + tally() + ' / ' + done;
  el('next').disabled = false;
  el('submit').disabled = false;
  updateBar();
}

function renderAnalysis(qi){
  var q = Q[qi];
  var h = '<div class="analysis"><h3>Why each option is right or wrong</h3>';
  h += '<p class="why good">Correct answer: ' + L[q.ans] + '. '
     + q.opts[q.ans] + '</p><p>' + q.exp + '</p>';
  for (var j = 0; j < q.opts.length; j++){
    h += '<p><span class="why">' + L[j] + '.</span> ' + q.why[j] + '</p>';
  }
  h += '</div>';
  el('ex' + qi).innerHTML = h;
}

function tally(){
  var n = 0;
  for (var i = 0; i < qlen; i++){ if (correct[i]) n++; }
  return n;
}

function updateBar(){
  el('counter').textContent = 'Question ' + (cur + 1) + ' of ' + qlen;
  var pct = Math.round(((cur + 1) / qlen) * 100);
  el('pinner').style.width = pct + '%';
  var pb = el('pbar');
  if (pb){ pb.setAttribute('aria-valuenow', String(cur + 1)); }
}

el('next').addEventListener('click', function(){
  if (cur < qlen - 1){ cur++; render(); }
});
el('submit').addEventListener('click', function(){ showResults(false); });

function mark(){
  var c = tally();
  var p = Math.round((c / qlen) * 100);
  el('pct').textContent = p + '%';
  el('ncorrect').textContent = c;
  el('nwrong').textContent = qlen - c;
  el('ntotal').textContent = qlen;
  var g = el('gauge');
  var pass = (p >= PASS);
  g.style.background = pass ? '#dff3e1' : '#fbe3e3';
  g.style.border = '8px solid ' + (pass ? '#2e7d32' : '#c62828');
  el('verdictlbl').textContent = pass ? 'PASS' : 'NOT YET';
  el('verdictlbl').style.color = pass ? '#2e7d32' : '#c62828';
  el('pct').style.color = pass ? '#2e7d32' : '#c62828';
  el('dignote').textContent = pass
    ? 'You have met the pass standard for this section. Revisit any missed items below, then move on.'
    : 'Below the pass standard of ' + PASS + '%. Review each missed item below and retake when ready.';
  var ul = el('missed');
  ul.innerHTML = '';
  var missed = 0;
  for (var i = 0; i < qlen; i++){
    if (!correct[i]){
      missed++;
      var li = document.createElement('li');
      li.style.marginBottom = '8px';
      li.textContent = Q[i].q + ', correct: ' + L[Q[i].ans] + '. ' + Q[i].opts[Q[i].ans];
      ul.appendChild(li);
    }
  }
  if (missed === 0){
    var li2 = document.createElement('li');
    li2.textContent = 'No missed items.';
    ul.appendChild(li2);
  }
}

function showResults(force){
  if (submitted && !force) return;
  submitted = true;
  mark();
  el('quiz').style.display = 'none';
  el('results').style.display = 'block';
  window.scrollTo(0, 0);
}

el('restart').addEventListener('click', function(){
  var p = window.prompt('Enter supervisor passcode to reset this assessment:');
  if (p !== '1234'){
    if (p !== null){ window.alert('Incorrect passcode. Assessment not reset.'); }
    return;
  }
  location.reload();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && !answered[cur] === false && cur < qlen - 1){
    e.preventDefault(); cur++; render();
  }
});

// ---- Assessment integrity guard ----
// Deterrent only: browser menus can bypass keyboard blocks and the HTML source
// always contains the questions. Pair with invigilation for real integrity.
(function integrityGuard(){
  var tc = null;
  function toast(msg){
    var t = el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    if (tc) clearTimeout(tc);
    tc = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }
  function block(e, msg){
    e.preventDefault();
    e.stopPropagation();
    toast(msg || 'Copying is disabled on this assessment.');
    return false;
  }
  document.addEventListener('contextmenu', function(e){ block(e); });
  document.addEventListener('copy', function(e){ block(e); });
  document.addEventListener('cut', function(e){ block(e); });
  document.addEventListener('dragstart', function(e){ block(e, 'Dragging is disabled.'); });
  document.addEventListener('selectstart', function(e){
    var n = e.target;
    while (n && n !== document.body){
      if (n.id === 'qholder' || n.id === 'results' ||
          (n.classList && (n.classList.contains('opt') || n.classList.contains('analysis')))){
        block(e, 'Selecting question text is disabled.');
        return;
      }
      n = n.parentNode;
    }
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'a' || k === 'u' || k === 's' || k === 'p')){
      block(e); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){
      block(e, 'Developer tools are disabled.'); return;
    }
    if (e.key === 'F12'){ block(e, 'Developer tools are disabled.'); }
  }, true);
})();

render();
</script>
<script>
(function () {
  function native(){ return typeof window.Capacitor!=='undefined' && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform(); }
  function setup(){
    if(!native()){return;}
    var App = window.Capacitor.Plugins && window.Capacitor.Plugins.App; if(!App){return;}
    var t=null,b=0;
    function toast(m){ if(!t){t=document.createElement('div'); t.className='app-toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=m; t.classList.add('show'); clearTimeout(t._z); t._z=setTimeout(function(){t.classList.remove('show');},2200); }
    App.addListener('backButton', function(info){ var cb=info&&info.canGoBack;
      if(cb){ if(window.history.length>1){window.history.back();} else {window.location.href=window.location.origin+'/';} return; }
      var n=Date.now(); if(n-b<2200){App.exitApp(); return;} b=n; toast('Press back again to exit');
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',setup);}else{setup();}
})();
</script>
