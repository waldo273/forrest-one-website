var questions = [{"q":"What does auto-MDIX allow a switch port to do?","opts":["Automatically negotiate duplex settings","Detect and configure the correct cable type","Automatically assign VLAN membership","Detect connected device speed"],"ans":1,"exp":"Auto-MDIX automatically detects whether a straight-through or crossover cable is needed and configures the connection accordingly."},{"q":"Which protocols can be used to negotiate an EtherChannel?","opts":["STP and VTP","DTP and PAgP","PAgP and LACP","CDP and LLDP"],"ans":2,"exp":"PAgP (Port Aggregation Protocol) is Cisco proprietary, and LACP (Link Aggregation Control Protocol, IEEE 802.3ad) is the open standard."},{"q":"What is a Basic Service Set (BSS) in 802.11?","opts":["A single AP and all associated wireless clients","A group of routers in the same area","A VLAN on a wireless controller","A group of switches in a stack"],"ans":0,"exp":"A BSS consists of a single AP interconnecting all associated wireless clients. Clients in different BSSs cannot communicate directly."},{"q":"Which two terms describe frames entering and leaving a switch interface?","opts":["Upstream and downstream","Ingress and egress","Source and destination","Input and output"],"ans":1,"exp":"Ingress refers to frames entering an interface; egress refers to frames exiting an interface."},{"q":"Which EtherChannel load-balancing method is commonly used on Cisco switches?","opts":["Source and destination IP address","First packet only","Round-robin","VLAN ID"],"ans":0,"exp":"Cisco switches default to source and destination IP address load balancing, ensuring packets in the same flow use the same physical link."},{"q":"Why does 802.11 use CSMA/CA instead of CSMA/CD?","opts":["Wireless devices cannot detect collisions while transmitting","CSMA/CA is more secure","Wireless is faster than wired","CSMA/CD is not an IEEE standard"],"ans":0,"exp":"Wireless devices cannot detect collisions (they cannot hear their own transmission while transmitting), so 802.11 uses collision avoidance instead of collision detection."},{"q":"What is the default timeout for a MAC address table entry on a Cisco switch?","opts":["30 seconds","2 minutes","5 minutes","10 minutes"],"ans":2,"exp":"The default aging time for MAC address table entries is 5 minutes. The timer resets each time the switch receives a frame from that source."},{"q":"When an interface is added to an EtherChannel, what happens to STP?","opts":["STP is disabled for channel members","STP treats each link independently","STP runs on each physical link separately","STP runs on the logical EtherChannel interface not individual links"],"ans":3,"exp":"STP treats the EtherChannel as a single logical interface. If one physical link fails, traffic is redistributed across the remaining links without STP reconvergence."},{"q":"What is the purpose of a Wireless LAN Controller (WLC)?","opts":["To provide DHCP services to wireless clients","To replace all APs in the network","To centrally manage and control multiple lightweight APs","To act as a firewall for wireless traffic"],"ans":2,"exp":"A WLC provides centralised management of lightweight APs, handling configuration, security policies, roaming, firmware updates, and radio resource management."},{"q":"What is the first step in STPs loop-free topology process?","opts":["Elect root ports","Elect alternate ports","Elect designated ports","Elect the root bridge"],"ans":3,"exp":"The first step is to elect the root bridge. Only then can root ports, designated ports, and alternate ports be determined."},{"q":"What is the purpose of a DHCP server?","opts":["To translate private IPs to public IPs","To resolve domain names to IP addresses","To dynamically assign IP addresses and configuration parameters to hosts","To provide secure remote access"],"ans":2,"exp":"DHCP (Dynamic Host Configuration Protocol) automatically assigns IP addresses, subnet masks, default gateways, and DNS servers to clients."},{"q":"What is the difference between split-MAC and local-MAC in WLC architectures?","opts":["Split-MAC distributes functions between AP and WLC; local-MAC processes everything at the AP","Split-MAC uses two WLCs; local-MAC uses one","Split-MAC is for data only; local-MAC is for management","Split-MAC is used in autonomous APs; local-MAC is used in lightweight APs"],"ans":0,"exp":"In split-MAC, real-time functions (beacons, probe responses) occur at the AP while management functions (authentication, roaming) occur at the WLC. Local-MAC does everything at the AP."},{"q":"What is the default bridge priority on a Cisco switch?","opts":["4096","65536","32768","8192"],"ans":2,"exp":"The default bridge priority on Cisco switches is 32768. All values are multiples of 4096."},{"q":"Which command sets the default gateway in a DHCP pool on a Cisco router?","opts":["dns-server 192.168.1.1","default-router 192.168.1.1","option 3 192.168.1.1","gateway 192.168.1.1"],"ans":1,"exp":"The default-router address DHCP pool configuration command specifies the default gateway address provided to DHCP clients."},{"q":"What security method is recommended for wireless networks today?","opts":["WPA2-PSK with TKIP","WEP","WPA2/WPA3 with AES/CCMP","Open authentication"],"ans":2,"exp":"WPA2 or WPA3 with AES/CCMP encryption is the recommended wireless security. WEP is deprecated and WPA2 with TKIP is less secure."},{"q":"What does 802.1Q tagging do to frames on a trunk link?","opts":["Compresses the frame for faster transmission","Encrypts the frame payload","Inserts a VLAN tag in the frame header","Adds a CRC checksum"],"ans":2,"exp":"802.1Q inserts a 4-byte VLAN tag into the Ethernet frame header to identify which VLAN the frame belongs to."},{"q":"Which command enables DHCP relay on a router interface?","opts":["dhcp forward server-ip","ip dhcp forwarder server-ip","ip helper-address server-ip","ip dhcp relay"],"ans":2,"exp":"The ip helper-address server-ip interface command configures the router to forward DHCP broadcasts as unicasts to the specified DHCP server."},{"q":"What is a rogue access point?","opts":["An AP with outdated firmware","An unauthorised AP connected to the network","An AP with a weak signal","An AP configured with the wrong SSID"],"ans":1,"exp":"A rogue AP is an unauthorised wireless device connected to the network without the network administrators approval, creating a potential backdoor."},{"q":"How does a VoIP phone know which VLAN to use for voice traffic?","opts":["Through manual configuration on the phone","Through CDP from the switch","Through ARP","Through DHCP option 150"],"ans":1,"exp":"The switch uses CDP (Cisco Discovery Protocol) to inform the VoIP phone of the voice VLAN assignment."},{"q":"How often does a router send IPv6 Router Advertisements by default?","opts":["Every 200 seconds","Every 600 seconds","Every 30 seconds","Every 60 seconds"],"ans":0,"exp":"Cisco routers send RA messages every 200 seconds to the IPv6 all-nodes multicast address ff02::1."},{"q":"What are the steps to configure a basic WLAN on a WLC?","opts":["Enable the radio configure IP test connectivity","Create the WLAN apply and enable select interface secure verify","Create SSID enable DHCP set passwords","Install AP configure switch port set VLAN"],"ans":1,"exp":"The standard steps are: 1) Create the WLAN with an SSID, 2) Apply and enable, 3) Select the interface, 4) Secure the WLAN, 5) Verify."},{"q":"Which show command verifies subinterface configuration on a router?","opts":["show running-config interface","show interfaces","show ip route","show interfaces trunk"],"ans":1,"exp":"The show interfaces command displays subinterface status, encapsulation, and IP addressing. show interfaces trunk is for switches."},{"q":"What is the purpose of DHCPv6?","opts":["To replace DNS","To secure IPv6 traffic","To assign IPv4 addresses","To assign IPv6 addresses and provide configuration parameters"],"ans":3,"exp":"DHCPv6 provides stateful address assignment and other configuration parameters (like DNS server addresses) for IPv6 hosts."},{"q":"What is Cisco Express Forwarding (CEF)?","opts":["An encryption protocol","A routing protocol","The most recent and default Cisco IOS packet forwarding mechanism","A switching method for VLANs"],"ans":2,"exp":"CEF is Ciscos default packet forwarding mechanism. It builds a Forwarding Information Base (FIB) and adjacency table for efficient, topology-driven forwarding."},{"q":"Which command creates an SVI on a multilayer switch?","opts":["vlan 10","interface vlan 10","interface fastEthernet 0/1","svi vlan 10"],"ans":1,"exp":"The interface vlan vlan-id command creates an SVI and enters interface configuration mode for Layer 3 switching."},{"q":"What is the virtual IP address in HSRP?","opts":["The IP of the standby router","The management IP of the switch","The IP of the active router","A shared IP configured on both routers for clients to use as their default gateway"],"ans":3,"exp":"HSRP configures a virtual IP address that clients use as their default gateway. Both routers share this virtual IP, but only the active router responds."},{"q":"What is a directly connected static route?","opts":["A route pointing to a directly connected router","A route with administrative distance 0","A route learned via a routing protocol","A route using only the exit interface instead of a next-hop IP"],"ans":3,"exp":"A directly connected static route specifies only the exit interface (e.g., ip route 172.16.1.0 255.255.255.0 s0/1/0). It should only be used on point-to-point serial interfaces."},{"q":"What is the purpose of the service password-encryption command?","opts":["Encrypts plaintext passwords in the running configuration","Encrypts all data traffic","Encrypts the enable secret","Enables SSH encryption"],"ans":0,"exp":"The service password-encryption command encrypts plaintext passwords displayed in the running configuration using a Cisco proprietary algorithm."},{"q":"What is the function of AAA accounting?","opts":["Collects and reports usage data including login times and commands executed","Encrypts user passwords","Assigns IP addresses to users","Manages VLAN assignments"],"ans":0,"exp":"AAA accounting tracks and logs what authenticated users do on the network start/stop times, commands executed, packets sent, and bytes used."},{"q":"How is a default static route configured for IPv6?","opts":["ipv6 route default next-hop","ipv6 route ::/0 next-hop","ipv6 default-route next-hop","ipv6 route 0::0 next-hop"],"ans":1,"exp":"An IPv6 default static route uses ipv6 route ::/0 next-hop-ip-address-or-exit-interface."},{"q":"Which two steps are required to configure SSH on a Cisco switch?","opts":["Configure a hostname and domain name","Configure SNMP community strings","Enable HTTP server","Set the enable password"],"ans":0,"exp":"SSH requires a hostname, domain name, and RSA key pair to be generated using crypto key generate rsa."},{"q":"Which command enables port security on a switch interface?","opts":["security port enable","port-security enable","port security on","switchport port-security"],"ans":3,"exp":"The switchport port-security interface command enables port security on a specific switch port."},{"q":"What happens when a router receives a packet for a network not in its routing table?","opts":["It forwards the packet out all interfaces","It drops the packet and may send an ICMP Destination Unreachable (Network Unreachable)","It sends an ICMP redirect","It caches the packet and waits for a route"],"ans":1,"exp":"If no route exists, the router drops the packet and sends an ICMP Destination Unreachable message back to the source indicating the network is unreachable."},{"q":"Which switching method forwards the frame as soon as the destination MAC address is received?","opts":["Adaptive switching","Store-and-forward switching","Fragment-free switching","Cut-through switching"],"ans":3,"exp":"Cut-through switching begins forwarding the frame as soon as the destination MAC address is read, reducing latency."},{"q":"How do you re-enable a port that is in error-disabled state due to a port security violation?","opts":["Issue shutdown then no shutdown on the interface","Reboot the switch","Remove port security configuration","Delete the MAC address table"],"ans":0,"exp":"To recover an error-disabled port, first issue the shutdown command, then the no shutdown interface command."},{"q":"Which command shows the IPv4 routing table on a Cisco router?","opts":["show route","show ip route","display routing-table","show routing-table"],"ans":1,"exp":"The show ip route command displays the IPv4 routing table including directly connected, static, and dynamic routes."},{"q":"What does the duplex setting on a switch port refer to?","opts":["The port security mode","The speed of data transmission","The ability to send and receive simultaneously","The VLAN assignment"],"ans":2,"exp":"Duplex refers to whether the interface can send and receive data simultaneously (full duplex) or only one direction at a time (half duplex)."},{"q":"What is DHCP snooping?","opts":["Monitoring DHCP traffic for troubleshooting","A feature that speeds up DHCP assignment","A security feature that filters untrusted DHCP messages","A protocol for DHCP redundancy"],"ans":2,"exp":"DHCP snooping is a security feature that filters DHCP messages on untrusted ports (typically access ports) to prevent rogue DHCP server attacks."},{"q":"What happens to a directly connected route if the interface goes down?","opts":["It becomes a floating route","It is converted to a static route","It is automatically removed from the routing table","It remains in the routing table"],"ans":2,"exp":"Directly connected routes are dynamically added and removed based on interface status. When the interface goes down, the route is removed."},{"q":"What is the purpose of VLANs in a network?","opts":["To encrypt traffic","To increase bandwidth","To provide redundancy","To logically segment a network into separate broadcast domains"],"ans":3,"exp":"VLANs logically segment a switched network into separate broadcast domains, improving security and reducing broadcast traffic."},{"q":"What attack does DAI primarily prevent?","opts":["ARP spoofing (man-in-the-middle)","MAC flooding","VLAN hopping","DHCP starvation"],"ans":0,"exp":"DAI prevents ARP spoofing attacks where an attacker sends forged ARP replies to associate their MAC address with the IP of a legitimate device."},{"q":"What is a routing loop?","opts":["A physical loop in the cable","A loopback interface configuration","A path that visits every router","A situation where packets continuously circulate between routers"],"ans":3,"exp":"A routing loop occurs when routers have incorrect routing information causing packets to cycle between routers until the TTL expires."},{"q":"What is the purpose of a trunk port?","opts":["To carry traffic for multiple VLANs between switches","To connect a switch to a single host","To connect only to routers","To provide PoE to devices"],"ans":0,"exp":"A trunk port carries traffic for multiple VLANs between switches (or between a switch and a router) using 802.1Q tagging."},{"q":"Which protocol does 802.1X use between the authenticator and supplicant?","opts":["RADIUS","EAPoL (EAP over LAN)","LDAP","TACACS+"],"ans":1,"exp":"EAPoL (EAP over LAN) encapsulates Extensible Authentication Protocol (EAP) messages between the supplicant and the authenticator over the LAN."},{"q":"Which command checks whether a static route is in the routing table?","opts":["show ip route static","show cdp neighbors","show ip interface brief","show running-config include ip route"],"ans":0,"exp":"The show ip route static command filters the routing table to display only static routes, along with their administrative distance and metric."},{"q":"Which command assigns a port to a specific VLAN?","opts":["vlan 10 port","set vlan 10","switchport access vlan 10","assign vlan 10"],"ans":2,"exp":"The switchport access vlan vlan-id command assigns an access port to a specific VLAN."},{"q":"What is a MAC flooding attack?","opts":["Sending multiple DHCP requests","Overloading the CPU with ARP requests","Flooding the network with MAC addresses to overflow the CAM table","Generating excessive BPDU packets"],"ans":2,"exp":"MAC flooding sends many frames with different spoofed source MAC addresses to fill the switchs CAM table, causing the switch to fail-open and flood traffic."},{"q":"What happens to a static route when the exit interface used by that route goes down?","opts":["The route becomes a floating route","The static route is automatically removed from the routing table","The static route stays in the routing table","The route is redistributed into the dynamic protocol"],"ans":1,"exp":"Cisco IOS automatically removes static routes from the routing table if the configured next-hop interface goes down."},{"q":"What happens if you ping from a host in VLAN 10 to a host in VLAN 20 without a router or Layer 3 switch?","opts":["The ping fails because VLANs are separate broadcast domains","The ping succeeds if STP is disabled","The ping succeeds","The ping succeeds if the switch is in VTP server mode"],"ans":0,"exp":"VLANs are separate Layer 2 broadcast domains. Without inter-VLAN routing (router or Layer 3 switch), devices in different VLANs cannot communicate."},{"q":"What does BPDU guard do?","opts":["Speeds up STP convergence","Disables a port configured with PortFast if a BPDU is received","Filters BPDUs on trunk ports","Prevents loops by blocking BPDUs"],"ans":1,"exp":"BPDU guard puts a PortFast-enabled port into error-disabled state if it receives a BPDU, preventing potential STP loops from unauthorised switch connections."},{"q":"Which of the following is a reason a static route might fail?","opts":["The route uses a different routing protocol","The metric is too low","The next-hop IP is unreachable or the exit interface is down","The administrative distance is too high"],"ans":2,"exp":"A static route fails when the next-hop IP address is unreachable or the configured exit interface is down. The router must have a route to the next-hop itself."},{"q":"What is Rapid PVST+?","opts":["An earlier version of STP","Ciscos implementation of Rapid STP (802.1w) per VLAN","A trunking protocol","A routing protocol"],"ans":1,"exp":"Rapid PVST+ is Ciscos implementation of the IEEE 802.1w Rapid Spanning Tree Protocol, running per VLAN for faster convergence."},{"q":"How is a rogue DHCP server prevented?","opts":["Using ACLs","Using port security","Using DHCP snooping to filter DHCP offers from untrusted ports","Using STP root guard"],"ans":2,"exp":"DHCP snooping marks uplink ports as trusted (where legitimate DHCP servers are) and access ports as untrusted, dropping DHCP offers from untrusted ports."},{"q":"What is the command to configure a static route on a Cisco router?","opts":["static-route network mask next-hop","route add network mask next-hop","ip route network mask next-hop","config route network mask next-hop"],"ans":2,"exp":"The correct command is ip route destination-network subnet-mask next-hop-ip-address-or-exit-interface."},{"q":"What is a potential problem when using VLAN 1 as the native VLAN on all trunk links?","opts":["VLAN 1 is susceptible to VLAN hopping attacks","VLAN 1 cannot carry voice traffic","VLAN 1 has higher latency","VLAN 1 disables STP"],"ans":0,"exp":"Using VLAN 1 as the native VLAN is a security risk as it makes the network more susceptible to VLAN hopping attacks. Best practice is to change the native VLAN to an unused VLAN."},{"q":"What is the purpose of switchport nonegotiate?","opts":["Forces trunking without negotiation","Enables VTP pruning","Disables DTP on the interface","Automatically negotiates the trunk mode"],"ans":2,"exp":"The switchport nonegotiate command disables DTP frames on the interface. Trunk mode must be manually configured with switchport mode trunk."},{"q":"Why is it recommended to use a next-hop IP address rather than an exit interface for Ethernet static routes?","opts":["It consumes less memory","It is faster to converge","It is more secure","Ethernet is a multi-access medium requiring the next-hop MAC address"],"ans":3,"exp":"On Ethernet (multi-access), the router must know the next-hop IP to resolve its MAC address via ARP. Using only an exit interface does not provide this."},{"q":"How does a switch handle an unknown unicast frame when no MAC address entry exists for the destination?","opts":["Drops the frame and logs an error","Sends an ICMP redirect","Floods the frame out all ports except the receiving port","Broadcasts an ARP request"],"ans":2,"exp":"Unknown unicast flooding sends the frame out all ports except the ingress port, hoping the destination device responds and its MAC address can be learned."},{"q":"Which Cisco protocol is used between an AP and WLC for management?","opts":["HTTP","SNMP","CAPWAP","SSH"],"ans":2,"exp":"CAPWAP (Control and Provisioning of Wireless Access Points) is the IETF standard protocol used between lightweight APs and WLCs."},{"q":"What is the purpose of the ip default-gateway command on a switch?","opts":["To configure a static route","To enable NAT","To set the default gateway for management traffic when IP routing is disabled","To route between VLANs"],"ans":2,"exp":"The ip default-gateway command sets the default gateway for management traffic (Telnet, SSH, SNMP) on a Layer 2 switch that does not have IP routing enabled."}];
var qlen = 60;
var current = 0;

/* ── Randomise on every start ──
   Shuffle the question order AND the options within each question (remapping
   the correct-answer index), so each fresh load presents a different paper.
   A Fisher-Yates shuffle is used. Stale saved state is cleared because the
   previous session's order no longer matches. */
function shuffleArray(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
(function () {
  shuffleArray(questions);
  for (var qi = 0; qi < questions.length; qi++) {
    var q = questions[qi];
    var order = [0, 1, 2, 3];
    shuffleArray(order);
    var newOpts = [], newAns = -1;
    for (var oi = 0; oi < order.length; oi++) {
      newOpts.push(q.opts[order[oi]]);
      if (order[oi] === q.ans) newAns = oi;
    }
    q.opts = newOpts;
    q.ans = newAns;
  }
  try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
})();

var answered = new Array(60).fill(false);
var selected = new Array(60).fill(-1);
var correct = new Array(60).fill(false);
var submitted = false;

function restoreState() {
  try {
    var saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
      var state = JSON.parse(saved);
      current = state.current || 0;
      answered = state.answered || new Array(60).fill(false);
      selected = state.selected || new Array(60).fill(-1);
      correct = state.correct || new Array(60).fill(false);
      submitted = state.submitted || false;
      return true;
    }
  } catch(e) {}
  return false;
}

function saveState() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
      current: current, answered: answered, selected: selected,
      correct: correct, submitted: submitted
    }));
  } catch(e) {}
}

function clearState() {
  try { sessionStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

restoreState();

    var q = questions[i];

    h += '<div class="options" id="opts-' + i + '">';
    for (var j = 0; j < q.opts.length; j++) {
      h += '<label id="optlabel-' + i + '-' + j + '"><input type="radio" name="q' + i + '" value="' + j + '" id="opt-' + i + '-' + j + '"><span class="opt-letter">' + L[j] + '.</span><span class="op-text">' + q.opts[j] + '</span></label>';
    }
    h += '</div>';
    h += '<div class="explanation" id="expl-' + i + '"><div class="exp-label" id="expl-label-' + i + '"></div><span id="expl-text-' + i + '">' + q.exp + '</span></div>';
    h += '</div>';
  }
  container.innerHTML = h;
}

function restoreUI() {
  for (var i = 0; i < 60; i++) {
    if (!answered[i]) continue;
    var inp = document.querySelectorAll('input[name="q' + i + '"]');
    var lbs = document.querySelectorAll('#opts-' + i + ' label');
    for (var x = 0; x < inp.length; x++) inp[x].disabled = true;
    for (var y = 0; y < lbs.length; y++) lbs[y].classList.add('selected');
    var ca = questions[i].ans;
    document.getElementById('optlabel-' + i + '-' + ca).classList.add('correct');
    if (selected[i] !== ca) {
      var wl = document.getElementById('optlabel-' + i + '-' + selected[i]);
      if (wl) wl.classList.add('incorrect');
    }
    var expl = document.getElementById('expl-' + i);
    var explLabel = document.getElementById('expl-label-' + i);
    if (correct[i]) { expl.classList.add('correct'); explLabel.textContent = 'Correct!'; }
    else { expl.classList.add('incorrect'); explLabel.textContent = 'Incorrect.'; }
  }
  if (submitted) showFinalResults();
}

function showQuestion(idx) {
  var cards = document.querySelectorAll('.question-card');
  for (var c = 0; c < cards.length; c++) cards[c].classList.remove('active');
  var card = document.getElementById('qcard-' + idx);
  if (card) card.classList.add('active');
  currentQSpan.textContent = idx + 1;
  var isLast = idx === 59;
  nextBtn.style.display = isLast ? 'none' : '';
  submitBtn.style.display = isLast ? '' : 'none';
  saveState();
}

function handleSelect(qIdx, optIdx) {
  if (answered[qIdx]) return;
  var inp = document.querySelectorAll('input[name="q' + qIdx + '"]');
  var lbs = document.querySelectorAll('#opts-' + qIdx + ' label');
  for (var x = 0; x < inp.length; x++) inp[x].disabled = true;
  for (var y = 0; y < lbs.length; y++) lbs[y].classList.add('selected');
  selected[qIdx] = optIdx;
  answered[qIdx] = true;
  var ca = questions[qIdx].ans;
  var isCorrect = optIdx === ca;
  correct[qIdx] = isCorrect;
  document.getElementById('optlabel-' + qIdx + '-' + ca).classList.add('correct');
  if (!isCorrect) {
    document.getElementById('optlabel-' + qIdx + '-' + optIdx).classList.add('incorrect');
  }
  var expl = document.getElementById('expl-' + qIdx);
  var explLabel = document.getElementById('expl-label-' + qIdx);
  if (isCorrect) { expl.classList.add('correct'); explLabel.textContent = 'Correct!'; }
  else { expl.classList.add('incorrect'); explLabel.textContent = 'Incorrect.'; }
  saveState();
}

function showFinalResults() {
  var total = 0;
  for (var i = 0; i < 60; i++) { if (correct[i]) total++; }
  var pct = Math.round((total / 60) * 100);
  document.querySelectorAll('.nav-buttons, .progress, .question-card').forEach(function(el) { el.style.display = 'none'; });
  resultCard.classList.add('active');
  var scoreEl = document.getElementById('score-display');
  scoreEl.textContent = pct + '%';
  scoreEl.className = 'score-big ' + (pct >= 60 ? 'score-pass' : 'score-fail');
  document.getElementById('correct-count').textContent = total + ' of 60 correct';
  var passEl = document.getElementById('pass-status');
  passEl.innerHTML = pct >= 60
    ? '<span class="pass">PASS</span> — You met the 60% pass mark.'
    : '<span class="fail">FAIL</span> — You did not meet the 60% pass mark.';
  saveState();
}

container.addEventListener('click', function(e) {
  if (submitted) return;
  var label = e.target.closest('label');
  if (!label || !label.id || label.id.indexOf('optlabel-') !== 0) return;
  var input = label.querySelector('input[type="radio"]');
  if (!input || input.disabled) return;
  var parts = label.id.split('-');
  handleSelect(parseInt(parts[1]), parseInt(parts[2]));
});

nextBtn.addEventListener('click', function() {
  if (current < 59) { current++; showQuestion(current); }
});

submitBtn.addEventListener('click', function() {
  submitted = true;
  showFinalResults();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' && nextBtn.style.display !== 'none') nextBtn.click();
  if (e.key === 'Enter' && submitBtn.style.display !== 'none') submitBtn.click();
});

document.getElementById('reset-btn').addEventListener('click', function() {
  answered = new Array(60).fill(false);
  selected = new Array(60).fill(-1);
  correct = new Array(60).fill(false);
  current = 0;
  submitted = false;
  clearState();
  document.querySelectorAll('.nav-buttons, .progress, .question-card').forEach(function(el) { el.style.display = ''; });
  nextBtn.style.display = '';
  submitBtn.style.display = 'none';
  resultCard.classList.remove('active');
  for (var i = 0; i < 60; i++) {
    var inp = document.querySelectorAll('input[name="q' + i + '"]');
    for (var x = 0; x < inp.length; x++) { inp[x].checked = false; inp[x].disabled = false; }
    var lbs = document.querySelectorAll('#opts-' + i + ' label');
    for (var y = 0; y < lbs.length; y++) lbs[y].className = '';
    var ex = document.getElementById('expl-' + i);
    ex.className = 'explanation';
    ex.style.display = 'none';
  }
  showQuestion(0);
});

buildQuestions();
restoreUI();
showQuestion(current);
if (submitted) showFinalResults();
})();
</script>
<script>
/* Exam integrity guard: blocks right-click, copy, and common shortcut exfiltration routes (client-side deterrent only) */
(function () {
  'use strict';

  var toast = null;

  function showNotice() {
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'copy-protect-notice';
      toast.setAttribute('role', 'status');
      toast.setAttribute('aria-live', 'polite');
      toast.textContent = 'Copying is disabled on this assessment.';
      var s = toast.style;
      s.position = 'fixed'; s.bottom = '16px'; s.left = '50%'; s.transform = 'translateX(-50%)';
      s.background = '#002b5c'; s.color = '#ffffff'; s.padding = '10px 20px';
      s.borderRadius = '8px'; s.fontSize = '.9rem'; s.fontWeight = '700';
      s.boxShadow = '0 4px 12px rgba(0,0,0,.25)'; s.zIndex = '9999';
      s.fontFamily = 'Arial, Helvetica, sans-serif'; s.display = 'none';
      document.body.appendChild(toast);
    }
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.style.display = 'none'; }, 2500);
  }

  function nope(e) { e.preventDefault(); }
  function nopeAndWarn(e) { e.preventDefault(); showNotice(); }

  document.addEventListener('contextmenu', nopeAndWarn);
  document.addEventListener('copy', nopeAndWarn);
  document.addEventListener('cut', nopeAndWarn);
  document.addEventListener('paste', nopeAndWarn);
  document.addEventListener('dragstart', nope);

  var root = document.documentElement;
  root.style.userSelect = 'none';
  root.style.webkitUserSelect = 'none';
  root.style.webkitTouchCallout = 'none';
  document.body.style.userSelect = 'none';
  document.body.style.webkitUserSelect = 'none';

  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (e.key === 'F12') { e.preventDefault(); showNotice(); return; }
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) { e.preventDefault(); showNotice(); return; }
    if (k === 'c' || k === 'x' || k === 'u' || k === 's' || k === 'p' || k === 'v') { e.preventDefault(); showNotice(); }
  });
})();
</script>
